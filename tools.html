<!DOCTYPE html>

<head>

<title>功能合集 · 苔石 MOSSYMC</title>
<link rel="stylesheet" href="ui.css">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px, 48px 48px;
    background-position:-1px -1px, -1px -1px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 0%, transparent 30%, var(--bg) 85%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:860px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    color:var(--moss);
    margin:0 0 10px;
  }
  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--text);
  }
  h1 .hl{ color:var(--moss); text-shadow:0 0 16px var(--glow); }
  .sub{
    margin:0 0 36px;
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.04em;
  }
  .cat{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.12em;
    color:var(--text-dim);
    margin:34px 0 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .cat::after{
    content:"";
    flex:1;
    height:2px;
    background:var(--line);
  }
  .cat .warn{
    color:var(--coral);
    font-size:11px;
    letter-spacing:.05em;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  a.card{
    display:block;
    padding:18px 20px;
    background:var(--panel);
    border:2px solid var(--line-strong);
    box-shadow:var(--hard);
    text-decoration:none;
    color:inherit;
    transition:transform .12s, box-shadow .12s, border-color .15s;
  }
  a.card:hover{
    border-color:var(--moss);
    transform:translate(2px, 2px);
    box-shadow:2px 2px 0 rgba(0,0,0,.45);
  }
  a.card .name{
    font-family:var(--mono);
    font-size:15px;
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:6px;
    color:var(--text);
  }
  a.card:hover .name{ color:var(--moss); }
  a.card .desc{
    font-size:12px;
    line-height:1.6;
    color:var(--text-dim);
  }
  a.card .tag{
    display:inline-block;
    margin-top:10px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    padding:3px 8px;
    border:1px solid var(--line-strong);
    color:var(--text-dim);
  }
  a.card.horror .tag{ border-color:rgba(224,108,92,.5); color:var(--coral); }
</style>
</head>

  </div>
</div>
