<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>身后问卷</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
html { -webkit-text-size-adjust:100%; }
button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

body {
  background:#07080b;
  color:#b8bfc9;
  font-family:'Songti SC','SimSun','Noto Serif SC','Microsoft YaHei',serif;
  -webkit-font-smoothing:antialiased;
  transition:background 1.2s;
  letter-spacing:.03em;
  overflow-x:hidden;
}

/* 全屏细框：像遗像外框 */
body::after {
  content:''; position:fixed; inset:10px;
  border:1px solid rgba(120,120,130,0.18);
  pointer-events:none; z-index:60;
}
@media (max-width:640px) { body::after { inset:6px; } }

.screen {
  position:fixed; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:40px 28px;
}
#quiz { cursor:none; }
.hidden { display:none !important; }

button { font-family:inherit; cursor:pointer; }

/* 按钮：像朱砂印，不是网页按钮 */
.btn {
  background:transparent;
  color:#9aa3b0;
  border:none;
  border-bottom:1px solid rgba(120,120,130,0.35);
  padding:10px 8px;
  font-size:14px; letter-spacing:.35em;
  transition:color .25s, border-color .25s, text-shadow .25s;
  position:relative;
}
.btn:hover {
  color:#c45c5c;
  border-bottom-color:#c45c5c;
  text-shadow:0 0 12px rgba(196,92,92,0.35);
}
.btn::after {
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:#c45c5c; transform:scaleX(0); transform-origin:left;
  transition:transform .3s ease;
}
.btn:hover::after { transform:scaleX(1); }

/* ===== 同意页：竖排牌位感 ===== */
#consent { gap:0; }
#consent h1 {
  writing-mode:vertical-rl;
  text-orientation:upright;
  font-weight:400;
  letter-spacing:.6em;
  font-size:32px;
  margin-bottom:36px;
  color:#d0d5dd;
  text-shadow:0 0 24px rgba(180,180,200,0.12);
  height:auto;
}
#consent .warn {
  font-size:13px; line-height:2.2; text-align:center;
  max-width:360px; margin-bottom:14px;
  color:#8a919e;
}
#consent .tiny {
  font-size:11px; color:#5c6370; line-height:2;
  text-align:center; max-width:380px; margin-bottom:44px;
  letter-spacing:.08em;
}
#consent .actions { display:flex; gap:36px; }

/* 香位进度：右侧竖排点 */
#progress {
  position:fixed; top:50%; right:22px;
  transform:translateY(-50%);
  writing-mode:vertical-rl;
  font-size:11px; color:#4a5060; letter-spacing:.4em;
  user-select:none;
  font-variant-numeric:tabular-nums;
}
@media (max-width:640px) { #progress { right:12px; font-size:10px; } }

/* 题干：大、疏、像悼词 */
#qtext {
  font-size:24px; line-height:2.3; text-align:center;
  max-width:520px; margin:20px 0 40px;
  color:#d2d7e0;
  font-weight:400;
  text-shadow:0 0 20px rgba(0,0,0,0.6);
}
#qtext .sub {
  display:block; margin-top:28px;
  font-size:11px; color:#6a7080; letter-spacing:.2em;
  font-style:normal;
}

/* 选项：灵位长条，左对齐，选中像盖章 */
#options { width:380px; max-width:92vw; }
.opt {
  display:block; width:100%;
  border:none;
  border-left:2px solid rgba(100,100,115,0.3);
  margin:0 0 2px;
  padding:14px 20px;
  font-size:14px;
  letter-spacing:.12em;
  background:linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 70%);
  color:#8a919e;
  text-align:left;
  transition:all .2s ease;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.opt:hover {
  border-left-color:#c45c5c;
  color:#d0d5dd;
  background:linear-gradient(90deg, rgba(196,92,92,0.1) 0%, transparent 70%);
  padding-left:28px;
}
.opt.sel {
  border-left-color:#c45c5c;
  color:#e8d0d0;
  background:linear-gradient(90deg, rgba(196,92,92,0.16) 0%, transparent 75%);
  padding-left:28px;
  text-shadow:0 0 10px rgba(196,92,92,0.3);
}
.opt.sel::before {
  content:'●';
  margin-right:10px;
  color:#c45c5c;
  font-size:8px;
  vertical-align:middle;
}
@media (max-width:640px) {
  .screen { padding:24px 18px; justify-content:flex-start; padding-top:64px; overflow-y:auto; }
  #qtext { font-size:19px; line-height:2.1; margin:12px 0 28px; }
  .opt { padding:16px 16px; font-size:15px; }
  .btn { padding:12px 8px; letter-spacing:.25em; }
  #progress { top:50%; right:10px; }
  #scare .big { font-size:26px; }
  #consent h1 { font-size:26px; letter-spacing:.45em; }
}

#next {
  margin-top:36px;
  padding:12px 8px;
}
#next:disabled { opacity:.18; cursor:default; border-bottom-color:rgba(120,120,130,0.15); }
#next:disabled:hover { color:#9aa3b0; text-shadow:none; border-bottom-color:rgba(120,120,130,0.35); }
#next:disabled::after { transform:scaleX(0); }

.cl-line {
  font-size:20px; font-weight:600;
  line-height:1.55; text-align:center;
  white-space:pre; user-select:none;
}

#scare { background:#000; color:#fff; overflow:hidden; }
#scare .big {
  font-size:34px; letter-spacing:6px;
  text-align:center; line-height:1.8;
}
#scare.flash { filter:invert(1); }
.noise-line { white-space:nowrap; line-height:1.1; user-select:none; color:#fff; }

#blank .cursor {
  display:inline-block; width:2px; height:26px;
  background:#000; animation:blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity:0; } }

#red { background:#000; }
#red .red {
  color:#c00; font-size:24px; letter-spacing:10px; text-align:center;
}
#red .tiny {
  margin-top:26px; font-size:11px; color:#555; letter-spacing:2px;
}

#watchLayer {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.72); z-index:99;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .35s;
}
#watchLayer.on { opacity:1; pointer-events:none; }
#watchLayer img {
  width:150px; height:150px; object-fit:cover;
  border-radius:50%; mix-blend-mode:screen;
  animation:eyeGlow 1.2s ease-in-out infinite alternate;
}
@keyframes eyeGlow {
  from { filter:brightness(.9) saturate(1); }
  to { filter:brightness(1.6) saturate(1.5); }
}
/* 彩蛋支线：图片跳脸换成 resource/help.jpg，并铺满整屏 */
#watchLayer.egg { background:#000; }
#watchLayer.egg img {
  width:100%; height:100%; border-radius:0; object-fit:contain;
  mix-blend-mode:normal;
  animation:faceIn .16s steps(2) 1;
}
@keyframes faceIn {
  from { filter:invert(1) contrast(1.5); }
  to { filter:none; }
}

#fauxDeath {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#fff; z-index:98; display:flex;
  align-items:center; justify-content:center; opacity:0;
  pointer-events:none; transition:opacity .1s;
}
#fauxDeath.on { opacity:1; }
#fauxDeath .fd-line {
  color:#000; font-size:15px; letter-spacing:3px;
  animation:blink 1.2s step-end infinite;
}

#reportBox {
  margin-top:22px; padding:16px 20px;
  border:1px solid #000; max-width:420px;
  font-size:13px; line-height:2; text-align:center;
  background:#fff;
}
#reportBox .r-line { letter-spacing:1px; }
#reportBox .r-warn { color:#a00; font-weight:600; letter-spacing:3px; }

body.skip-shake { transform:translateX(2px); }
body.skew-shake { animation:skewJitter .3s ease-out; }
@keyframes skewJitter {
  0% { transform:translate(0,0) skewX(0); }
  25% { transform:translate(-2px,0) skewX(.4deg); }
  50% { transform:translate(2px,1px) skewX(-.6deg); }
  75% { transform:translate(-1px,0) skewX(.3deg); }
  100% { transform:translate(0,0) skewX(0); }
}

.opt-dodge { transition:transform .12s ease-out; }
.opt.ghosted { border-color:#d0d0d0; color:#d0d0d0; transition:border-color .12s, color .12s, transform .12s ease-out; }



#reportBox { margin-top:10px; text-align:center; }
#reportBox .r-line { font-size:12px; color:#6a7080; letter-spacing:.15em; line-height:2.2; }
#reportBox .r-warn { font-size:14px; color:#c45c5c; letter-spacing:.2em; margin-top:14px; line-height:2; }
#reportBox .r-meta { color:#4a5060; font-size:11px; }
#qtext .swap-flash { color:#900; }
#qtext .swap-note { color:#a00; }

#qtyWrap { margin-top:16px; text-align:center; }
#qtyWrap input {
  font-family:inherit; font-size:15px; text-align:center;
  border:1px solid #000; padding:10px 14px; width:240px; max-width:80vw;
  border-radius:0; outline:none;
}
#qtyWrap .dismissed { color:#a00; font-size:13px; letter-spacing:3px; margin-top:10px; }

#blackFlash {
  position:fixed; inset:0; background:#000; z-index:97;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
}
#blackFlash.on { opacity:1; }
#blackFlash span { color:#fff; font-size:26px; letter-spacing:8px; white-space:pre; }

/* ===== d3rlord3 easter egg（标题界面输入 d3rlord3 触发） ===== */
#egg {
  position:fixed; inset:0; z-index:120;
  background:rgba(8,8,10,.95); color:#e8c547;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:34px 24px; text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .7s;
  overflow-y:auto;
}
#egg.on { opacity:1; pointer-events:auto; }
#egg.flash { filter:invert(1); }
#egg .sign {
  width:78px; height:78px; flex:none;
  margin-bottom:28px; opacity:.85;
  animation:signSpin 34s linear infinite;
}
#egg .sign ellipse, #egg .sign circle { fill:none; stroke:#e8c547; stroke-width:2; }
#egg .sign .dot { fill:#e8c547; stroke:none; }
@keyframes signSpin { to { transform:rotate(360deg); } }
#eggText { max-width:540px; }
#egg .egg-line {
  font-size:14px; line-height:2.3; letter-spacing:1.5px;
  opacity:.94; word-break:break-word;
}
#egg .egg-line + .egg-line { margin-top:9px; }
#egg .lead { font-size:15px; letter-spacing:4px; color:#f2d879; }
#egg .en { font-family:Georgia,'Times New Roman',serif; letter-spacing:2px; }
#eggText .egg-line:last-child::after {
  content:''; display:inline-block; width:7px; height:14px; margin-left:4px;
  background:#e8c547; vertical-align:-2px;
  animation:blink 1s step-end infinite;
}
#egg .egg-code {
  margin-top:30px; font-size:10px; letter-spacing:3px;
  color:#6b5a1c; line-height:2;
}
#egg .egg-hint {
  position:fixed; left:0; right:0; bottom:20px;
  font-size:10px; letter-spacing:4px; color:#4d4212; text-align:center;
}
@media (max-width:640px), (max-height:560px) {
  #egg { justify-content:flex-start; padding-top:54px; padding-bottom:56px; }
  #egg .sign { width:60px; height:60px; margin-bottom:20px; }
  #egg .egg-line { font-size:13px; line-height:2.1; }
}

/* ===== 彩蛋第三阶段：色调变化 / 震动 / 屏幕碎裂 ===== */
body.kiy-final { background:#12100a; color:#e8c547; }
body.kiy-final .opt { border-color:#8a7a2a; color:#e8c547; }
body.kiy-final .opt:hover, body.kiy-final .opt.sel { background:#e8c547; color:#12100a; }
body.kiy-final .opt.ghosted { border-color:#4d4212; color:#4d4212; }
body.kiy-final .btn { border-color:#8a7a2a; color:#e8c547; }
body.kiy-final .btn:hover { background:#e8c547; color:#12100a; }
body.kiy-final .btn:disabled { opacity:.3; }
body.kiy-final .btn:disabled:hover { background:transparent; color:#e8c547; }
body.kiy-final #progress { color:#5a4c14; }
body.kiy-final #quiz { cursor:pointer; }
body.kiy-final #qtext .sub { color:#8a7a2a; }
body.kiy-final #qtext .swap-flash, body.kiy-final #qtext .swap-note { color:#f2d879; }
body.kiy-final #qtyWrap input { border-color:#8a7a2a; color:#e8c547; background:transparent; }
body.kiy-final #qtyWrap .dismissed { color:#e8c547; }

#crack {
  position:fixed; inset:0; z-index:110;
  pointer-events:none; opacity:0; transition:opacity .5s;
}
#crack.on { opacity:1; }
#crack svg { display:block; width:100%; height:100%; }
#crack path {
  fill:none; stroke:#f2d879; stroke-width:.3; stroke-linecap:round; stroke-linejoin:round;
  opacity:0; transition:opacity .28s;
}
#crack path.on { opacity:.85; }
#crack path.web { stroke:#ffeaa6; stroke-width:.2; }

#shatterFlash {
  position:fixed; inset:0; z-index:111; background:#f6f2df;
  opacity:0; pointer-events:none; transition:opacity .06s;
}
#shatterFlash.on { opacity:1; }

body.shake-hard { animation:hardShake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes hardShake {
  10%, 90% { transform:translate3d(-3px,1px,0) rotate(-.25deg); }
  20%, 80% { transform:translate3d(7px,-2px,0) rotate(.4deg); }
  30%, 50%, 70% { transform:translate3d(-10px,3px,0) rotate(-.6deg); }
  40%, 60% { transform:translate3d(10px,-3px,0) rotate(.6deg); }
}

.egg-ghost {
  display:block; margin-top:14px; font-size:11px; letter-spacing:6px;
  color:#e8c547; opacity:0; transition:opacity 1.4s;
}
.egg-ghost.on { opacity:.55; }

/* ===== 彩蛋终章：黑白锁屏 → 雪花屏 → 黑屏两行 → 文字跳脸 → 最后一词 → 雪花屏 ===== */
body.bw { background:#0c0c0c; }
body.bw #quiz, body.bw #crack, body.bw #progress { filter:grayscale(1); }

#finalSeq { position:fixed; inset:0; z-index:113; display:none; overflow:hidden; }
#finalSeq.on { display:block; }

/* 黑屏 + 两行（字号加大） */
#fsSlow { position:absolute; inset:0; display:none; background:#000; overflow:hidden; }
#fsSlow.on { display:block; }
#finalSeq .fs-line {
  position:absolute; font-size:34px; line-height:1.9;
  letter-spacing:5px; opacity:0; transition:opacity 2.6s ease-in;
}
#finalSeq .fs-left { left:7%; top:29%; text-align:left; color:#f4f4f4; }
#finalSeq .fs-right { right:7%; top:60%; text-align:right; color:#e8c547; }
#finalSeq .fs-line.show { opacity:1; }

/* 雪花屏（低分辨率画布拉伸，看得见颗粒） */
#fsSnow {
  position:absolute; inset:0; z-index:5; display:none;
  width:100%; height:100%; background:#000;
  image-rendering:pixelated;
}
#fsSnow.on { display:block; }

/* 白底绿字文字跳脸 */
#fsFlash {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center; text-align:center;
  background:#fff; color:#0a8a3c;
  font-size:24px; line-height:2; letter-spacing:4px; padding:40px;
}
#fsFlash.on { display:flex; animation:fsJump .12s steps(2) 1; }
@keyframes fsJump { from { filter:invert(1); } to { filter:none; } }

/* 黄底黑字：最后一词，直接显示 */
#finalWaves {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center; text-align:center;
  background:#e8c547; color:#0a0a0a; padding:30px;
}
#finalWaves.on { display:flex; }
#finalWaves .fw-line { font-size:42px; font-weight:600; letter-spacing:6px; line-height:1.5; }

/* ===== 更猛烈的持续侵入：暗角 / 残影行 / 缓慢倾斜 / 假卡死 / 预闪 / 第二指针 ===== */
#vignette {
  position:fixed; inset:0; z-index:50; pointer-events:none;
  opacity:0; transition:opacity 2.4s ease, background 2s ease;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 46%, rgba(0,0,0,.5) 100%);
}
#vignette.on { opacity:1; }
#vignette.deep { background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 88%, rgba(0,0,0,.9) 100%); }
#vignette.pulse { animation:vgPulse 3.6s ease-in-out infinite; }
@keyframes vgPulse { 0%,100% { opacity:1; } 50% { opacity:.68; } }
#vignette.noise::after {
  content:''; position:absolute; inset:-60px;
  background-image:radial-gradient(rgba(0,0,0,.16) 1px, transparent 1.2px);
  background-size:3px 3px; opacity:.45;
  animation:grainShift .3s steps(2) infinite;
}
@keyframes grainShift {
  0% { transform:translate(0,0); }
  50% { transform:translate(-2px,1px); }
  100% { transform:translate(1px,-2px); }
}

/* 题干残影行：写在 #qtext 外面，题面本身一个字不动 */
#ghostLine {
  font-size:12px; letter-spacing:7px; color:rgba(0,0,0,.3);
  margin:-16px 0 20px; min-height:16px; user-select:none;
  animation:ghostBlink 2.8s ease-in-out infinite;
}
@keyframes ghostBlink {
  0%,100% { opacity:0; transform:translateX(0); }
  40% { opacity:.75; transform:translateX(-3px); }
  52% { opacity:.06; transform:translateX(3px); }
  64% { opacity:.55; transform:translateX(-1px); }
}

/* 题面极慢倾斜：像纸被人从下面轻轻推 */
#quiz.creep { animation:quizCreep 22s ease-in-out infinite alternate; }
@keyframes quizCreep {
  from { transform:rotate(-.22deg) scale(1); }
  to { transform:rotate(.3deg) scale(1.014); }
}

/* 第17题装死 */
#quiz.frozen { opacity:.5; cursor:wait; }
#quiz.frozen .opt, #quiz.frozen #next { pointer-events:none; }
#quiz.frozen #qtext::after { content:'……'; color:#999; letter-spacing:6px; }

/* 高潮前白/黑全屏帧 */
#preFlash { position:fixed; inset:0; z-index:96; opacity:0; pointer-events:none; transition:opacity .04s; }
#preFlash.on { opacity:1; }

/* 第二只指针：落后你半拍 */
#ghostCursor {
  position:fixed; left:-40px; top:-40px; width:13px; height:13px; border-radius:50%;
  border:1.5px solid rgba(0,0,0,.55); box-shadow:0 0 0 4px rgba(0,0,0,.06);
  z-index:95; pointer-events:none; opacity:0; transition:opacity 1.1s;
  transform:translate(-50%,-50%);
}
#ghostCursor.on {
  opacity:.6;
  animation:ghostCur 1.6s ease-in-out infinite alternate;
}
@keyframes ghostCur {
  from { transform:translate(-50%,-50%) scale(1); }
  to { transform:translate(-50%,-50%) scale(1.5); }
}

/* 频闪黑帧反相成白帧：红白闪 */
#scare.inv { filter:invert(1); }

/* 报告页：元数据行 + 自我计数行 */
#reportBox .r-meta { font-size:10px; color:#999; letter-spacing:1px; margin-top:8px; }
#reportBox #rGhost { color:#666; }

@media (max-width:640px) {
  #finalSeq .fs-line { font-size:22px; letter-spacing:3px; }
  #fsFlash { font-size:18px; }
  #finalWaves .fw-line { font-size:26px; letter-spacing:4px; }
}

.img-slot { position:fixed; pointer-events:none; z-index:90; opacity:0; transition:opacity .05s; }
.img-slot.on { opacity:1; }
.img-slot img { width:100%; height:100%; object-fit:cover; filter:contrast(1.2) brightness(0.7) saturate(0.3); }
.img-slot.ph { background:#0a0a0a; border:1px solid #1a1a1a; }
.img-slot.ph::after { content:'□'; color:#151515; font-size:12px; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
#imgPhoto { right:4%; top:8%; width:120px; height:90px; }
/* 镜：无图时用 CSS 画一面「里面有东西」的镜子 */
#imgMirror { left:6%; bottom:12%; width:110px; height:150px; }
#imgMirror.ph { background:linear-gradient(160deg,#1a1a22 0%,#0c0c10 40%,#15151c 100%); border:3px solid #2a2a32; border-radius:2px; box-shadow:inset 0 0 30px #000, 0 0 12px #000; }
#imgMirror.ph::after { content:none; }
#imgMirror.ph::before {
  content:''; position:absolute; left:18%; top:22%; width:64%; height:58%;
  background:radial-gradient(ellipse at 50% 40%, rgba(180,180,190,0.15) 0%, transparent 70%);
  animation:mirrorBreath 3.2s ease-in-out infinite;
}
#imgMirror.ph .mirror-face {
  position:absolute; left:28%; top:26%; width:44%; height:40%;
  background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.85) 0%, transparent 68%);
  opacity:0.55; animation:mirrorShift 4.1s ease-in-out infinite;
}
@keyframes mirrorBreath { 0%,100%{opacity:0.4; transform:scale(1);} 50%{opacity:0.75; transform:scale(1.04);} }

  if (!('speechSynthesis' in window)) { cb(false); return; }

  var u = new SpeechSynthesisUtterance(text);
  var basePitch = (pitch === undefined) ? 0.2 : pitch;
  u.pitch = basePitch + (Math.random() - 0.5) * 0.15;
  u.rate = (rate === undefined) ? 0.5 : rate;
  u.volume = 0.9;
  u.lang = 'zh-CN';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function escalatingSpeak(text, count) {
  var i = 0;
  function play() {
    if (i >= count || state.skipClimax) return;
    speakData(text, 0.3 + i * 0.18, 0.7 + i * 0.45);
    i++;
    setT(play, Math.max(400, 1400 - i * 200));
  }
  play();
}

function makeDistortionCurve(k) {
  var n = 44100, curve = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var x = i * 2 / n - 1;
    curve[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

function initAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || ctx) return;
  ctx = new AC();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(ctx.destination);

  whisperDelay = ctx.createDelay(1.0);
  whisperDelay.delayTime.value = 0.4;
  var whisperFb = ctx.createGain();
  whisperFb.gain.value = 0.35;
  whisperDelay.connect(whisperFb);
  whisperFb.connect(whisperDelay);
  whisperDelay.connect(masterGain);

  lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 800;

  shaper = ctx.createWaveShaper();
  shaper.curve = makeDistortionCurve(28);
  lowpass.connect(shaper);

  bgmGain = ctx.createGain();
  bgmGain.gain.value = 0;
  shaper.connect(bgmGain);
  bgmGain.connect(masterGain);

  lowOscGain = ctx.createGain();
  lowOscGain.gain.value = 0;
  lowOscGain.connect(lowpass);

  lowOsc = ctx.createOscillator();
  lowOsc.type = 'sine';
  lowOsc.frequency.value = 55;
  lowOsc.connect(lowOscGain);
  lowOsc.start();

  pitchLfo = ctx.createOscillator();
  pitchLfo.type = 'sine';
  pitchLfo.frequency.value = 0.15;
  pitchLfoGain = ctx.createGain();
  pitchLfoGain.gain.value = 0.025;
  pitchLfo.connect(pitchLfoGain);
  pitchLfo.start();

  dissonanceOsc = ctx.createOscillator();
  dissonanceOsc.type = 'sine';
  dissonanceOsc.frequency.value = 58;
  dissonanceGain = ctx.createGain();
  dissonanceGain.gain.value = 0;
  dissonanceOsc.connect(dissonanceGain);
  dissonanceGain.connect(lowpass);
  dissonanceOsc.start();

  resumeCtx();

  try {
    fetch('resource/began.mp3')
      .then(function (r) {
        if (!r.ok) throw new Error('fetch failed');
        return r.arrayBuffer();
      })
      .then(function (buf) { return ctx.decodeAudioData(buf); })
      .then(function (decoded) { mp3Buf = decoded; })
      ['catch'](function () { mp3Buf = null; });
  } catch (e) { mp3Buf = null; }
}

function resumeCtx() {
  if (!ctx) return;
  if (ctx.state !== 'running') {
    try {
      var p = ctx.resume();
      if (p && p['catch']) p['catch'](function () {});
    } catch (e) {}
  }
}

var WHISPER_LIST = ['resource/voice/whisper1.mp3','resource/voice/whisper2.mp3','resource/voice/whisper3.mp3','resource/voice/whisper4.mp3','resource/voice/whisper5.mp3'];
var whisperTimer = null;

function playRandomWhisper() {
  if (!ctx || state.silence) return;
  var url = WHISPER_LIST[Math.floor(Math.random() * WHISPER_LIST.length)];
  fetch(url).then(function (r) { return r.arrayBuffer(); })
    .then(function (ab) { return ctx.decodeAudioData(ab); })
    .then(function (buf) {
      if (state.silence) return;
      // 四成概率整段倒放：同一句耳语，倒过来就不像人说的了
      if (Math.random() < 0.4) {
        var rv = ctx.createBuffer(buf.numberOfChannels, buf.length, ctx.sampleRate);
        for (var c = 0; c < buf.numberOfChannels; c++) {
          var sd = buf.getChannelData(c), dd = rv.getChannelData(c);
          for (var q = 0, w = buf.length - 1; q < buf.length; q++, w--) dd[w] = sd[q];
        }
        buf = rv;
      }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var g = ctx.createGain();
      g.gain.value = 0.18 + Math.random() * 0.12;
      var node = g;
      // 硬声像：贴着左耳或右耳说，不留中间位置
      if (ctx.createStereoPanner) {
        var pan = ctx.createStereoPanner();
        pan.pan.value = (Math.random() < 0.5 ? -1 : 1) * (0.55 + Math.random() * 0.45);
        g.connect(pan);
        node = pan;
      }
      src.connect(g);
      if (whisperDelay) {
        node.connect(whisperDelay);
      } else {
        node.connect(masterGain);
      }
      src.start();
    })['catch'](function () {});
}

function scheduleRandomWhispers() {
  if (state.whispersScheduled) return;
  state.whispersScheduled = true;

}

function runWhisperLoop() {
  // 越往后耳语越密：第16题起最短 2.6 秒就可能贴你一次
  var tight = state.idx >= 25 ? 2600 : state.idx >= 19 ? 5200 : 8000;
  var spread = state.idx >= 25 ? 4000 : 18000;
  var next = tight + Math.random() * spread;
  whisperTimer = setTimeout(function () {
    if (state.hasInteracted && state.idx < 36 && !state.silence) playRandomWhisper();
    if (state.whispersScheduled) runWhisperLoop();
  }, next);
}

function setBgm(mode) {
  if (!ctx) return;
  resumeCtx();
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  var rate = 1, ramp = false;
  if (mode === 'weak') {
    bgmGain.gain.value = 0.4;
    lowpass.frequency.value = 800;
    lowOscGain.gain.value = 0.12;
  } else if (mode === 'broken') {
    bgmGain.gain.value = 0.48;
    lowpass.frequency.value = 900;
    lowOscGain.gain.value = 0.16;
    rate = 0.85;
  } else if (mode === 'urgent') {
    bgmGain.gain.value = 0.55;
    lowpass.frequency.value = 750;
    lowOscGain.gain.value = 0.2;
    rate = 0.82;
  } else if (mode === 'full') {
    bgmGain.gain.value = 0.72;
    lowpass.frequency.value = 600;
    lowOscGain.gain.value = 0.24;
    rate = 0.7;
  } else {
    bgmGain.gain.value = 0;
    lowOscGain.gain.value = 0;
    return;
  }

  lowOsc.frequency.value = (mode === 'full') ? 45 : 55;

  if (mp3Buf) {
    bgmSrc = ctx.createBufferSource();
    bgmSrc.buffer = mp3Buf;
    bgmSrc.loop = true;

    if (mode === 'broken') {
      var sr = ctx.sampleRate;
      var off = Math.min(Math.floor(sr * 2), Math.floor(sr * mp3Buf.duration * 0.4));
      var len = Math.floor(sr * 0.5);
      if (len > 0 && off + len <= mp3Buf.length) {
        var frag = ctx.createBuffer(mp3Buf.numberOfChannels, len, sr);
        for (var ch = 0; ch < mp3Buf.numberOfChannels; ch++) {
          var src = mp3Buf.getChannelData(ch);
          var dst = frag.getChannelData(ch);
          for (var i = 0; i < len; i++) dst[i] = src[off + i];
        }
        bgmSrc.buffer = frag;
        bgmSrc.loop = true;
      }
    }

    var t = ctx.currentTime;
    if (ramp) {
      bgmSrc.playbackRate.setValueAtTime(1.0, t);
      bgmSrc.playbackRate.linearRampToValueAtTime(1.5, t + 12);
    } else {
      bgmSrc.playbackRate.value = rate;
    }
    bgmSrc.connect(lowpass);
    pitchLfoGain.connect(bgmSrc.playbackRate);
    dissonanceGain.gain.value = (mode === 'full') ? 0.08 : (mode === 'urgent') ? 0.05 : 0.03;
    bgmSrc.start(0);
  }
}

function startBuzz(freq) {
  if (!ctx) return;
  if (!buzzOsc) {
    buzzOsc = ctx.createOscillator();
    buzzOsc.type = 'sine';
    buzzGain = ctx.createGain();
    buzzGain.gain.value = 0;
    buzzOsc.connect(buzzGain);
    buzzGain.connect(masterGain);
    buzzOsc.start();
  }
  buzzOsc.frequency.value = freq;
  buzzGain.gain.value = 0.16;
}

function stopBuzz() { if (buzzGain) buzzGain.gain.value = 0; }

function scareBurst() {
  if (!ctx) return;
  var sr = ctx.sampleRate, len = Math.floor(sr * 0.25);
  var buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) {
    var p = i / len;
    var f = 400 - 300 * p;
    d[i] = Math.sin(2 * Math.PI * f * i / sr) * 0.5 + (Math.random() * 2 - 1) * 0.3 * (1 - p);
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain();
  g.gain.value = 0.45;
  src.connect(g);
  g.connect(ctx.destination);
  src.start();
}

function humanRoar() {
  if (!ctx) return;
  var sr = ctx.sampleRate, dur = 0.5, len = Math.floor(sr * dur);
  var buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  var t0 = ctx.currentTime + 0.03;
  var phase = 0;
  for (var i = 0; i < len; i++) {
    var t = i / sr;
    var p = i / len;
    var f = 140 + 420 * p;
    f += Math.sin(2 * Math.PI * 27 * t) * 45;
    phase += 2 * Math.PI * f / sr;
    var vibr = Math.sin(phase);
    var harsh = (Math.random() * 2 - 1) * (0.5 * p + 0.25);
    var growl = Math.sin(2 * Math.PI * (55 + 35 * p) * t) * 0.5;
    var v = vibr * 0.72 + growl * 0.5 + harsh * (0.85 - 0.4 * p);
    v = Math.tanh(v * 2.2);
    var env = Math.min(1, p / 0.04) * (1 - (p > 0.7 ? (p - 0.7) / 0.3 : 0)) * 0.9;
    d[i] = v * env;
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain();
  g.gain.value = 0.6;
  src.connect(g);
  g.connect(ctx.destination);
  src.start(t0);
}

function initHeart() {
  if (!ctx || heartGain) return;
  heartGain = ctx.createGain();
  heartGain.gain.value = 0;
  heartGain.connect(masterGain || ctx.destination);
  heartOsc = ctx.createOscillator();
  heartOsc.type = 'sine';
  heartOsc.frequency.value = 55;
  heartOsc.connect(heartGain);
  heartOsc.start();
}

function thump(when) {
  if (!ctx || !heartOsc || !heartGain || state.silence) return;
  var t = when;
  heartOsc.frequency.setValueAtTime(58, t);
  heartOsc.frequency.linearRampToValueAtTime(40, t + 0.11);
  heartGain.gain.setValueAtTime(0, t);
  heartGain.gain.linearRampToValueAtTime(0.34, t + 0.012);
  heartGain.gain.linearRampToValueAtTime(0.0001, t + 0.11);
}

function startHeart(bpm) {
  initHeart();
  if (!heartGain) return;
  heartbeatBpm = bpm;
  if (heartTimer) clearTimeout(heartTimer);
  var iv = 60000 / bpm;
  function beat() {
    var now = ctx.currentTime;
    thump(now);
    thump(now + 0.24);
    // 心律不齐：心率越高越容易多抽一拍（早搏）
    if (heartbeatBpm >= 118 && Math.random() < 0.24) {
      heartTimer = setTimeout(function () {
        if (!heartGain) return;
        var t2 = ctx.currentTime;
        thump(t2);
        thump(t2 + 0.19);
        heartTimer = setTimeout(loop, iv * 0.62);
      }, iv * 0.48);
      return;
    }
    // 每一拍的间隔都不一样：正常心跳是机器，这个不是
    heartTimer = setTimeout(loop, iv * (0.8 + Math.random() * 0.42));
  }
  function loop() {
    if (!heartGain) return;
    beat();
  }
  heartTimer = setTimeout(loop, 300);
}

function stopHeart() {
  if (heartTimer) { clearTimeout(heartTimer); heartTimer = 0; }
  if (heartGain) heartGain.gain.value = 0;
}

function heartBpmFor(i) {
  var avgSpeed = 0, n = 0;
  for (var j = Math.max(0, i - 4); j < i; j++) {
    if (data.questions[j].duration) {
      avgSpeed += data.questions[j].duration;
      n++;
    }
  }
  if (n) avgSpeed = avgSpeed / n;
  var bpm;
  if (avgSpeed < 1000) bpm = 130;
  else if (avgSpeed < 2000) bpm = 110;
  else if (avgSpeed < 4000) bpm = 90;
  else bpm = 72;
  // 越往后越不讲道理地往上顶：题号本身就开始吓人了
  if (i >= 19) bpm += Math.min(26, Math.pow(i - 18, 1.6));
  return Math.min(Math.round(bpm), 158);
}

function slowBgm() {
  if (bgmSrc && bgmSrc.playbackRate) {
    bgmRateStored = bgmSrc.playbackRate.value || 1;
    bgmSrc.playbackRate.value = Math.max(0.4, bgmRateStored * 0.8);
  }
}

function restoreBgm() {
  if (bgmSrc && bgmSrc.playbackRate) {
    bgmSrc.playbackRate.value = bgmRateStored || 1;
  }
}

function refillOptionHover(i) {

function applyStage(i) {
  var b = document.body;

  if (i >= 6) {
    vg.classList.add('on');
    if (i >= 19) vg.classList.add('noise');

    b.style.background = '#f0f0f5';
    startHeart(heartBpmFor(25));

  } else if (i === 31) {
    setBgm('full');
    startBuzz(25);
    startHeart(heartBpmFor(31));
    setT(function () { silencePocket(2600); }, 700);
  } else if (i === 35) {
    setT(function () { silencePocket(1500); }, 500);

}

function renderOptions(i, usedOpts) {
  var box = $('options');
  box.innerHTML = '';
  var opts = usedOpts || QUESTION_OPTIONS[i];
  opts.forEach(function (text, k) {
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('pointerdown', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
    });
    b.addEventListener('pointerup', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('pointercancel', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('focus', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
    });
    b.addEventListener('blur', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('mouseenter', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
      if (i === 15 && Math.random() < 0.55) dodgeOption(b);
    });
    b.addEventListener('mouseleave', function () {
      refillOptionHover(state.idx);
      if (b._ghosting) { b._ghosting = false; b.classList.remove('ghosted'); }
    });
    b.addEventListener('click', function () {
      if (state.frozen) return;   // 装死期间点哪都没反应
      var sels = box.querySelectorAll('.opt.sel');
      if (state.selected === k) {
        state.selected = -1;
        state.answerChanges++;

        if (state.selected !== -1) state.answerChanges++;
        state.selected = k;
      }
      for (var m = 0; m < sels.length; m++) sels[m].classList.remove('sel');
      if (state.selected !== -1) b.classList.add('sel');
      $('next').disabled = (state.selected === -1);
      recordClick();
    });
    box.appendChild(b);
  });
  if (i >= 6 && i <= 35) maybeBlackFlash();
}

/* ================= 持续侵入层：残影行 / 假卡死 / 静默口袋 / 次声 / 预闪 ================= */
var GHOST_LINES = ['别读了', '我在这', '你回头了吗', '它离你两步', '再往下', '你不是一个人', '别停', '我知道你在哪'];

/* 题干下方的残影行：独立元素，不写进 #qtext（避免动到题面本身） */
function updateGhostLine(i) {
  var g = $('ghostLine');
  if (!g) return;
  if (i < 12 || i > 21) {
    g.classList.add('hidden');
    g.textContent = '';
    var gc = $('ghostCursor');
    if (gc && i > 21) gc.classList.remove('on');
    return;
  }
  g.classList.remove('hidden');
  g.textContent = GHOST_LINES[Math.floor(Math.random() * GHOST_LINES.length)];
}

/* 第17题：页面装死。Esc 的 clearTimers 清不掉这个（裸 setTimeout），装死就该清不掉 */
function fakeFreeze() {
  if (state.frozen) return;
  state.frozen = true;
  var q = $('quiz');
  q.classList.add('frozen');
  setTimeout(function () {
    state.frozen = false;
    q.classList.remove('frozen');
  }, 4600);
}

/* 静默口袋：所有声源瞬间掐死，几秒后一记次声重击把它们全砸回来 */
function silencePocket(ms) {
  if (!ctx || state.silence) return;
  state.silence = true;
  resumeCtx();
  var t = ctx.currentTime;
  var save = {
    bgm: bgmGain ? bgmGain.gain.value : null,
    buzz: buzzGain ? buzzGain.gain.value : null,
    low: lowOscGain ? lowOscGain.gain.value : null
  };
  function rampDown(node, v, secs) {
    if (!node || v === null) return;
    node.gain.cancelScheduledValues(t);
    node.gain.setValueAtTime(v, t);
    node.gain.linearRampToValueAtTime(0.0001, t + secs);
  }
  rampDown(bgmGain, save.bgm, 0.35);
  rampDown(buzzGain, save.buzz, 0.2);
  rampDown(lowOscGain, save.low, 0.2);
  setTimeout(function () {
    state.silence = false;
    if (!ctx) return;
    var t2 = ctx.currentTime;
    function rampUp(node, v) {
      if (!node || v === null) return;
      node.gain.cancelScheduledValues(t2);
      node.gain.setValueAtTime(node.gain.value, t2);
      node.gain.linearRampToValueAtTime(v, t2 + 0.05);
    }
    rampUp(bgmGain, save.bgm);
    rampUp(buzzGain, save.buzz);
    rampUp(lowOscGain, save.low);
    subHit();
  }, ms);
}

/* 次声重击：30Hz 往下坠的低频一拳 */
function subHit() {
  if (!ctx) return;
  var sr = ctx.sampleRate, len = Math.floor(sr * 1.7);
  var buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) {
    var tt = i / sr;
    var f = 38 - 14 * (tt / 1.7);
    d[i] = Math.sin(2 * Math.PI * f * tt) * Math.max(0, 1 - tt / 1.7) * 0.95;
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain();
  g.gain.value = 0.55;
  src.connect(g);
  g.connect(masterGain || ctx.destination);
  src.start();
}

/* 19Hz 次声底噪：第16题起一直铺在最底层 */
function startInfra() {
  if (!ctx || infraOsc) return;
  try {
    infraOsc = ctx.createOscillator();
    infraOsc.type = 'sine';
    infraOsc.frequency.value = 19;
    infraGain = ctx.createGain();
    infraGain.gain.value = 0;
    infraOsc.connect(infraGain);
    infraGain.connect(ctx.destination);
    infraOsc.start();
    infraGain.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 3);
  } catch (e) { infraOsc = null; infraGain = null; }
}

function stopInfra() {
  if (infraOsc) { try { infraOsc.stop(); } catch (e) {} infraOsc = null; }
  infraGain = null;
}

/* 高潮前的白/黑全屏预闪：文字墙砸下来之前先抽你几巴掌 */
function preFlashFrames() {
  var f = $('preFlash');
  var seqs = ['#ffffff', '#000000', '#ffffff', '#000000', '#ffffff'];
  var k = 0;
  function step() {
    if (state.skipClimax || !state.climaxMode) {
      f.classList.remove('on');
      f.style.background = '';
      return;
    }
    if (k >= seqs.length) {
      f.classList.remove('on');
      f.style.background = '';
      return;
    }
    f.style.background = seqs[k++];
    f.classList.add('on');
    setTimeout(step, 55 + Math.random() * 60);
  }
  step();
}

/* 报告页元数据行：把你自己的真实环境写进报告里 */
function reportMeta() {
  try {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    var s = '记录于 ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
            ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    if (typeof navigator !== 'undefined' && navigator.language) s += ' · ' + navigator.language;
    if (typeof screen !== 'undefined' && screen && screen.width) s += ' · ' + screen.width + '×' + screen.height;
    if (typeof window !== 'undefined' && window.innerWidth) s += ' · 窗口 ' + window.innerWidth + 'px';
    return s;
  } catch (e) { return ''; }
}

/* 第二只指针：落后你半拍的那只手（真实 pointermove 驱动） */
function ghostCursorLoop() {
  if (ghostCurTimer) return;
  ghostCurTimer = setInterval(function () {
    var g = $('ghostCursor');
    if (!g || !g.classList.contains('on')) {
      if (ghostCurTimer) { clearInterval(ghostCurTimer); ghostCurTimer = 0; }
      return;
    }
    gcx += (gcTx + 15 - gcx) * 0.055;
    gcy += (gcTy + 11 - gcy) * 0.055;
    g.style.left = gcx + 'px';
    g.style.top = gcy + 'px';
  }, 60);
}

function onPointerMove(e) {
  if (!state.hasInteracted || state.idx < 19 || state.idx > 35) return;
  var g = $('ghostCursor');
  if (!g) return;
  gcTx = e.clientX; gcTy = e.clientY;
  if (!ghostCurOn) {
    ghostCurOn = true;
    gcx = e.clientX + 26;
    gcy = e.clientY + 18;
    g.classList.add('on');
    ghostCursorLoop();
  } else if (e.clientY < window.innerHeight * 0.45 && Math.random() < 0.12) {
    // 偶尔自己动一下：跟你没关系的那种动法
    gcTx = e.clientX + (Math.random() - 0.5) * 140;
    gcTy = e.clientY + (Math.random() - 0.5) * 140;
  }
}

function renderQuiz(i) {
  var q = QUESTIONS[i];
  show('quiz');
  if (i === 29) fakeFreeze();
  if (i === 0 && state.returnCount > 1) {
    $('qtext').innerHTML = '';
    var returnTexts = ['', '果然你还会回来', '你又来了。', '你离不开这里。', '你还想试几次？'];
    var txt = returnTexts[Math.min(state.returnCount - 1, 4)];
    $('qtext').appendChild(document.createTextNode(txt));
    try {
      var lastTime = localStorage.getItem('psych-last-time');
      if (lastTime) {
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = '上次你用了 ' + lastTime + ' 秒。';
        $('qtext').appendChild(sub);
      }
    } catch (e) {}
    $('next').textContent = '下一柱';
    $('next').disabled = true;
    $('next').onclick = function () { advance(); };
    renderOptions(0, ['？', '？', '？', '？']);
    repeatSpeak('陪陪我吧', 1500);
    return;
  }

  $('qtext').innerHTML = '';
  $('qtext').appendChild(document.createTextNode(qTextOf(i)));

  if (i === 4) {
    setT(function () {
      var qt = $('qtext');
      if (!qt.childNodes.length) return;
      var c = qt.childNodes[0];
      if (!c.nodeValue || c.nodeValue.indexOf('凌晨') < 0) return;
      c.nodeValue = c.nodeValue.replace('凌晨', '现在');
      var sw = document.createElement('span');
      sw.className = 'sub swap-note';
      sw.textContent = '你刚才点的不是这个字。';
      qt.appendChild(sw);
    }, 2400);
  }

  var sub = '';
  if (i === 28) sub = subRitual1();
  else if (i === 29) sub = subRitual2();
  else if (i === 30) sub = subRitual3();
  else if (i === 31) sub = subRitual4();
  else if (i === 34) sub = subRitual5();

  if (sub) {
    var s = document.createElement('span');
    s.className = 'sub';
    s.textContent = sub;
    $('qtext').appendChild(s);
  }

  if (i >= 20 && i <= 27) {
    setT(function () {
      var qt = $('qtext');
      var node = qt.childNodes[0];
      if (!node || !node.nodeValue) return;
      var original = node.nodeValue;
      var disguised = original.replace('忈', '望').replace('惢', '惧').replace('██', '绝');
      if (disguised === original) return;
      node.nodeValue = disguised;
      var flickerCount = 0;
      var flicker = setInterval(function () {
        node.nodeValue = flickerCount % 2 === 0 ? original : disguised;
        flickerCount++;
        if (flickerCount > 6) {
          clearInterval(flicker);
          node.nodeValue = original;
          qt.style.textShadow = '0 0 8px rgba(0,0,0,0.15), 1px 0 0 rgba(0,0,0,0.08), -1px 0 0 rgba(0,0,0,0.08)';
          setT(function () { qt.style.textShadow = ''; }, 2000);
        }
      }, 80);
    }, 2000);
  }

  if (i === FINAL_AT) {
    if (false && state.eggMode) { startLeftTurn(); return; }
    $('options').innerHTML = '';
    $('next').disabled = true;
    $('next').textContent = '封 坛';
    $('next').disabled = false;
    $('next').onclick = fakeClose;
    setT(notifyAfter20s, 20000);
    hookNotificationGesture();
    try { localStorage.setItem('psych-last-time', fmt(Date.now() - data.startedAt)); } catch (e) {}
    renderReport();
    // 后劲：你盯着报告读的时候，它也在读你
    setT(function () { whisper(); }, 7000);
    setT(function () { if (Math.random() < 0.6) quickEye(); }, 16000);
    setT(function () { if (Math.random() < 0.4) speakData('你还在吗', 0.1, 0.5); }, 26000);
    return;
  }

  $('next').textContent = '下一柱';
  $('next').disabled = true;
  $('next').onclick = function () { advance(); };
  renderOptions(i, qOptsOf(i));

  if (i === 33) {
    bindContactQuestion();
  }

  if (sub) {
    setT(function () { speakData(sub, 0.2, 0.55); }, 1500);
  }
}

function subRitual5() {
  var dur = data.questions[18].duration;
  return '第19题 你用了 ' + fmt(dur) + ' 秒。' + (dur < 900 ? '你甚至没有犹豫。' : '你犹豫了。它在等。');
}

function renderReport() {
  var box = document.createElement('div');
  box.id = 'reportBox';
  var lines = [];
  var q = data.questions;
  var avg = 0, n = 0, i;
  for (i = 0; i < CLIMAX_AT; i++) {
    if (q[i].duration) { avg += q[i].duration; n++; }
  }
  if (n) avg = avg / n;
  lines.push('<div class="r-line">总用时 ' + fmt(Date.now() - data.startedAt) + ' 秒</div>');
  lines.push('<div class="r-line">平均每题 ' + fmt(avg) + ' 秒</div>');
  lines.push('<div class="r-line">你切走了 ' + data.tabSwitches.length + ' 次</div>');
  lines.push('<div class="r-line">你改动了 ' + totalChanges() + ' 次答案</div>');
  lines.push('<div class="r-line" id="rGhost">这份报告被打开过 ' + (data.reportOpens || 1) + ' 次。</div>');
  if (eggSeen()) lines.push('<div class="r-line" style="color:#8a7a2a;">你翻到了不该出现的那一页。</div>');
  if (state.returnCount <= 1) lines.push('<div class="r-warn">你还好吗。你身后那位呢。</div>');
  else if (state.returnCount === 2) lines.push('<div class="r-warn">你又来了。</div>');
  else {
    lines.push('<div class="r-warn">把摄像头对着你身后。</div>');
  }
  lines.push('<div class="r-line r-meta">受试者登记：2 名。</div>');
  lines.push('<div class="r-line r-meta">其中 1 名未主动进入本页。</div>');
  var meta = reportMeta();
  if (meta) lines.push('<div class="r-line r-meta">' + meta + '</div>');
  box.innerHTML = lines.join('');
  $('qtext').appendChild(box);
}

function totalChanges() {
  var s = 0, i;
  for (i = 0; i < TOTAL_Q; i++) s += data.questions[i].answerChanges || 0;
  return s;
}

function renderBlank(i) {
  show('blank');
  stopRepeatSpeak();
  // 进度条开始胡说八道：空白页比 100% 还多
  $('progress').textContent = '第 41 柱香';
  var remnant = document.createElement('div');
  remnant.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:rgba(0,0,0,0.06);letter-spacing:6px;white-space:nowrap;pointer-events:none;z-index:1;';
  remnant.textContent = '你还在吗';
  document.body.appendChild(remnant);
  var flickerR = setInterval(function () {
    remnant.style.opacity = Math.random() < 0.3 ? '1' : '0';
  }, 200);
  setT(function () {
    try { clearInterval(flickerR); remnant.style.opacity = '0'; } catch (e) {}
    try { document.body.removeChild(remnant); } catch (e) {}
    advance();
  }, QUESTIONS[i].blankSec * 1000);
  setT(function () { if (Math.random() < 0.6) playRandomWhisper(); }, 5000);
}

function renderQuestion(i) {
  state.idx = i;
  state.selected = -1;
  state.answerChanges = 0;
  state.hoverStart = 0;
  var rec = data.questions[i];
  rec.enterTime = Date.now();
  if (i >= 6) updateProgress();
  applyStage(i);
  updateGhostLine(i);
  // 题面从第8题开始极其缓慢地歪掉（class 驱动，不写行内样式，免得被别的逻辑清掉）
  if (i >= 12 && i <= 35) $('quiz').classList.add('creep');
  else $('quiz').classList.remove('creep');
  if (QUESTIONS[i].blank) { renderBlank(i); return; }
  renderQuiz(i);
}

function advance() {
  if (state.frozen) return;   // 装死期间点了也没用
  var i = state.idx;
  var rec = data.questions[i];
  rec.duration = Date.now() - rec.enterTime;
  rec.answerChanges = state.answerChanges;
  rec.answer = state.selected;
  refillOptionHover(i);
  recordClick();

  if (i === 0) stopRepeatSpeak();

  if (i === CLIMAX_AT) { startClimax(); return; }

  var n = i + 1;
  if (n < TOTAL_Q) renderQuestion(n);
}

function printWaves(w, k, n) {
  if (state.skipClimax) return;
  var W = state.eggMode ? WAVES_KIY : WAVES;
  if (w >= W.length) {
    setT(staticThenScare, 3500);
    return;
  }
  var line = document.createElement('div');
  line.className = 'cl-line';
  line.textContent = W[w].text;
  $('climax').appendChild(line);
  k++;
  if (k < W[w].count) {
    var delay = Math.max(50, 800 - n * 28);
    setT(function () { printWaves(w, k, n + 1); }, delay);
  } else {
    setT(function () { printWaves(w + 1, 0, n + 1); }, 60);
  }
}

function startClimax() {
  state.climaxMode = true;
  state.skipClimax = false;
  if (!state.eggMode) {
    stopRepeatSpeak();
    setBgm('full');
    stopBuzz();
    startHeart(heartBpmFor(31));
  }
  show('climax');
  $('climax').innerHTML = '';
  preFlashFrames();
  // 文字墙晚半拍砸下来，先被白/黑帧抽几巴掌
  setT(function () { escalatingSpeak(state.eggMode ? 'dtl' : '我不想在这了', 6); }, 450);
  setT(function () { printWaves(0, 0, 0); }, 450);
}

function staticThenScare() {
  if (state.skipClimax) return;
  var scareBox = $('scare');
  scareBox.innerHTML = '';
  var words = state.eggMode
    ? ['不要左转', '黄衣之王', '它', '哈利湖', '黄印', '黑星', '你读过', '戏开始了', '不要回头', '祂在看', '你在演', '继续走']
    : ['我不想在这了', '我想死', '死死死', '冤冤冤', '你回头', '看不见我', '后身', '你还在吗'];
  for (var i = 0; i < 120; i++) {
    var s = document.createElement('div');
    s.className = 'noise-line';
    s.style.fontSize = (10 + Math.random() * 22) + 'px';
    var w = words[Math.floor(Math.random() * words.length)];
    s.textContent = w + '  ';
    scareBox.appendChild(s);
  }
  show('scare');
  setT(function () {
    humanRoar();
    if ('speechSynthesis' in window) {
      speakData(state.eggMode ? '不要左转' : '我不想在这了', 0, 3.0);
    }
  }, 400);
  scareBox.classList.add('flash');
  setT(function () { scareBox.classList.remove('flash'); }, 100);
  setT(startStrobe, 950);
  setT(advanceAfterClimax, 1700);
}

function startStrobe() {
  if (state.skipClimax) return;
  // 红/黑交替，黑帧直接反相成白帧：红白闪比单纯红黑更狠
  var colors = ['#ff0000', '#000000', '#ff0000', '#000000', '#ff0000', '#000000',
                '#ff0000', '#000000', '#ff0000', '#000000'];
  var i = 0;
  var sb = $('scare');
  function tick() {
    if (state.skipClimax) { sb.classList.remove('inv'); return; }
    if (i >= colors.length) {
      sb.style.background = '';
      sb.classList.remove('inv');
      return;
    }
    sb.style.background = colors[i];
    if (colors[i] === '#000000') sb.classList.add('inv');
    else sb.classList.remove('inv');
    i++;
    setT(tick, 55);
  }
  tick();
}

function advanceAfterClimax() {
  state.climaxMode = false;
  state.skipClimax = false;
  $('scare').style.background = '';
  $('scare').classList.remove('flash');
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  renderQuestion(BLANK_AT);
}

function skipFromKey(e) {
  if (e.key === 'Escape' && state.climaxMode && !state.skipClimax) {
    state.skipClimax = true;
    clearTimers();
    advanceAfterClimax();
  }
}

function fireNotif() {
  if (state.notified) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('身后问卷', { body: '转过来。' });
    state.notified = true;
  } catch (e) {}
}

function notifyAfter20s() {
  fireNotif();
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  try {
    var req = Notification.requestPermission();
    if (req && req.then) {
      req.then(function (p) {
        data.permissions.notification = p;
        fireNotif();
      })['catch'](function () {});
    }
  } catch (e) {}
}

function hookNotificationGesture() {
  document.addEventListener('click', function () {
    if (!('Notification' in window) || Notification.permission !== 'default' || state.notified) return;
    try {
      var req = Notification.requestPermission();
      if (req && req.then) {
        req.then(function (p) {
          data.permissions.notification = p;
          fireNotif();
        })['catch'](function () {});
      }
    } catch (e) {}
  }, { once: true, capture: true });
}

function whisper() {
  if (state.speech === 'mp3') { playVoiceMp3('', 0.3); return; }
  if (!('speechSynthesis' in window)) return;
  var u = new SpeechSynthesisUtterance('你确定吗');
  u.pitch = 1.4 + (Math.random() - 0.5) * 0.3;
  u.rate = 1.7; u.volume = 0.12; u.lang = 'zh-CN';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function speakTimes(text, count, gap) {
  if (state.speech === 'mp3') {
    var i = 0;
    function oneMp3() {
      if (i >= count) return;
      playVoiceMp3(text, 1);
      i++;
      setTimeout(oneMp3, (gap || 650) + 450);
    }
    oneMp3();
    return;
  }
  if (!('speechSynthesis' in window)) return;
  var i = 0;
  function one() {
    if (i >= count) return;
    var u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.7; u.rate = 0.9; u.volume = 0.8; u.lang = 'zh-CN';
    window.speechSynthesis.speak(u);
    i++;
    setTimeout(one, gap);
  }
  one();
}

function repeatSpeak(text, gap) {
  if (state.speech === 'mp3') {
    function oneMp3() {
      if (state.skipClimax) return;
      playVoiceMp3(text, 0.9);
      state.repeatId = setTimeout(oneMp3, (gap || 1600) + 600);
    }
    oneMp3();
    return;
  }
  if (!('speechSynthesis' in window)) return;
  function one() {
    if (state.skipClimax) return;
    var u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.75; u.rate = 0.85; u.volume = 0.85; u.lang = 'zh-CN';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    state.repeatId = setTimeout(one, gap || 1600);
  }
  one();
}

function stopRepeatSpeak() {
  if (state.repeatId) { clearTimeout(state.repeatId); state.repeatId = 0; }
  if (state.speech === 'mp3') { return; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function fakeClose() {
  stopRepeatSpeak();
  stopHeart();
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  show('fauxDeath');
  $('fauxDeath').classList.add('on');
  void $('fauxDeath').offsetWidth;
  setT(function () {
    $('fauxDeath').classList.remove('on');
    var red = $('red');
    red.querySelectorAll('.tiny').forEach(function (t) { t.remove(); });
    show('red');
    var who = document.createElement('div');
    who.className = 'red';
    who.textContent = '你在找什么？';
    red.insertBefore(who, red.firstChild);
    whisper();
    fireNotif();
    speakTimes('我好孤独', 10, 650);
    setTimeout(function () {
      try { window.close(); } catch (e) {}
    }, 900);
    setTimeout(function () {
      if (red.classList.contains('hidden')) return;
      var t = document.createElement('div');

function eggDroneStart() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!eggAudio) eggAudio = new AC();
    var c = eggAudio;
    if (c.state !== 'running') {
      var p = c.resume();
      if (p && p['catch']) p['catch'](function () {});
    }
    if (eggDrone) return;
    eggDrone = c.createOscillator();
    eggDrone.type = 'sine';
    eggDrone.frequency.value = 44;

    eggLfo = c.createOscillator();
    eggLfo.type = 'sine';
    eggLfo.frequency.value = 0.13;
    var lg = c.createGain();
    lg.gain.value = 2.6;
    eggLfo.connect(lg);
    lg.connect(eggDrone.frequency);

    eggDroneGain = c.createGain();
    eggDroneGain.gain.value = 0;
    eggDrone.connect(eggDroneGain);
    eggDroneGain.connect(c.destination);

    var t = c.currentTime;
    eggDroneGain.gain.setValueAtTime(0, t);
    eggDroneGain.gain.linearRampToValueAtTime(0.13, t + 2.6);

    eggDrone.start();
    eggLfo.start();
  } catch (e) {}
}

function eggDroneStop() {
  if (!eggAudio) return;
  try {
    var c = eggAudio, t = c.currentTime;
    if (eggDroneGain) {
      eggDroneGain.gain.cancelScheduledValues(t);
      eggDroneGain.gain.setValueAtTime(eggDroneGain.gain.value, t);
      eggDroneGain.gain.linearRampToValueAtTime(0, t + 0.9);
    }
    if (eggDrone) { try { eggDrone.stop(t + 1.0); } catch (e) {} }
    if (eggLfo) { try { eggLfo.stop(t + 1.0); } catch (e) {} }
  } catch (e) {}

function buildCracks() {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = $('crackSvg');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  crackPaths = [];
  function addPath(d, web) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    if (web) p.setAttribute('class', 'web');
    svg.appendChild(p);
    crackPaths.push(p);
  }
  var arms = 8, a, s;
  for (a = 0; a < arms; a++) {
    var ang = (a / arms) * Math.PI * 2 + Math.random() * 0.6;
    var x = 50, y = 50, r = 0;
    var d = 'M50 50';
    var segs = 4 + Math.floor(Math.random() * 4);
    for (s = 0; s < segs; s++) {
      r += 7 + Math.random() * 13;
      ang += (Math.random() - 0.5) * 0.5;
      x = 50 + Math.cos(ang) * r;
      y = 50 + Math.sin(ang) * r;
      d += ' L' + x.toFixed(2) + ' ' + y.toFixed(2);
      if (s === 1 && Math.random() < 0.7) {
        var ba = ang + (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 0.6);
        var br = r + 6 + Math.random() * 10;
        addPath('M' + x.toFixed(2) + ' ' + y.toFixed(2) + ' L' +
          (50 + Math.cos(ba) * br).toFixed(2) + ' ' + (50 + Math.sin(ba) * br).toFixed(2), false);
      }
    }
    addPath(d, false);
  }
  $('crack').classList.add('on');
}

function revealCracks(f) {
  var n = Math.max(1, Math.round(crackPaths.length * f)), i;
  for (i = 0; i < crackPaths.length && i < n; i++) crackPaths[i].classList.add('on');
}

function finalShatter() {
  var NS = 'http://www.w3.org/2000/svg', svg = $('crackSvg'), i, s;
  for (i = 0; i < 26; i++) {
    var x = 6 + Math.random() * 88, y = 6 + Math.random() * 88;
    var ang = Math.random() * Math.PI * 2, len = 8 + Math.random() * 26;
    var d = 'M' + x.toFixed(2) + ' ' + y.toFixed(2);
    var segs = 3 + Math.floor(Math.random() * 3);
    for (s = 0; s < segs; s++) {
      ang += (Math.random() - 0.5) * 0.9;
      x += Math.cos(ang) * (len / segs);
      y += Math.sin(ang) * (len / segs);
      d += ' L' + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'web');
    svg.appendChild(p);
    crackPaths.push(p);
  }
  for (i = 0; i < crackPaths.length; i++) crackPaths[i].classList.add('on');

  eggAlts = [];
  eggFlipOn = false;
  if (eggFlipTimer) { clearInterval(eggFlipTimer); eggFlipTimer = null; }
  $('eggText').innerHTML = '';
  $('eggHint').classList.add('hidden');
  $('egg').classList.add('on');
  document.title = 'd3rlord3';
  eggDroneStart();
  setT(function () { if (eggActive) eggType(); }, 700);
}

function closeEgg() {
  if (!eggActive) return;
  eggActive = false;
  if (eggTyping) { clearTimeout(eggTyping); eggTyping = null; }
  if (eggFlipTimer) { clearInterval(eggFlipTimer); eggFlipTimer = null; }
  if (leftTyping) { clearTimeout(leftTyping); leftTyping = null; }
  eggAlts = [];
  eggDroneStop();
  $('egg').classList.remove('on');
  eggBuf = '';
  if (state.kiyRun) { state.kiyRun = false; resetToTitle(); }
  else { document.title = TITLE_ORIG; }
}

function resetToTitle() {
  stopRepeatSpeak();
  clearTimers();
  closeFinalSeq();
  stopBuzz();
  stopHeart();
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  if (ctx && ctx.state === 'running') { try { ctx.suspend(); } catch (e) {} }
  if (whisperTimer) { clearTimeout(whisperTimer); whisperTimer = null; }
  state.whispersScheduled = false;
  state.jitterScheduled = false;
  $('crack').classList.remove('on');
  // 侵入层全部复位
  state.frozen = false;
  state.silence = false;
  $('quiz').classList.remove('frozen');
  $('quiz').classList.remove('creep');
  $('ghostLine').classList.add('hidden');
  $('vignette').classList.remove('on');
  $('vignette').classList.remove('noise');
  $('vignette').classList.remove('deep');
  $('vignette').classList.remove('pulse');
  $('preFlash').classList.remove('on');
  $('preFlash').style.background = '';
  $('ghostCursor').classList.remove('on');
  ghostCurOn = false;
  if (ghostCurTimer) { clearInterval(ghostCurTimer); ghostCurTimer = 0; }
  stopInfra();
  document.body.classList.remove('kiy-final');
  document.body.classList.remove('shake-hard');
  document.body.style.background = '';
  $('progress').classList.add('hidden');
  $('options').innerHTML = '';
  $('qtext').innerHTML = '';
  $('next').disabled = true;
  state.idx = 0;
  state.selected = -1;
  state.climaxMode = false;
  state.skipClimax = false;
  state.eggMode = false;
  state.hasInteracted = false;
  $('watchLayer').classList.remove('on');
  $('watchLayer').classList.remove('egg');
  syncWatchSrc();
  show('consent');
  document.title = TITLE_ORIG;
}

document.addEventListener('keydown', function (e) {
  if (eggActive) {
    if (e.key === 'Escape') { e.preventDefault(); closeEgg(); }
    return;
  }
  if (e.key === 'Escape' && state.kiyRun) {
    e.preventDefault();
    state.kiyRun = false;
    resetToTitle();
    return;
  }
  if (state.hasInteracted) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  var k = e.key;
  if (!k) { eggBuf = ''; return; }
  if (k.length !== 1) {
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].indexOf(k) < 0) eggBuf = '';
    return;
  }
  eggBuf = (eggBuf + k.toLowerCase()).slice(-EGG_KEY.length);
  if (eggBuf === EGG_KEY) armEgg();
}, true);

$('egg').addEventListener('click', function () { if (eggDone) closeEgg(); });

/* 也可用 #d3rlord3 触发（手机等无键盘场景） */
function eggFromHash() {
  try {
    if (location.hash.replace(/^#/, '').toLowerCase() === EGG_KEY) armEgg();
  } catch (e) {}
}
window.addEventListener('hashchange', eggFromHash);
setT(eggFromHash, 0);

$('startBtn').addEventListener('click', function () {
  if (state.hasInteracted) return;
  state.hasInteracted = true;
  try {
    var rc = parseInt(localStorage.getItem('psych-return-count') || '0', 10);
    if (isNaN(rc)) rc = 0;
    rc += 1;
    state.returnCount = rc;
    localStorage.setItem('psych-return-count', String(rc));
  } catch (e) { state.returnCount = 1; }
  if ('Notification' in window && Notification.permission === 'default') {
    try {
      var req = Notification.requestPermission();
      if (req && req.then) {
        req.then(function (p) { data.permissions.notification = p; })['catch'](function () { data.permissions.notification = 'denied'; });
      }
    } catch (e) { data.permissions.notification = 'denied'; }
  }
  initAudio();
  try {
    var el = document.documentElement;
    var fs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fs) {
      var p = fs.call(el);
      if (p && p['catch']) p['catch'](function () {});
    }
  } catch (e) {}
  data.startedAt = Date.now();
  registerBg();
  scheduleRandomWhispers();
  scheduleCursorJitter();
  initTitleGlitch();
  probeSpeech(function (ok) {
    state.speech = ok ? 'tts' : 'mp3';
    renderQuestion(0);
  });
});


function flashImg(id, ms) {
  var el = $(id);
  if (!el) return;
  el.classList.add('on');
  setT(function () { el.classList.remove('on'); }, ms || 120);
}
function scheduleHauntImages() {
  var photoTimer = setInterval(function () {
    if (state.idx < 6 || state.idx > 35 || state.climaxMode || !state.hasInteracted) { clearInterval(photoTimer); return; }
    if (Math.random() < 0.55) flashImg('imgPhoto', 70 + Math.random() * 90);
  }, 14000);
  var mirrorTimer = setInterval(function () {
    if (state.idx < 9 || state.idx > 35 || state.climaxMode) { clearInterval(mirrorTimer); $('imgMirror').classList.remove('on'); return; }
    if (Math.random() < 0.4) flashImg('imgMirror', 100);
  }, 18000);
  var figTimer = setInterval(function () {
    var f = $('imgFigure');
    if (!f) return;
    if (state.idx < 20 || state.idx > 35 || state.climaxMode) { f.classList.remove('on'); f.style.opacity = ''; clearInterval(figTimer); return; }
    f.classList.add('on');
    f.style.opacity = '0.12';
    if (Math.random() < 0.25) {
      f.style.opacity = '0.55';
      setT(function () { f.style.opacity = '0.12'; }, 150);
    }
  }, 9000);
  var chairTimer = setInterval(function () {
    if (state.idx < 32 || state.idx > 35 || state.climaxMode) { clearInterval(chairTimer); return; }
    if (Math.random() < 0.35) flashImg('imgChair', 130);
  }, 11000);
}
function portraitJump() {
  var el = $('imgPortrait');
  if (!el) return;
  el.classList.add('on');
  setT(function () { el.classList.remove('on'); }, 180);
  setT(function () { el.classList.add('on'); }, 320);
  setT(function () { el.classList.remove('on'); }, 400);
}
function memorialWallShow(cb) {
  var w = $('memorialWall');
  if (!w) { if (cb) cb(); return; }
  var cap = $('mwCaption');
  if (cap) {
    cap.textContent = '他们都在看';
    setT(function () { if (cap) cap.textContent = '第 2 位受试者已入席'; }, 1400);
    setT(function () { if (cap) cap.textContent = '就是你'; }, 2600);
  }
  w.classList.add('on');
  var cells = w.querySelectorAll('.mw-cell');
  var i = 0;
  function flick() {
    if (i >= cells.length) {
      setT(function () { w.classList.remove('on'); if (cb) cb(); }, 900);
      return;
    }
    cells[i].classList.add('flash');
    (function (c) { setT(function () { c.classList.remove('flash'); }, 60); })(cells[i]);
    i++;
    setT(flick, 70 + Math.random() * 100);
  }
  setT(flick, 400);
}
function finalJumpFace() {
  var el = $('imgFinalJump');
  if (!el) return;
  el.classList.add('on');
  setT(function () { el.classList.remove('on'); }, 100);
}

var _origStartClimax = startClimax;
startClimax = function () {
  state.climaxMode = true;
  state.skipClimax = false;
  if (!state.eggMode) {
    stopRepeatSpeak();
    setBgm('full');
    stopBuzz();
    startHeart(heartBpmFor(31));
  }
  show('climax');
  $('climax').innerHTML = '';
  preFlashFrames();
  memorialWallShow(function () {
    finalJumpFace();
    setT(function () {
      escalatingSpeak('别回头', 6);
      printWaves(0, 0, 0);
    }, 450);
  });
};

var _origRenderQuiz = renderQuiz;
renderQuiz = function (i) {
  _origRenderQuiz(i);
  if (i === 28) setT(portraitJump, 800);
  if (i === 34) setT(function () { flashImg('imgChair', 200); }, 600);
};


/* ===== 身后问卷专属机制 ===== */
var hauntFX = {
  mirrorOn: false,
  autoPickUsed: {},
  pauseDone: {},
  answererTimer: null
};

function setMirror(on) {
  hauntFX.mirrorOn = !!on;
  document.body.classList.toggle('mirror-mode', on);
}
function setTilt(on) {
  document.body.classList.toggle('tilted', !!on);
}
function setPresence(on) {
  document.body.classList.toggle('silhouette-presence', !!on);
  document.body.classList.toggle('has-it', !!on);
}
function glitchBars(n, ms) {
  var g = $('glitchBars');
  if (!g) return;
  g.innerHTML = '';
  g.classList.add('on');
  for (var i = 0; i < (n || 6); i++) {
    var b = document.createElement('div');
    b.className = 'bar';
    b.style.top = (Math.random() * 100) + '%';
    b.style.height = (1 + Math.random() * 4) + 'px';
    b.style.opacity = String(0.3 + Math.random() * 0.7);
    g.appendChild(b);
  }
  setT(function () { g.classList.remove('on'); g.innerHTML = ''; }, ms || 120);
}
function showLongPause(sec, cb) {
  var el = $('longPause');
  if (!el) { if (cb) cb(); return; }
  el.classList.add('on');
  setT(function () { el.classList.remove('on'); if (cb) cb(); }, (sec || 6) * 1000);
}
function answererTag(on) {
  var t = $('answererTag');
  if (!t) return;
  if (on) {
    t.classList.add('on');
    hauntFX.answererTimer = setT(function () { t.classList.remove('on'); }, 4000);
  } else {
    t.classList.remove('on');
  }
}

/* 它替你选：某些题自动点亮一个错误/更吓人的选项 */
function maybeAutoPick(i) {
  var forced = {
    14: 3,  // 「你怎么知道」
    18: 3,  // 「它说它替你答了」
    23: 3,  // 「你转过去看看」
    26: 1,  // 「不一样」
    33: 3,  // 「它刚离开」
    35: 3   // 「你终于发现了」
  };
  if (forced[i] === undefined || hauntFX.autoPickUsed[i]) return;
  hauntFX.autoPickUsed[i] = true;
  setT(function () {
    var btns = $('options').querySelectorAll('.opt');
    if (!btns || !btns[forced[i]]) return;
    answererTag(true);
    btns[forced[i]].classList.add('auto-picked', 'sel');
    state.selected = forced[i];
    $('next').disabled = false;
    glitchBars(3, 90);
  }, 2200 + Math.random() * 1800);
}

/* 巨型停顿：某题前整页黑掉几秒 */
function maybeLongPause(i) {
  if (hauntFX.pauseDone[i]) return;
  var triggers = { 19: 7, 27: 9, 31: 6 };  // 题号 → 停顿秒数
  if (!triggers[i]) return;
  hauntFX.pauseDone[i] = true;
  setT(function () {
    showLongPause(triggers[i], function () {
      glitchBars(8, 200);
    });
  }, 900);
}

/* 包一层 renderQuestion，挂新机制 */
var _rq = renderQuestion;
renderQuestion = function (i) {
  _rq(i);
  if (!state.hasInteracted) return;
  /* 镜像段：Q12–15 名字段 */
  setMirror(i >= 12 && i <= 15);
  /* 倾斜：Q24 起 */
  setTilt(i >= 24 && i <= 35);
  /* 身后存在感剪影：Q20 起 */
  setPresence(i >= 20 && i <= 35);
  /* 扫描线：Q16 起 */
  document.body.classList.toggle('scanlines', i >= 16 && i <= 35);
  maybeAutoPick(i);
  maybeLongPause(i);
  /* 偶发整页 glitch */
  if (i >= 10 && i <= 35 && Math.random() < 0.22) {
    setT(function () { glitchBars(4 + Math.random() * 5, 80 + Math.random() * 100); }, 1500 + Math.random() * 2500);
  }
};

/* 它先替你答了：推进时偶尔「下一题」按钮假装失灵一次 */
var _adv = advance;
var _ghostClicks = {};
advance = function () {
  var i = state.idx;
  if (i >= 16 && i <= 30 && !_ghostClicks[i] && Math.random() < 0.28) {
    _ghostClicks[i] = true;
    glitchBars(3, 70);
    /* 吞掉这一次点击，0.8s 后才真正推进 */
    setT(function () { _adv(); }, 800);
    return;
  }
  _adv();
};

/* 进度条除了倒退，还会「多报一个人」 */
var _up = updateProgress;
updateProgress = function () {
  _up();
  if (state.idx >= 20 && state.idx <= 35 && Math.random() < 0.18) {
    $('progress').textContent = '第 ' + (state.idx + 1) + ' 柱香 · 两人共燃';
    setT(function () { if ($('progress')) _up(); }, 1600);
  }
};

/* 清理：离开 quiz 范围时关掉镜像/倾斜 */
var _show = show;
show = function (name) {
  _show(name);
  if (name !== 'quiz') {
    setMirror(false); setTilt(false); setPresence(false);
    document.body.classList.remove('scanlines');
  }
};

scheduleHauntImages();

window.addEventListener('beforeunload', function (e) {
  if (state.hasInteracted && !state.frozen) {
    e.preventDefault();
    e.returnValue = '你确定要留它一个人吗';
    return '你确定要留它一个人吗';
  }
});
$('exitBtn').addEventListener('click', fakeClose);

})();
</script>
</body>
