<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>夜间独处习惯调查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:#050608;
  color:#b9b4a8;
  font-family:'Songti SC','SimSun','Noto Serif SC','STSong',serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:.08em;
  cursor:none;
  user-select:none;
  -webkit-user-select:none;
}
body.touch{cursor:auto}

/* ===== 电影颗粒 + 暗角 ===== */
#grain{
  position:fixed;inset:-50%;z-index:45;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity:.045;
  animation:grainShift .45s steps(2) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}
  50%{transform:translate(1%,-2%)}75%{transform:translate(-1%,2%)}
  100%{transform:translate(2%,-1%)}
}
#vignette{
  position:fixed;inset:0;z-index:44;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 48%, transparent 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.88) 100%);
}

/* ===== 手电筒：柔光，不是硬圆 ===== */
#dark{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(ellipse 180px 160px at var(--mx,50%) var(--my,50%),
    rgba(0,0,0,0) 0%, rgba(0,0,0,0) 30%, rgba(2,3,5,.72) 58%, rgba(2,3,5,.94) 82%, #020305 100%);
}
body.wide #dark{
  background:radial-gradient(ellipse 340px 300px at var(--mx,50%) var(--my,50%),
    rgba(0,0,0,0) 0%, rgba(0,0,0,0) 32%, rgba(2,3,5,.55) 60%, rgba(2,3,5,.88) 85%, #020305 100%);
}
#cursorDot{
  position:fixed;z-index:50;width:4px;height:4px;border-radius:50%;
  background:rgba(200,180,140,.55);pointer-events:none;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(200,180,140,.25);
}

/* ===== 房间底：故意的摄影感渐变，不是色块 ===== */
#room{
  position:fixed;inset:0;z-index:10;
  background:
    /* 窗外微光 */
    radial-gradient(ellipse 30% 40% at 18% 30%, rgba(30,50,70,.18) 0%, transparent 70%),
    /* 台灯余温 */
    radial-gradient(ellipse 20% 18% at 55% 42%, rgba(80,60,30,.08) 0%, transparent 70%),
    /* 地板反光 */
    linear-gradient(180deg, transparent 0 62%, rgba(12,10,8,.4) 62%, rgba(8,7,5,.9) 100%),
    /* 墙 */
    linear-gradient(175deg, #0a0b0e 0%, #0c0d11 40%, #0e0e12 62%, transparent 62%);
}
#room.tilt{transform:rotate(.35deg) scale(1.008)}

/* ===== 热区：镜头式金圈，不是方框 ===== */
.hot{
  position:absolute;z-index:12;
  cursor:none;
  transition:opacity .6s;
}
.hot::before{
  content:'';position:absolute;left:50%;top:50%;
  width:56px;height:56px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(170,150,110,.18);
  transition:border-color .4s, box-shadow .4s, transform .4s, opacity .4s;
  opacity:.55;
}
.hot:hover::before{
  border-color:rgba(190,165,110,.65);
  box-shadow:0 0 28px rgba(170,140,80,.18), inset 0 0 18px rgba(170,140,80,.06);
  transform:translate(-50%,-50%) scale(1.12);
  opacity:1;
}
.hot.visited::before{
  border-color:rgba(120,110,90,.22);
  opacity:.35;
}
.hot.pulse::before{
  border-color:rgba(196,120,80,.7) !important;
  box-shadow:0 0 36px rgba(196,120,80,.22) !important;
  animation:hotPulse 1.8s ease-in-out infinite !important;
  opacity:1 !important;
}
@keyframes hotPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.45}
  50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}
}
.hot .lbl{
  position:absolute;left:50%;top:calc(50% + 36px);transform:translateX(-50%);
  font-size:11px;letter-spacing:.35em;color:#8a7d68;
  white-space:nowrap;opacity:0;transition:opacity .3s, color .3s;
  pointer-events:none;
}
.hot:hover .lbl{opacity:1;color:#c4b088}
.hot::after{
  content:'';position:absolute;left:50%;top:50%;
  width:3px;height:3px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(170,150,110,.5);
  transition:background .3s;
}
.hot:hover::after{background:rgba(200,175,120,.9)}

/* ===== 物件剪影：极简线稿，不画家具 ===== */
.sil{
  position:absolute;pointer-events:none;
  opacity:.5;transition:opacity 1.2s, filter 1.2s;
}
.hot:hover .sil{opacity:.85}

/* 窗：细长竖框 + 十字棂 */
#hWindow{left:10%;top:14%;width:16%;height:40%}
#hWindow .sil{
  inset:0;
  border:1px solid rgba(90,100,120,.4);
  background:linear-gradient(180deg, rgba(18,28,40,.5), rgba(10,14,20,.7));
}
#hWindow .sil::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg, transparent 49.5%, rgba(90,100,120,.35) 49.5% 50.5%, transparent 50.5%),
    linear-gradient(0deg, transparent 49.5%, rgba(90,100,120,.35) 49.5% 50.5%, transparent 50.5%);
}
#hWindow .figure{
  position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
  width:22px;height:56px;
  background:radial-gradient(ellipse at 50% 12%, #0e1014 0 28%, transparent 70%),
             linear-gradient(180deg,#0c0e12,#08090c);
  border-radius:11px 11px 2px 2px;
  opacity:0;transition:opacity 2.5s;
}
#hWindow.figure .figure{opacity:.9}
#hWindow .curtain{
  position:absolute;top:0;bottom:0;width:42%;
  background:linear-gradient(90deg,#0a0b10,#12141a 50%,#0a0b10);
  z-index:2;transition:transform 1.4s cubic-bezier(.4,0,.2,1);
  opacity:.92;
}
#hWindow .curtain.l{left:-1px}
#hWindow .curtain.r{right:-1px}
#hWindow.open .curtain.l{transform:translateX(-78%)}
#hWindow.open .curtain.r{transform:translateX(78%)}

/* 门：高瘦轮廓 */
#hDoor{right:8%;top:10%;width:11%;height:56%}
#hDoor .sil{
  inset:0;
  border:1px solid rgba(80,75,65,.45);
  background:linear-gradient(180deg, rgba(16,14,12,.6), rgba(10,9,8,.85));
}
#hDoor .knob{
  position:absolute;right:14%;top:48%;width:5px;height:5px;border-radius:50%;
  background:rgba(160,140,100,.55);box-shadow:0 0 6px rgba(160,140,100,.2);
}
#hDoor .under{
  position:absolute;left:5%;right:5%;bottom:-4px;height:4px;
  background:radial-gradient(ellipse at 50% 50%, #000 0%, transparent 80%);
  opacity:0;transition:opacity 1.2s;
}
#hDoor.wrong .under{opacity:1}
#hDoor .crack{
  position:absolute;inset:1px;
  background:linear-gradient(90deg,#000 0%, #000 85%, transparent 100%);
  transform-origin:left center;transform:scaleX(0);
  transition:transform 2.2s ease;opacity:.92;
}
#hDoor.openish .crack{transform:scaleX(.1)}

/* 椅子：只有轮廓线 */
#hChair{left:60%;bottom:20%;width:12%;height:24%}
#hChair .sil{
  inset:0;
  border:none;
}
#hChair .sil::before{
  content:'';position:absolute;left:15%;right:15%;bottom:18%;height:1px;
  background:rgba(90,85,75,.45);box-shadow:0 -1px 0 rgba(90,85,75,.2);
}
#hChair .sil::after{
  content:'';position:absolute;left:22%;right:22%;bottom:20%;height:55%;
  border:1px solid rgba(90,85,75,.4);border-bottom:none;
  border-radius:2px 2px 0 0;
}
#hChair .shadow{
  position:absolute;inset:5% 0 0;
  background:radial-gradient(ellipse at 50% 85%, rgba(0,0,0,.55), transparent 70%);
  opacity:0;transition:opacity 2s;
}
#hChair.occupied .shadow{opacity:1}
#hChair.occupied .sil::before,
#hChair.occupied .sil::after{border-color:rgba(140,100,80,.5)}
#hChair.occupied .sil::before{background:rgba(140,100,80,.5)}

/* 手机 */
#hPhone{left:34%;bottom:30%;width:7%;height:11%}
#hPhone .sil{
  inset:12% 18%;
  border:1px solid rgba(100,100,110,.5);
  border-radius:2px;
  background:rgba(8,9,12,.8);
}
#hPhone .glow{
  position:absolute;inset:-30%;border-radius:6px;
  background:radial-gradient(circle, rgba(90,140,170,.2), transparent 70%);
  opacity:0;transition:opacity .6s;
}
#hPhone.lit .glow{opacity:1}
#hPhone.lit .sil{border-color:rgba(120,170,200,.65);box-shadow:0 0 16px rgba(90,140,170,.2)}

/* 屏幕 */
#hScreen{left:38%;top:30%;width:24%;height:26%}
#hScreen .sil{
  inset:0;
  border:1px solid rgba(70,75,85,.5);
  background:linear-gradient(180deg, rgba(10,12,16,.7), rgba(8,9,12,.85));
}
#hScreen .inner{
  position:absolute;inset:8%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:.4em;color:#4a4840;
  overflow:hidden;
}
#hScreen .inner .msg{opacity:.55;transition:opacity .6s,color .6s}
#hScreen.watching .inner .msg{color:#b89060;opacity:.95}
#hScreen.watching .sil{border-color:rgba(150,120,70,.45)}

/* 镜子：椭圆框 */
#hMirror{left:14%;top:16%;width:12%;height:32%}
#hMirror .sil{
  inset:0;
  border:1px solid rgba(100,105,120,.4);
  border-radius:50% 50% 48% 48%;
  background:linear-gradient(160deg, rgba(16,20,28,.65), rgba(10,12,16,.8));
}
#hMirror .ref{
  position:absolute;inset:6px;
  border-radius:50%;
  opacity:0;transition:opacity 2s;
}
#hMirror .ref .head{
  position:absolute;left:50%;bottom:10%;transform:translateX(-50%);
  width:28px;height:34px;border-radius:50% 50% 40% 40%;
  background:radial-gradient(ellipse at 50% 30%, #141820, #0a0c10 80%);
}
#hMirror.showref .ref{opacity:1}
#hMirror.blink .ref .head{animation:refBlink 3.2s ease infinite}
@keyframes refBlink{0%,88%,100%{opacity:1}93%{opacity:0}}

/* 相框 */
#hPhoto{left:50%;top:18%;width:8%;height:14%}
#hPhoto .sil{
  inset:0;
  border:3px solid rgba(90,75,50,.55);
  background:#0c0a08;
  overflow:hidden;
}
#hPhoto .sil img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(.55) brightness(.55) contrast(1.05);
  opacity:.9;transition:filter .8s, opacity .8s;
}
#hPhoto.wrong .sil img{filter:grayscale(.1) brightness(.75) contrast(1.15);opacity:1}
#hPhoto .stamp{
  position:absolute;right:1px;bottom:0;
  font-size:7px;color:#6a5840;letter-spacing:.08em;
}

/* 床 */
#hBed{left:8%;bottom:16%;width:18%;height:18%}
#hBed .sil{
  inset:auto 0 0 0;height:55%;
  border:1px solid rgba(80,78,70,.4);
  border-radius:2px 2px 0 0;
  background:linear-gradient(180deg, rgba(14,13,12,.5), rgba(10,9,8,.75));
}
#hBed .pill{
  position:absolute;left:8%;top:18%;width:24%;height:36%;
  border:1px solid rgba(80,78,70,.35);border-radius:6px;
  opacity:.7;
}
#hBed .dip{
  position:absolute;left:38%;top:25%;width:42%;height:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.45), transparent 70%);
  opacity:0;transition:opacity 1.5s;
}
#hBed.slept .dip{opacity:1}

/* 天花板 */
#hCeil{left:25%;top:4%;width:50%;height:10%}
#hCeil .sil{inset:0;border:none}
#hCeil .stain{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(50,18,14,.35), transparent 70%);
  opacity:0;transition:opacity 2.5s;
}
#hCeil.wet .stain{opacity:1}

/* 桌下 */
#hUnder{left:30%;bottom:8%;width:26%;height:12%}
#hUnder .sil{
  inset:0;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.5) 50%, #000 100%);
  border:none;
}
#hUnder .eyes{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  display:flex;gap:12px;opacity:0;transition:opacity .25s;
}
#hUnder .eyes i{
  width:4px;height:4px;border-radius:50%;
  background:#c47050;box-shadow:0 0 10px #c47050;
}
#hUnder.peek .eyes{opacity:1}

/* ===== 旁白 ===== */
#narr{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:36px 32px 36px;
  background:linear-gradient(180deg, transparent, rgba(2,3,5,.92) 45%);
  min-height:130px;
  pointer-events:none;
}
#narr .nline{
  max-width:560px;margin:0 auto;
  font-size:15px;line-height:2.2;
  color:#c8c0b0;
  min-height:2.4em;
  text-align:center;
  white-space:pre-wrap;
  text-shadow:0 1px 8px rgba(0,0,0,.8);
}
#narr .nline.dim{color:#7a7468;font-size:12.5px;letter-spacing:.12em}
#narr .nline .caret{
  display:inline-block;width:1px;height:1em;background:#b89060;
  vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

#prog{
  position:fixed;top:22px;right:26px;z-index:70;
  font-size:10px;letter-spacing:.35em;color:#4a4538;
  pointer-events:none;
}
#hint{
  position:fixed;top:22px;left:26px;z-index:70;
  font-size:10px;letter-spacing:.3em;color:#4a4538;
  pointer-events:none;transition:opacity 1s;
}

/* ===== 特效 ===== */
#flash{position:fixed;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .12s}
#flash.on{opacity:1}
#invertFx{position:fixed;inset:0;background:#f0ebe0;z-index:91;opacity:0;pointer-events:none;mix-blend-mode:difference}

#bigWord{
  position:fixed;inset:0;z-index:95;display:flex;
  align-items:center;justify-content:center;
  font-size:clamp(32px,9vw,72px);letter-spacing:.35em;
  color:#e8e0d0;opacity:0;pointer-events:none;
  transition:opacity .08s;
  text-shadow:0 0 60px rgba(0,0,0,.95);
  font-weight:400;
}
#bigWord.on{opacity:1}
#bigWord.inv{color:#0a0a08;background:#e8e0d0}

#jump{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;background:#000;
}
#jump.on{display:flex}
#jump img{max-width:100%;max-height:100%;object-fit:contain}
#jump.full img{width:100%;height:100%;object-fit:cover}
#jump.inv{filter:invert(1)}
#jumpShake{
  position:fixed;inset:-20px;z-index:99;display:none;pointer-events:none;
}
#jumpShake.on{display:block;animation:shake .07s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-7px,3px)}
  50%{transform:translate(5px,-5px)}75%{transform:translate(-3px,7px)}
  100%{transform:translate(0,0)}
}

#sysNote{
  position:fixed;top:28px;left:50%;transform:translateX(-50%);
  z-index:96;background:rgba(12,12,14,.92);
  border:1px solid rgba(140,120,80,.3);
  border-radius:8px;
  padding:12px 22px;min-width:240px;
  opacity:0;transition:opacity .45s;pointer-events:none;
  backdrop-filter:blur(8px);
}
#sysNote.on{opacity:1}
#sysNote .sn-t{font-size:12px;color:#c8c0b0;letter-spacing:.12em}
#sysNote .sn-s{font-size:11px;color:#7a7468;margin-top:5px;letter-spacing:.06em}

#voiceTag{
  position:fixed;bottom:22px;right:26px;z-index:70;
  font-size:9px;letter-spacing:.25em;color:#2e2c28;
  pointer-events:none;transition:color .4s, opacity .4s;opacity:0;
}
#voiceTag.on{opacity:1;color:#5a5548}
#voiceTag.live{color:#c47050}

/* 来电 */
#call{
  position:fixed;inset:0;z-index:110;display:none;
  background:rgba(3,4,6,.97);
  flex-direction:column;align-items:center;justify-content:center;gap:22px;
}
#call.on{display:flex}
#call .cf{font-size:10px;letter-spacing:.5em;color:#5a5548}
#call .cn{
  font-size:clamp(20px,5.5vw,28px);letter-spacing:.15em;color:#e0d8c8;
  animation:cp 1.6s ease infinite;font-weight:400;
}
@keyframes cp{0%,100%{opacity:1}50%{opacity:.55}}
#call .cbtns{display:flex;gap:48px;margin-top:28px}
#call button{
  background:none;border:none;
  border-bottom:1px solid rgba(140,120,80,.35);
  color:#a89d88;font-family:inherit;font-size:13px;letter-spacing:.4em;
  padding:12px 8px;cursor:pointer;transition:color .3s,border-color .3s;
}
#call button:hover{color:#c47050;border-bottom-color:#c47050}

/* 结尾 */
#end{
  position:fixed;inset:0;z-index:120;display:none;
  background:#020203;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
}
#end.on{display:flex}
#end .etext{
  font-size:clamp(15px,3.5vw,18px);line-height:2.6;color:#b9b4a8;
  letter-spacing:.15em;white-space:pre-wrap;min-height:6em;
}
#end .emeta{margin-top:40px;font-size:10px;color:#4a4538;letter-spacing:.3em}

#presence{
  position:fixed;right:-8%;bottom:-12%;width:42vw;height:82vh;z-index:35;
  background:radial-gradient(ellipse at 40% 80%, rgba(0,0,0,.5) 0%, transparent 70%);
  opacity:0;transition:opacity 3.5s;pointer-events:none;
}
#presence.on{opacity:1}

#typeGhost{
  position:fixed;left:28px;bottom:110px;z-index:65;
  font-size:11px;letter-spacing:.25em;color:#4a4538;
  opacity:0;transition:opacity .5s;pointer-events:none;
}
#typeGhost.on{opacity:1}
#typeGhost .dots::after{content:'…';animation:df 1.2s ease infinite}
@keyframes df{0%,100%{opacity:.2}50%{opacity:1}}

@media (max-width:640px){
  #narr{padding:24px 18px 28px;min-height:110px}
  #narr .nline{font-size:14px;line-height:2}
  #hWindow{left:6%;top:12%;width:22%;height:36%}
  #hDoor{right:4%;width:14%}
  #hMirror{display:none}
  #hPhoto{left:44%;width:12%;height:12%}
  #hScreen{left:22%;width:56%;top:28%}
  .hot .lbl{display:none}
  .hot::before{width:44px;height:44px}
}
</style>
</head>
<body>

<div id="room"></div>
<div id="presence"></div>
<div id="grain"></div>
<div id="vignette"></div>
<div id="dark"></div>
<div id="cursorDot"></div>

<div id="narr"><div class="nline" id="nline"></div></div>
<div id="prog"></div>
<div id="hint">移动光标 · 点击发光的物件</div>
<div id="typeGhost">受试者 B<span class="dots"></span></div>
<div id="voiceTag">语音 · 待命</div>

<div id="flash"></div>
<div id="invertFx"></div>
<div id="bigWord"></div>
<div id="jump"><img id="jumpImg" alt=""></div>
<div id="jumpShake"></div>
<div id="sysNote"><div class="sn-t" id="snT"></div><div class="sn-s" id="snS"></div></div>

<div id="call">
  <div class="cf">来电</div>
  <div class="cn" id="callName">未知号码</div>
  <div class="cbtns">
    <button type="button" id="callAns">接 听</button>
    <button type="button" id="callDec">拒 绝</button>
  </div>
</div>

<div id="end">
  <div class="etext" id="endText"></div>
  <div class="emeta" id="endMeta"></div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var room = $('room');
  var nline = $('nline');
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  /* ---------- 状态 ---------- */
  var S = {
    name: '',
    visits: 0,
    done: {},          /* 物件 → 访问次数 */
    order: [],         /* 点击顺序 */
    started: false,
    ending: false,
    callSeen: false,
    presenceOn: false,
    startedAt: 0,
    facts: []
  };

  try {
    S.visits = parseInt(localStorage.getItem('haunt_v') || '0', 10) + 1;
    localStorage.setItem('haunt_v', String(S.visits));
  } catch (e) {}

  /* 真实浏览器事实 */
  try {
    var city = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop();
    if (city) S.facts.push(city);
  } catch (e) {}
  if (screen.width) S.facts.push(screen.width + '×' + screen.height);

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var typeToken = 0;
  function say(text, opts) {
    opts = opts || {};
    var token = ++typeToken;
    nline.classList.toggle('dim', !!opts.dim);
    nline.innerHTML = '';
    var span = document.createElement('span');
    var caret = document.createElement('span');
    caret.className = 'caret';
    nline.appendChild(span);
    nline.appendChild(caret);

    if (opts.instant) {
      span.textContent = text;
      return sleep(opts.hold || 1200);
    }
    var speed = opts.speed || 70;
    var i = 0;
    return new Promise(function (resolve) {
      function step() {
        if (token !== typeToken) { resolve(); return; }
        if (i >= text.length) {
          setTimeout(resolve, opts.hold || 1000);
          return;
        }
        span.textContent += text[i++];
        var d = speed;
        if (Math.random() < 0.06) d += 150 + Math.random() * 300;
        if (text[i - 1] === '。' || text[i - 1] === '？') d += 280;
        setTimeout(step, d);
      }
      step();
    });
  }

  /* ---------- 音频 ---------- */
  var actx = null, droneOsc = null, droneGain = null, lfoOsc = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function startDrone() {
    if (!actx) return;
    try {
      droneGain = actx.createGain();
      droneGain.gain.value = 0;
      droneGain.connect(actx.destination);
      droneOsc = actx.createOscillator();
      droneOsc.type = 'sine';
      droneOsc.frequency.value = 48;
      lfoOsc = actx.createOscillator();
      lfoOsc.frequency.value = 0.1;
      var lg = actx.createGain();
      lg.gain.value = 2.5;
      lfoOsc.connect(lg);
      lg.connect(droneOsc.frequency);
      droneOsc.connect(droneGain);
      droneOsc.start();
      lfoOsc.start();
      droneGain.gain.linearRampToValueAtTime(0.05, actx.currentTime + 5);
    } catch (e) {}
  }
  function swellDrone(to, sec) {
    if (!actx || !droneGain) return;
    try {
      droneGain.gain.linearRampToValueAtTime(to, actx.currentTime + (sec || 2));
    } catch (e) {}
  }
  function stopDrone() {
    try { if (droneOsc) droneOsc.stop(); if (lfoOsc) lfoOsc.stop(); } catch (e) {}
  }

  function whisperPan(pan) {
    if (!actx) return;
    try {
      var p = actx.createStereoPanner ? actx.createStereoPanner() : null;
      if (!p) return;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = 160 + Math.random() * 100;
      g.gain.value = 0;
      o.connect(g);
      g.connect(p);
      p.connect(actx.destination);
      p.pan.value = pan;
      o.start();
      g.gain.linearRampToValueAtTime(0.045, actx.currentTime + 0.35);
      g.gain.linearRampToValueAtTime(0, actx.currentTime + 2.1);
      setTimeout(function () { o.stop(); }, 2300);
    } catch (e) {}
  }

  function scream(ms, vol) {
    if (!actx) return;
    try {
      var len = Math.floor(actx.sampleRate * (ms / 1000));
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.7 + Math.sin(i * 0.14) * 0.45;
        var t = i / len;
        data[i] *= Math.exp(-t * 5.5) * (t < 0.02 ? t / 0.02 : 1);
      }
      var src = actx.createBufferSource();
      src.buffer = buf;
      var g = actx.createGain();
      g.gain.value = vol || 0.5;
      var f = actx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 380;
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start();
    } catch (e) {}
  }

  function thud() {
    if (!actx) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(110, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(28, actx.currentTime + 0.5);
      g.gain.setValueAtTime(0.45, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.65);
    } catch (e) {}
  }

      if (tag) {

          tag.classList.remove('live');
          setTimeout(function () { tag.classList.remove('on'); }, 2000);
        };

    } catch (e) {}
  }

      };
    });
  }

  function playRing() {
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      g.gain.value = 0;
      for (var k = 0; k < 3; k++) {
        var t0 = t + k * 1.5;
        o.frequency.setValueAtTime(440, t0);
        o.frequency.setValueAtTime(480, t0 + 0.32);
        g.gain.linearRampToValueAtTime(0.06, t0 + 0.04);
        g.gain.setValueAtTime(0.06, t0 + 0.6);
        g.gain.linearRampToValueAtTime(0, t0 + 0.85);
      }
      o.start(t); o.stop(t + 4.5);
    } catch (e) {}
  }

  async function liveCall() {
    /* 用 bigWord 屏 + 旁白演通话 */
    var lines = [
      [1.0, '……喂？'],
      [3.2, '别挂。'],
      [5.5, '我不是打错的。'],
      [8.5, '你身后那把椅子——'],
      [11.5, '我上一次也坐着它。'],
      [15.0, '现在我在你后面。'],
      [18.5, '通话结束前，别回头。'],
      [22.0, '……到了。']
    ];
    whisperPan(0);
    for (var i = 0; i < lines.length; i++) {
      var wait = i === 0 ? lines[i][0] * 1000 : (lines[i][0] - lines[i - 1][0]) * 1000;
      await sleep(wait);
      bigWord(lines[i][1], Math.min(1400, wait + 400), false);
    }
    document.title = '夜间独处习惯调查';
    flash(400);
    presence(true);
    $('hChair').classList.add('occupied');
  }

  /* ---------- 物件解锁 ---------- */
  var CORE = ['window', 'bed', 'phone', 'mirror', 'photo', 'screen', 'door', 'chair'];
  var LATE = ['ceil', 'under'];

  function refreshPulse() {
    if (S.ending) return;
    var coreDone = CORE.filter(function (id) { return S.done[id]; }).length;
    /* 永远有且只有一个脉冲引导 */
    var target = null;
    if (coreDone < 8) {
      /* 下一个没点过的核心 */
      for (var i = 0; i < CORE.length; i++) {
        if (!S.done[CORE[i]]) { target = CORE[i]; break; }
      }
    } else if (!S.done.ceil) {
      $('hCeil').style.display = '';
      target = 'ceil';
    } else if (!S.done.under) {
      $('hUnder').style.display = '';
      target = 'under';
    } else {
      /* 全点完 → 终局 */
      startEnding();
      return;
    }
    CORE.concat(LATE).forEach(function (id) { pulseHot('h' + id.charAt(0).toUpperCase() + id.slice(1), false); });
    if (target) {
      var id = 'h' + target.charAt(0).toUpperCase() + target.slice(1);
      pulseHot(id, true);
    }
  }

  async function onHot(id) {
    var n = (S.done[id] || 0) + 1;
    markVisited(id);
    refreshPulse();
    /* 先演剧本 */
    if (script[id]) {
      await script[id](n);
    }
    /* 二次访问：幽灵作答闪一下 */
    if (n === 2) typeGhost(2000);
    /* 三次访问后 presence 加强 */
    if (n >= 3) presence(true);
    refreshPulse();
  }

  /* ---------- 开场 ---------- */
  async function boot() {
    buildRoom();
    S.startedAt = Date.now();

    /* 冷开场：假恢复 */
    nline.innerHTML = '';
    var bootEl = document.createElement('span');
    bootEl.style.cssText = 'font-size:11px;letter-spacing:.2em;color:#3a4050;display:block;margin-bottom:16px';
    nline.appendChild(bootEl);
    var car0 = document.createElement('span');
    car0.className = 'caret';
    nline.appendChild(car0);
    var lines = [
      '连接受试者终端……',
      '读取环境光…… 低',
      '检测独处状态…… 是',
      '恢复房间 …… 71%'
    ];
    for (var i = 0; i < lines.length; i++) {
      for (var c = 0; c <= lines[i].length; c++) {
        bootEl.textContent = lines[i].slice(0, c);
        await sleep(22 + Math.random() * 35);
      }
      await sleep(i === 3 ? 700 : 200);
    }
    bootEl.textContent = '恢复房间 …… 100%';
    flash(160);
    await sleep(400);

    nline.innerHTML = '';
    var h = new Date().getHours();
    var late = (h >= 23 || h < 5);

    await say(late ? '房间恢复了。' : '你打开了这个页面。', { speed: 75, hold: 900 });
    await say('这是你现在的房间。', { speed: 65, hold: 800 });
    await say('很暗。', { speed: 60, hold: 1200 });
    await say('打开手电筒，看看周围。', { dim: true, speed: 55, hold: 600 });

    if (S.facts.length) {
      await say('（' + S.facts[0] + ' · 识别完成）', { dim: true, speed: 40, hold: 1200 });
    }

    if (S.visits >= 2) {
      flash(200);
      await say('第 ' + S.visits + ' 次进入这个房间。', { dim: true, speed: 55, hold: 1400 });
    }

    $('hint').textContent = '移动光标 · 点击发光的物件';
    setTimeout(function () { $('hint').style.opacity = '0'; }, 8000);

    initAudio();
    startDrone();
    S.started = true;
    $('prog').textContent = '0 / 9';
    refreshPulse();
  }

  /* ---------- 终局 ---------- */
  async function startEnding() {
    if (S.ending) return;
    S.ending = true;
    document.body.classList.add('wide', 'tilt');
    swellDrone(0.14, 3);
    presence(true);

    await say('你都看过了。', { speed: 70, hold: 1400 });
    await say('房间还是这个房间。', { speed: 60, hold: 1000 });
    await say('变的是你。', { speed: 55, hold: 1800 });

    flash(300);
    await sleep(500);

    /* 全屋一起演 */
    $('hWindow').classList.add('open', 'figure');
    $('hChair').classList.add('occupied');
    $('hDoor').classList.add('wrong', 'openish');
    $('hMirror').classList.add('showref', 'blink');
    $('hPhoto').classList.add('wrong');
    $('hBed').classList.add('slept');
    $('hCeil').style.display = '';
    $('hCeil').classList.add('wet');
    $('hUnder').style.display = '';
    $('hUnder').classList.add('peek');

    await sleep(1200);
    bigWord('它一直都在', 900, true);
    thud();
    invertPulse(3, 100);
    await sleep(800);

    /* 跳脸连段（短、狠） */
    faceJump('resource/haunt/chair.png', { full: true, ms: 800, hold: 700, vol: 0.6 });
    await sleep(400);
    faceJump('resource/haunt/portrait.png', { full: true, ms: 800, hold: 700, vol: 0.65, invert: true });
    await sleep(400);
    faceJump('resource/haunt/photo.png', { full: true, ms: 900, hold: 800, vol: 0.7 });
    thud();

    await sleep(600);
    /* 安静一刀 */
    stopDrone();
    await say('仪式完成了。', { speed: 85, hold: 2000 });
    await say('你可以关掉页面了。', { speed: 80, hold: 2000 });
    await say('它说，', { speed: 75, hold: 1200 });
    vSay('它跟你一起走', 0.3, 0.55);
    await say('它跟你一起走。', { speed: 50, hold: 2400 });

    flash(500);
    await sleep(800);

    /* 来电追出去 */
    await triggerCall();

    /* 结尾屏 */
    var end = $('end');
    var et = $('endText');
    end.classList.add('on');
    et.textContent = '';
    var msg = '房间已关闭。\n但缓存里留了一把钥匙。\n\n下次你打开任何一页，\n它都会先到。';
    for (var i = 0; i < msg.length; i++) {
      et.textContent += msg[i];
      await sleep(70);
    }
    $('endMeta').textContent = '受试者 #' + (5 + S.visits) + ' · 登记完成';
    titleGlitch('别关', '夜间独处习惯调查', 3);

    /* 10 秒后极轻回马枪 */
    setTimeout(function () {
      faceJump('resource/haunt/photo.png', { ms: 400, hold: 350, vol: 0.25, shake: false });
    }, 10000);
  }

  /* ---------- Esc 提示 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.started && !S.ending) {
      say('Esc 出不去。', { dim: true, speed: 50, hold: 1400 });
    }
  });

  /* ---------- 启动 ---------- */
  boot();

})();
</script>
</body>
</html>
