<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>夜间独处习惯调查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:#000;
  color:#a8b898;
  font-family:'Songti SC','SimSun','Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:.08em;
  cursor:none;
  user-select:none;
  -webkit-user-select:none;
}
body.touch{cursor:auto}

/* ===== 夜视监控底：真实照片 ===== */
#feed{
  position:fixed;inset:0;z-index:5;
  background:#0a1208;
  overflow:hidden;
}
#feed img.bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 40%;
  filter:brightness(1.05) contrast(1.15) saturate(1.3) hue-rotate(-8deg);
  image-rendering:auto;
  transform:scale(1.02);
}
/* 夜视绿叠层 */
#feed .tint{
  position:absolute;inset:0;
  background:rgba(20,60,20,.12);
  mix-blend-mode:color;
  pointer-events:none;
}
/* 扫描线 */
#feed .scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    transparent 0 2px, rgba(0,0,0,.12) 2px 3px);
  pointer-events:none;
  animation:scanRoll 9s linear infinite;
}
@keyframes scanRoll{from{background-position:0 0}to{background-position:0 100px}}
/* 暗角 */
#feed .vig{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 75% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);
  pointer-events:none;
}
/* 时间码 OSD */
#osd{
  position:fixed;top:18px;left:20px;z-index:70;
  font-family:'SF Mono','Consolas','Courier New',monospace;
  font-size:11px;letter-spacing:.12em;color:rgba(140,200,120,.55);
  pointer-events:none;
  text-shadow:0 0 6px rgba(80,180,60,.3);
}
#osd .rec{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#c44040;margin-right:8px;vertical-align:middle;
  animation:recBlink 1.2s ease infinite;
  box-shadow:0 0 8px rgba(200,60,60,.5);
}
@keyframes recBlink{0%,100%{opacity:1}50%{opacity:.25}}
#osd2{
  position:fixed;top:18px;right:20px;z-index:70;
  font-family:'SF Mono','Consolas',monospace;
  font-size:10px;letter-spacing:.15em;color:rgba(140,200,120,.4);
  pointer-events:none;text-align:right;
}

/* ===== 手电/光标 ===== */
#dark{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(ellipse 200px 170px at var(--mx,50%) var(--my,50%),
    rgba(0,0,0,0) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.88) 100%);
}
body.wide #dark{
  background:radial-gradient(ellipse 380px 340px at var(--mx,50%) var(--my,50%),
    rgba(0,0,0,0) 0%, rgba(0,0,0,0) 38%, rgba(0,0,0,.4) 68%, rgba(0,0,0,.82) 100%);
}
#cursorDot{
  position:fixed;z-index:50;width:5px;height:5px;border-radius:50%;
  border:1px solid rgba(160,220,140,.7);
  background:transparent;pointer-events:none;
  transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(120,200,100,.3);
}

/* ===== 热区：标在照片实物上 ===== */
.hot{
  position:absolute;z-index:12;
  cursor:none;
}
.hot::before{
  content:'';position:absolute;left:50%;top:50%;
  width:52px;height:52px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px dashed rgba(160,220,140,.25);
  transition:border-color .35s, box-shadow .35s, transform .35s, background .35s;
  opacity:.6;
}
.hot:hover::before{
  border:1px solid rgba(180,240,160,.75);
  box-shadow:0 0 24px rgba(120,200,100,.2), inset 0 0 14px rgba(120,200,100,.06);
  transform:translate(-50%,-50%) scale(1.15);
  background:rgba(120,200,100,.04);
  opacity:1;
}
.hot.visited::before{
  border-style:solid;
  border-color:rgba(100,140,90,.2);
  opacity:.3;
}
.hot.pulse::before{
  border:1px solid rgba(200,240,160,.85) !important;
  box-shadow:0 0 32px rgba(160,240,120,.3) !important;
  animation:hotPulse 1.6s ease-in-out infinite !important;
  opacity:1 !important;
}
@keyframes hotPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.4}
  50%{transform:translate(-50%,-50%) scale(1.22);opacity:1}
}
.hot .lbl{
  position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);
  font-size:10px;letter-spacing:.35em;color:rgba(160,220,140,.45);
  white-space:nowrap;opacity:0;transition:opacity .3s;
  pointer-events:none;
  font-family:'SF Mono','Consolas',monospace;
  text-shadow:0 0 8px rgba(0,0,0,.8);
}
.hot:hover .lbl{opacity:1;color:rgba(180,240,160,.9)}

/* 物件位置：对准 chair.png 里的实物 */
/* 摇椅 — 画面中央 */
#hChair{left:42%;top:38%;width:18%;height:32%}
/* 左侧柜子/桌子 */
#hCab{left:12%;top:42%;width:16%;height:22%}
/* 右侧床/沙发 */
#hBed{left:70%;top:48%;width:24%;height:30%}
/* 地上杂物 */
#hFloor{left:28%;top:72%;width:28%;height:18%}
/* 左下角物件 */
#hLow{left:6%;top:72%;width:16%;height:18%}
/* 背景深处/门 */
#hDoor{left:55%;top:8%;width:22%;height:28%}
/* 天花板（上沿） */
#hCeil{left:20%;top:0;width:60%;height:10%}
/* 右下床底 */
#hUnder{left:72%;top:72%;width:22%;height:18%}

/* 高亮标记：点过的物件在照片上留一个淡圈 */
.hot.visited::after{
  content:'';position:absolute;left:50%;top:50%;
  width:48px;height:48px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(120,160,100,.15);
  pointer-events:none;
}

/* ===== 旁白（监控字幕风） ===== */
#narr{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:40px 28px 32px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.88) 50%);
  min-height:120px;
  pointer-events:none;
}
#narr .nline{
  max-width:520px;margin:0 auto;
  font-size:14.5px;line-height:2.1;
  color:#b0c4a0;
  min-height:2.2em;
  text-align:center;
  white-space:pre-wrap;
  text-shadow:0 1px 6px rgba(0,0,0,.9), 0 0 20px rgba(0,0,0,.5);
  font-family:'Songti SC','SimSun',serif;
}
#narr .nline.dim{color:#6a8060;font-size:12px;letter-spacing:.15em}
#narr .nline .caret{
  display:inline-block;width:1px;height:1em;background:#a0d080;
  vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

#hint{
  position:fixed;bottom:20px;right:24px;z-index:70;
  font-size:9px;letter-spacing:.25em;color:rgba(140,180,120,.35);
  pointer-events:none;transition:opacity 1s;
  font-family:'SF Mono',monospace;
}

/* ===== 特效 ===== */
#flash{position:fixed;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .1s}
#flash.on{opacity:1}
#staticFx{
  position:fixed;inset:0;z-index:89;opacity:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px;
  mix-blend-mode:screen;
  transition:opacity .08s;
}
#staticFx.on{opacity:.35;animation:staticShift .1s steps(2) infinite}
@keyframes staticShift{0%{background-position:0 0}50%{background-position:128px 64px}100%{background-position:64px 128px}}

#invertFx{position:fixed;inset:0;background:#c0e0b0;z-index:91;opacity:0;pointer-events:none;mix-blend-mode:difference}

#bigWord{
  position:fixed;inset:0;z-index:95;display:flex;
  align-items:center;justify-content:center;
  font-size:clamp(30px,8vw,64px);letter-spacing:.4em;
  color:#c8e8b0;opacity:0;pointer-events:none;
  transition:opacity .08s;
  text-shadow:0 0 40px rgba(0,0,0,.9), 0 0 80px rgba(80,160,60,.2);
}
#bigWord.on{opacity:1}
#bigWord.inv{color:#0a1208;background:#c8e8b0}

#jump{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;background:#000;
}
#jump.on{display:flex}
#jump img{max-width:100%;max-height:100%;object-fit:contain}
#jump.full img{width:100%;height:100%;object-fit:cover}
#jump.inv{filter:invert(1) hue-rotate(90deg)}
#jumpShake{position:fixed;inset:-20px;z-index:99;display:none;pointer-events:none}
#jumpShake.on{display:block;animation:shake .07s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}
  50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,6px)}
  100%{transform:translate(0,0)}
}

#sysNote{
  position:fixed;top:52px;left:20px;z-index:96;
  background:rgba(8,16,6,.88);
  border:1px solid rgba(140,200,120,.3);
  padding:10px 16px;min-width:200px;
  opacity:0;transition:opacity .4s;pointer-events:none;
  font-family:'SF Mono',monospace;
  backdrop-filter:blur(4px);
}
#sysNote.on{opacity:1}
#sysNote .sn-t{font-size:11px;color:#a0d080;letter-spacing:.1em}
#sysNote .sn-s{font-size:10px;color:#6a8060;margin-top:4px}

#voiceTag{
  position:fixed;bottom:48px;right:24px;z-index:70;
  font-size:9px;letter-spacing:.2em;color:rgba(100,140,80,.3);
  pointer-events:none;transition:color .4s,opacity .4s;opacity:0;
  font-family:'SF Mono',monospace;
}
#voiceTag.on{opacity:1;color:rgba(140,200,120,.5)}
#voiceTag.live{color:#c0e0a0}

/* 来电 */
#call{
  position:fixed;inset:0;z-index:110;display:none;
  background:rgba(0,4,0,.96);
  flex-direction:column;align-items:center;justify-content:center;gap:22px;
}
#call.on{display:flex}
#call .cf{font-size:10px;letter-spacing:.5em;color:#5a7050;font-family:'SF Mono',monospace}
#call .cn{
  font-size:clamp(20px,5.5vw,28px);letter-spacing:.15em;color:#c0e0a0;
  animation:cp 1.5s ease infinite;
}
@keyframes cp{0%,100%{opacity:1}50%{opacity:.5}}
#call .cbtns{display:flex;gap:48px;margin-top:28px}
#call button{
  background:none;border:none;
  border-bottom:1px solid rgba(140,200,120,.35);
  color:#a0c080;font-family:inherit;font-size:13px;letter-spacing:.4em;
  padding:12px 8px;cursor:pointer;transition:color .3s,border-color .3s;
}
#call button:hover{color:#c0e0a0;border-bottom-color:#c0e0a0}

/* 结尾 */
#end{
  position:fixed;inset:0;z-index:120;display:none;
  background:#020402;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
}
#end.on{display:flex}
#end .etext{
  font-size:clamp(14px,3.5vw,17px);line-height:2.6;color:#a0b890;
  letter-spacing:.15em;white-space:pre-wrap;min-height:6em;
}
#end .emeta{
  margin-top:40px;font-size:10px;color:#4a5a40;letter-spacing:.25em;
  font-family:'SF Mono',monospace;
}

#presence{
  position:fixed;right:-8%;bottom:-12%;width:42vw;height:82vh;z-index:35;
  background:radial-gradient(ellipse at 40% 80%, rgba(0,0,0,.5) 0%, transparent 70%);
  opacity:0;transition:opacity 3.5s;pointer-events:none;
}
#presence.on{opacity:1}

#typeGhost{
  position:fixed;left:24px;bottom:100px;z-index:65;
  font-size:10px;letter-spacing:.2em;color:rgba(120,160,100,.35);
  opacity:0;transition:opacity .5s;pointer-events:none;
  font-family:'SF Mono',monospace;
}
#typeGhost.on{opacity:1}
#typeGhost .dots::after{content:'…';animation:df 1.2s ease infinite}
@keyframes df{0%,100%{opacity:.2}50%{opacity:1}}

@media (max-width:640px){
  #narr{padding:28px 16px 24px;min-height:100px}
  #narr .nline{font-size:13px;line-height:1.95}
  .hot::before{width:42px;height:42px}
  .hot .lbl{display:none}
  #osd,#osd2{font-size:9px}
  /* 手机上物件位置微调 */
  #hChair{left:38%;width:24%}
  #hCab{left:8%;width:20%}
  #hBed{left:65%;width:30%}
}
</style>
</head>
<body>

<div id="feed">
  <img class="bg" src="resource/haunt/chair.png" alt="" draggable="false">
  <div class="tint"></div>
  <div class="scan"></div>
  <div class="vig"></div>
</div>
<div id="presence"></div>
<div id="dark"></div>
<div id="cursorDot"></div>

<div id="osd"><span class="rec"></span>REC &nbsp; CAM_07 &nbsp; <span id="osdClock">00:00:00</span></div>
<div id="osd2">NIGHT VISION<br>SENS  HIGH<br><span id="osdVis">VISIT 1</span></div>

<div id="narr"><div class="nline" id="nline"></div></div>
<div id="hint">移动 · 点击虚线圈</div>
<div id="typeGhost">CAM_07<span class="dots"></span></div>
<div id="voiceTag">语音 · 待命</div>

<div id="staticFx"></div>
<div id="flash"></div>
<div id="invertFx"></div>
<div id="bigWord"></div>
<div id="jump"><img id="jumpImg" alt=""></div>
<div id="jumpShake"></div>
<div id="sysNote"><div class="sn-t" id="snT"></div><div class="sn-s" id="snS"></div></div>

<div id="call">
  <div class="cf">来电 · 加密线路</div>
  <div class="cn" id="callName">未知号码</div>
  <div class="cbtns">
    <button type="button" id="callAns">接 听</button>
    <button type="button" id="callDec">拒 绝</button>
  </div>
</div>

<div id="end">
  <div class="etext" id="endText"></div>
  <div class="emeta" id="endMeta"></div>
</div>

<!-- 热区定义（绝对定位在照片实物上） -->
<div id="hChair" class="hot" data-id="chair" style="left:42%;top:38%;width:18%;height:32%"><span class="lbl">摇椅</span></div>
<div id="hCab" class="hot" data-id="cab" style="left:12%;top:42%;width:16%;height:22%"><span class="lbl">柜子</span></div>
<div id="hBed" class="hot" data-id="bed" style="left:70%;top:48%;width:24%;height:30%"><span class="lbl">床</span></div>
<div id="hFloor" class="hot" data-id="floor" style="left:28%;top:72%;width:28%;height:18%"><span class="lbl">地上</span></div>
<div id="hLow" class="hot" data-id="low" style="left:6%;top:72%;width:16%;height:18%"><span class="lbl">角落</span></div>
<div id="hDoor" class="hot" data-id="door" style="left:55%;top:8%;width:22%;height:28%"><span class="lbl">深处</span></div>
<div id="hCeil" class="hot" data-id="ceil" style="display:none;left:20%;top:0;width:60%;height:10%"><span class="lbl">上沿</span></div>
<div id="hUnder" class="hot" data-id="under" style="display:none;left:72%;top:72%;width:22%;height:18%"><span class="lbl">床底</span></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var nline = $('nline');
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  /* ---------- 状态 ---------- */
  var S = {
    name: '',
    visits: 0,
    done: {},
    started: false,
    ending: false,
    callSeen: false,
    facts: [],
    startedAt: 0
  };
  try {
    S.visits = parseInt(localStorage.getItem('haunt_v') || '0', 10) + 1;
    localStorage.setItem('haunt_v', String(S.visits));
  } catch (e) {}
  $('osdVis').textContent = 'VISIT ' + S.visits;

  try {
    var city = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop();
    if (city) S.facts.push(city);
  } catch (e) {}
  if (screen.width) S.facts.push(screen.width + '×' + screen.height);
  try { if (navigator.language) S.facts.push(navigator.language); } catch (e) {}

  /* 时钟 OSD */
  var t0 = Date.now();
  setInterval(function () {
    var s = Math.floor((Date.now() - t0) / 1000);
    var hh = String(Math.floor(s / 3600)).padStart(2, '0');
    var mm = String(Math.floor(s / 60) % 60).padStart(2, '0');
    var ss = String(s % 60).padStart(2, '0');
    var el = $('osdClock');
    if (el) el.textContent = hh + ':' + mm + ':' + ss;
  }, 1000);

  /* ---------- 工具 ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var typeToken = 0;
  function say(text, opts) {
    opts = opts || {};
    var token = ++typeToken;
    nline.classList.toggle('dim', !!opts.dim);
    nline.innerHTML = '';
    var span = document.createElement('span');
    var caret = document.createElement('span');
    caret.className = 'caret';
    nline.appendChild(span);
    nline.appendChild(caret);
    if (opts.instant) {
      span.textContent = text;
      return sleep(opts.hold || 1200);
    }
    var speed = opts.speed || 68;
    var i = 0;
    return new Promise(function (resolve) {
      function step() {
        if (token !== typeToken) { resolve(); return; }
        if (i >= text.length) {
          setTimeout(resolve, opts.hold || 1000);
          return;
        }
        span.textContent += text[i++];
        var d = speed;
        if (Math.random() < 0.06) d += 140 + Math.random() * 280;
        if (text[i - 1] === '。' || text[i - 1] === '？') d += 260;
        setTimeout(step, d);
      }
      step();
    });
  }

  function flash(ms) {
    var f = $('flash');
    f.classList.add('on');
    setTimeout(function () { f.classList.remove('on'); }, ms || 180);
  }

  function staticBurst(ms) {
    var el = $('staticFx');
    el.classList.add('on');
    setTimeout(function () { el.classList.remove('on'); }, ms || 350);
  }

  function invertPulse(n, gap) {
    var el = $('invertFx');
    var i = 0;
    var id = setInterval(function () {
      el.style.opacity = (i % 2 === 0) ? '1' : '0';
      i++;
      if (i >= (n || 4) * 2) {
        clearInterval(id);
        el.style.opacity = '0';
      }
    }, gap || 90);
  }

  function bigWord(word, ms, invert) {
    var b = $('bigWord');
    b.textContent = word;
    b.classList.toggle('inv', !!invert);
    b.classList.add('on');
    scream(ms || 700, 0.4);
    setTimeout(function () { b.classList.remove('on', 'inv'); }, ms || 700);
  }

  function faceJump(src, opts) {
    opts = opts || {};
    var j = $('jump');
    var img = $('jumpImg');
    var sh = $('jumpShake');
    img.src = src;
    j.classList.toggle('full', !!opts.full);
    j.classList.add('on');
    if (opts.shake !== false) sh.classList.add('on');
    scream(opts.ms || 900, opts.vol || 0.5);
    if (opts.invert) {
      j.classList.add('inv');
      setTimeout(function () { j.classList.remove('inv'); }, 100);
      setTimeout(function () { j.classList.add('inv'); }, 250);
      setTimeout(function () { j.classList.remove('inv'); }, 360);
    }
    setTimeout(function () {
      j.classList.remove('on', 'full', 'inv');
      sh.classList.remove('on');
    }, opts.hold || 1000);
  }

  function sysNote(t, s, ms) {
    $('snT').textContent = t;
    $('snS').textContent = s || '';
    $('sysNote').classList.add('on');
    setTimeout(function () { $('sysNote').classList.remove('on'); }, ms || 2600);
  }

  function titleGlitch(bad, good, times) {
    var n = 0;
    var id = setInterval(function () {
      document.title = (n % 2 === 0) ? bad : good;
      n++;
      if (n >= (times || 6) * 2) {
        clearInterval(id);
        document.title = good;
      }
    }, 90);
  }

  function presence(on) { $('presence').classList.toggle('on', !!on); }

  function typeGhost(ms) {
    var t = $('typeGhost');
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, ms || 2400);
  }

  function pulseHot(id, on) {
    var el = $(id);
    if (el) el.classList.toggle('pulse', !!on);
  }

  function markVisited(id) {
    S.done[id] = (S.done[id] || 0) + 1;
    var el = $(id);
    if (el) el.classList.add('visited');
  }

  /* ---------- 音频 ---------- */
  var actx = null, droneOsc = null, droneGain = null, lfoOsc = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function startDrone() {
    if (!actx) return;
    try {
      droneGain = actx.createGain();
      droneGain.gain.value = 0;
      droneGain.connect(actx.destination);
      droneOsc = actx.createOscillator();
      droneOsc.type = 'sine';
      droneOsc.frequency.value = 46;
      lfoOsc = actx.createOscillator();
      lfoOsc.frequency.value = 0.09;
      var lg = actx.createGain();
      lg.gain.value = 2.5;
      lfoOsc.connect(lg);
      lg.connect(droneOsc.frequency);
      droneOsc.connect(droneGain);
      droneOsc.start();
      lfoOsc.start();
      droneGain.gain.linearRampToValueAtTime(0.05, actx.currentTime + 5);
    } catch (e) {}
  }
  function swellDrone(to, sec) {
    if (!actx || !droneGain) return;
    try {
      droneGain.gain.linearRampToValueAtTime(to, actx.currentTime + (sec || 2));
    } catch (e) {}
  }
  function stopDrone() {
    try { if (droneOsc) droneOsc.stop(); if (lfoOsc) lfoOsc.stop(); } catch (e) {}
  }
  function whisperPan(pan) {
    if (!actx) return;
    try {
      var p = actx.createStereoPanner ? actx.createStereoPanner() : null;
      if (!p) return;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = 150 + Math.random() * 90;
      g.gain.value = 0;
      o.connect(g); g.connect(p); p.connect(actx.destination);
      p.pan.value = pan;
      o.start();
      g.gain.linearRampToValueAtTime(0.04, actx.currentTime + 0.35);
      g.gain.linearRampToValueAtTime(0, actx.currentTime + 2.0);
      setTimeout(function () { o.stop(); }, 2200);
    } catch (e) {}
  }
  function scream(ms, vol) {
    if (!actx) return;
    try {
      var len = Math.floor(actx.sampleRate * (ms / 1000));
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.7 + Math.sin(i * 0.13) * 0.4;
        var t = i / len;
        data[i] *= Math.exp(-t * 5.5) * (t < 0.02 ? t / 0.02 : 1);
      }
      var src = actx.createBufferSource();
      src.buffer = buf;
      var g = actx.createGain();
      g.gain.value = vol || 0.45;
      var f = actx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 360;
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start();
    } catch (e) {}
  }
  function thud() {
    if (!actx) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(100, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(26, actx.currentTime + 0.5);
      g.gain.setValueAtTime(0.4, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.65);
    } catch (e) {}
  }
  function vSay(text, pitch, rate) {
    if (!('speechSynthesis' in window)) return;
    try {
      var tag = $('voiceTag');
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = rate || 0.8;
      u.pitch = pitch || 0.5;
      if (tag) {
        tag.textContent = '语音 · 说话中';
        tag.classList.add('on', 'live');
        u.onend = function () {
          tag.textContent = '语音 · 待命';
          tag.classList.remove('live');
          setTimeout(function () { tag.classList.remove('on'); }, 2000);
        };
      }
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- 光标 ---------- */
  var mx = window.innerWidth / 2, my = window.innerHeight / 2;
  var dot = $('cursorDot');
  function onMove(x, y) {
    mx = x; my = y;
    document.documentElement.style.setProperty('--mx', x + 'px');
    document.documentElement.style.setProperty('--my', y + 'px');
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
  }
  window.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  /* ---------- 物件 ---------- */
  var CORE = ['chair', 'cab', 'bed', 'floor', 'low', 'door'];
  var LATE = ['ceil', 'under'];

  function refreshPulse() {
    if (S.ending) return;
    var coreDone = CORE.filter(function (id) { return S.done[id]; }).length;
    var target = null;
    if (coreDone < CORE.length) {
      for (var i = 0; i < CORE.length; i++) {
        if (!S.done[CORE[i]]) { target = CORE[i]; break; }
      }
    } else if (!S.done.ceil) {
      $('hCeil').style.display = '';
      target = 'ceil';
    } else if (!S.done.under) {
      $('hUnder').style.display = '';
      target = 'under';
    } else {
      startEnding();
      return;
    }
    CORE.concat(LATE).forEach(function (id) {
      pulseHot('h' + id.charAt(0).toUpperCase() + id.slice(1), false);
    });
    if (target) {
      pulseHot('h' + target.charAt(0).toUpperCase() + target.slice(1), true);
    }
  }

  var script = {};

  script.floor = function (n) {

  script.low = function (n) {

        staticBurst(500);
        invertPulse(3, 70);

  script.door = function (n) {

  script.ceil = function (n) {
    return (async function () {
      staticBurst(300);
      await say('上沿有一块污渍。', { speed: 52 });
      await sleep(1000);
      await say('不是漏水。', { speed: 48, hold: 1400 });

      if (n >= 2) {
        flash(200);
        bigWord('在上面', 700, true);

  script.under = function (n) {
    return (async function () {
      await say('床底。', { speed: 52 });
      await say('别看。', { speed: 48, hold: 1000 });
      await say('……你看了。', { speed: 46, hold: 800 });
      staticBurst(200);
      flash(150);
      scream(450, 0.4);
      await sleep(700);
      if (n === 1) {
        await say('什么都没有。', { speed: 50, hold: 1200 });
        await say('刚才那两下红点，', { dim: true, speed: 48 });
        await say('是摄像头的补光。', { speed: 46, hold: 1600 });
      } else {
        invertPulse(3, 70);
        faceJump('resource/haunt/photo.png', { ms: 900, hold: 850, vol: 0.55 });

  function onHot(id) {
    var n = (S.done[id] || 0) + 1;
    markVisited(id);
    refreshPulse();
    if (script[id]) {
      script[id](n).then(function () {
        if (n === 2) typeGhost(2000);
        if (n >= 3) presence(true);
        refreshPulse();
      });
    } else {
      refreshPulse();
    }
  }

  /* ---------- 假来电 ---------- */
  function triggerCall() {
    return new Promise(function (resolve) {
      S.callSeen = true;
      var el = $('call');
      var tail = ('0000' + (S.visits * 7919 % 10000)).slice(-4);
      $('callName').textContent = '未知 ····' + tail;
      el.classList.add('on');
      document.title = '来电';
      playRing();
      if (navigator.vibrate) { try { navigator.vibrate([300, 200, 300, 200, 300]); } catch (e) {} }
      $('callAns').onclick = function () {
        el.classList.remove('on');
        document.title = '通话中';
        liveCall().then(resolve);
      };
      $('callDec').onclick = function () {
        el.classList.remove('on');
        document.title = '未接来电 (1)';
        resolve();
      };
    });
  }
  function playRing() {
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      g.gain.value = 0;
      for (var k = 0; k < 3; k++) {
        var t0 = t + k * 1.5;
        o.frequency.setValueAtTime(440, t0);
        o.frequency.setValueAtTime(480, t0 + 0.32);
        g.gain.linearRampToValueAtTime(0.055, t0 + 0.04);
        g.gain.setValueAtTime(0.055, t0 + 0.6);
        g.gain.linearRampToValueAtTime(0, t0 + 0.85);
      }
      o.start(t); o.stop(t + 4.5);
    } catch (e) {}
  }
  async function liveCall() {
    var lines = [
      [1.0, '……喂？'],
      [3.2, '别挂。'],
      [5.5, '我不是打错的。'],
      [8.5, '那把摇椅——'],
      [11.5, '我上一次也看着它。'],
      [15.0, '现在我在镜头外面。'],
      [18.5, '通话结束前，别移开视线。'],
      [22.0, '……到了。']
    ];
    whisperPan(0);
    for (var i = 0; i < lines.length; i++) {
      var wait = i === 0 ? lines[i][0] * 1000 : (lines[i][0] - lines[i - 1][0]) * 1000;
      await sleep(wait);
      bigWord(lines[i][1], Math.min(1400, wait + 400), false);
    }
    document.title = '夜间独处习惯调查';
    flash(400);
    presence(true);
  }

  /* ---------- 开场 ---------- */
  async function boot() {
    /* 绑定热区 */
    document.querySelectorAll('.hot').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!S.started || S.ending) return;
        onHot(el.getAttribute('data-id'));
      });
    });

    S.startedAt = Date.now();
    nline.innerHTML = '';
    var bootEl = document.createElement('span');
    bootEl.style.cssText = 'font-size:11px;letter-spacing:.2em;color:rgba(140,180,120,.45);display:block;margin-bottom:14px;font-family:SF Mono,monospace';
    nline.appendChild(bootEl);
    var car0 = document.createElement('span');
    car0.className = 'caret';
    nline.appendChild(car0);
    var lines = [
      'CAM_07 上线……',
      '红外补光 …… 高',
      '检测独处 …… 是',
      '回放缓冲 …… 71%'
    ];
    for (var i = 0; i < lines.length; i++) {
      for (var c = 0; c <= lines[i].length; c++) {
        bootEl.textContent = lines[i].slice(0, c);
        await sleep(20 + Math.random() * 32);
      }
      await sleep(i === 3 ? 600 : 180);
    }
    bootEl.textContent = '回放缓冲 …… 100%';
    staticBurst(280);
    await sleep(400);

    nline.innerHTML = '';
    var h = new Date().getHours();
    var late = (h >= 23 || h < 5);
    await say(late ? '这是你房间的实时画面。' : '你调出了这个房间的监控。', { speed: 72, hold: 900 });
    await say('CAM_07，红外模式。', { speed: 58, hold: 700 });
    await say('画面里那把椅子，', { speed: 55 });
    await say('不一直是空的。', { speed: 50, hold: 1600 });
    await say('点虚线圈，靠近看。', { dim: true, speed: 48, hold: 600 });

    if (S.facts.length) {
      await say('（终端 ' + S.facts[0] + ' 已识别）', { dim: true, speed: 38, hold: 1200 });
    }
    if (S.visits >= 2) {
      staticBurst(200);
      await say('这是你第 ' + S.visits + ' 次调阅。', { dim: true, speed: 52, hold: 1400 });
    }

    $('hint').textContent = '移动 · 点击虚线圈';
    setTimeout(function () { $('hint').style.opacity = '0'; }, 8000);

    initAudio();
    startDrone();
    S.started = true;
    refreshPulse();
  }

  /* ---------- 终局 ---------- */
  async function startEnding() {
    if (S.ending) return;
    S.ending = true;
    document.body.classList.add('wide');
    swellDrone(0.14, 3);
    presence(true);

    await say('你都看过了。', { speed: 68, hold: 1400 });
    await say('房间还是这个房间。', { speed: 58, hold: 1000 });
    await say('变的是录像里的人数。', { speed: 52, hold: 1800 });

    staticBurst(400);
    flash(300);
    await sleep(500);

    /* 全场景亮灯 */
    $('hCeil').style.display = '';
    $('hCeil').classList.add('wet');
    $('hUnder').style.display = '';
    $('hUnder').classList.add('peek');
    document.querySelectorAll('.hot').forEach(function (el) { el.classList.add('visited'); });

    await sleep(1000);
    bigWord('画面里多了一个人', 900, true);
    thud();
    invertPulse(3, 100);
    await sleep(700);

    faceJump('resource/haunt/chair.png', { full: true, ms: 800, hold: 700, vol: 0.55 });
    await sleep(350);
    faceJump('resource/haunt/portrait.png', { full: true, ms: 800, hold: 700, vol: 0.6, invert: true });
    await sleep(350);
    faceJump('resource/haunt/photo.png', { full: true, ms: 900, hold: 800, vol: 0.65 });
    thud();

    await sleep(500);
    stopDrone();
    await say('录制结束。', { speed: 80, hold: 1800 });
    await say('你可以关掉播放器了。', { speed: 72, hold: 1800 });
    await say('它说，', { speed: 68, hold: 1100 });
    vSay('它跟你一起走', 0.3, 0.55);
    await say('它跟你一起走。', { speed: 48, hold: 2400 });

    flash(500);
    await sleep(700);

    await triggerCall();

    var end = $('end');
    var et = $('endText');
    end.classList.add('on');
    et.textContent = '';
    var msg = '录像已存档。\n但缓存里留了一段循环。\n\n下次你打开任何摄像头，\n它都会先入画。';
    for (var i = 0; i < msg.length; i++) {
      et.textContent += msg[i];
      await sleep(68);
    }
    $('endMeta').textContent = 'SUBJECT #' + (5 + S.visits) + ' · LOGGED';
    titleGlitch('别关', '夜间独处习惯调查', 3);

    setTimeout(function () {
      faceJump('resource/haunt/photo.png', { ms: 400, hold: 350, vol: 0.25, shake: false });
    }, 10000);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.started && !S.ending) {
      say('Esc 退出不了播放。', { dim: true, speed: 48, hold: 1400 });
    }
  });

  boot();
})();
