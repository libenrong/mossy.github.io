<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>夜间独处习惯调查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:#04050a;
  color:#c8ced8;
  font-family:'Songti SC','SimSun','Noto Serif SC','Microsoft YaHei',serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:.06em;
  cursor:none;
  user-select:none;
  -webkit-user-select:none;
}
body.touch{cursor:auto}

/* ===== 手电筒 ===== */
#dark{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(circle 140px at var(--mx,50%) var(--my,50%),
    transparent 0%, transparent 35%, rgba(0,0,0,.88) 70%, rgba(0,0,0,.97) 100%);
  transition:background .05s linear;
}
body.wide #dark{
  background:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),
    transparent 0%, transparent 40%, rgba(0,0,0,.7) 72%, rgba(0,0,0,.92) 100%);
}
#cursorDot{
  position:fixed;z-index:50;width:6px;height:6px;border-radius:50%;
  background:rgba(200,210,220,.5);pointer-events:none;
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}

/* ===== 房间 ===== */
#room{
  position:fixed;inset:0;z-index:10;
  /* 夜里的房间：墙、地板、家具用 div 拼 */
  background:
    /* 地板 */
    linear-gradient(180deg, transparent 0 68%, #0a0c12 68% 100%),
    /* 墙 */
    linear-gradient(180deg, #0c0e14 0%, #0e1018 68%, transparent 68%);
}
#room.tilt{transform:rotate(.4deg) scale(1.01)}

.hot{
  position:absolute;z-index:12;
  border:1px solid transparent;
  transition:border-color .3s, background .3s, box-shadow .3s;
  cursor:none;
}
.hot:hover{
  border-color:rgba(180,190,210,.35);
  background:rgba(180,190,210,.03);
  box-shadow:0 0 30px rgba(180,190,210,.06);
}
.hot.visited{border-color:rgba(100,110,130,.15)}
.hot.pulse{
  animation:hotPulse 1.6s ease-in-out infinite;
  border-color:rgba(196,92,92,.55) !important;
  box-shadow:0 0 40px rgba(196,92,92,.15) !important;
}
@keyframes hotPulse{0%,100%{opacity:.5}50%{opacity:1}}
.hot .lbl{
  position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);
  font-size:10px;letter-spacing:.25em;color:#5a6070;
  white-space:nowrap;opacity:0;transition:opacity .25s;
  pointer-events:none;
}
.hot:hover .lbl{opacity:1}

/* 窗 */
#hWindow{left:8%;top:12%;width:22%;height:42%}
#hWindow .pane{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0a1520 0%,#0d1a28 60%,#122030 100%);
  border:1px solid #1a2535;
}
#hWindow .pane::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 48%,#1a2535 48% 52%,transparent 52%),
    linear-gradient(0deg,transparent 48%,#1a2535 48% 52%,transparent 52%);
}
#hWindow .curtain{
  position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(90deg,#12141c,#1a1d28);
  z-index:2;transition:transform 1.2s ease;
}
#hWindow .curtain.l{left:0}
#hWindow .curtain.r{right:0}
#hWindow.open .curtain.l{transform:translateX(-85%)}
#hWindow.open .curtain.r{transform:translateX(85%)}
#hWindow .figure{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  width:40px;height:90px;
  background:radial-gradient(ellipse at 50% 20%, #1a1e28 0 30%, transparent 70%),
             linear-gradient(180deg,#151820 0%,#0a0c12 100%);
  border-radius:20px 20px 4px 4px;
  opacity:0;transition:opacity 2s;
  z-index:1;
}
#hWindow.figure .figure{opacity:1}

/* 门 */
#hDoor{right:6%;top:10%;width:14%;height:58%}
#hDoor .slab{
  position:absolute;inset:0;
  background:linear-gradient(90deg,#12141c,#181c26 40%,#141820);
  border:1px solid #1e2430;
}
#hDoor .knob{
  position:absolute;right:12%;top:48%;width:8px;height:8px;border-radius:50%;
  background:#3a4050;
}
#hDoor .under{
  position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:#000;opacity:0;transition:opacity 1s;
}
#hDoor.wrong .under{opacity:1}
#hDoor .crack{
  position:absolute;inset:0;background:#000;
  transform-origin:left center;transform:scaleX(0);
  transition:transform 2s ease;opacity:.9;
}
#hDoor.openish .crack{transform:scaleX(.12)}

/* 椅子（屏幕后方，画面底部中央偏右） */
#hChair{left:58%;bottom:18%;width:16%;height:28%}
#hChair .seat{
  position:absolute;left:10%;right:10%;bottom:20%;height:18%;
  background:#141820;border:1px solid #1e2430;
}
#hChair .back{
  position:absolute;left:20%;right:20%;bottom:38%;height:50%;
  background:linear-gradient(180deg,#181c26,#12141c);
  border:1px solid #1e2430;border-bottom:none;
}
#hChair .shadow{
  position:absolute;inset:10% 5% 0;
  background:radial-gradient(ellipse at 50% 80%, rgba(0,0,0,.6), transparent 70%);
  opacity:0;transition:opacity 1.5s;
}
#hChair.occupied .shadow{opacity:1}

/* 手机（桌上） */
#hPhone{left:30%;bottom:28%;width:10%;height:14%}
#hPhone .body{
  position:absolute;inset:0;border-radius:4px;
  background:#0e1018;border:1px solid #2a3040;
}
#hPhone .scr{
  position:absolute;inset:8% 10%;
  background:#0a0c12;transition:background .4s;
}
#hPhone.lit .scr{
  background:linear-gradient(180deg,#1a3040,#0e1820);
  box-shadow:0 0 20px rgba(80,140,180,.2);
}
#hPhone .glow{
  position:absolute;inset:-20%;border-radius:8px;
  background:radial-gradient(circle, rgba(100,160,200,.25), transparent 70%);
  opacity:0;transition:opacity .5s;
}
#hPhone.lit .glow{opacity:1}

/* 屏幕（中央一块，元恐怖） */
#hScreen{left:36%;top:28%;width:28%;height:30%}
#hScreen .frame{
  position:absolute;inset:0;
  border:1px solid #2a3040;
  background:linear-gradient(180deg,#0e1218,#0a0e14);
}
#hScreen .inner{
  position:absolute;inset:6%;
  background:#05060a;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:.3em;color:#3a4050;
  overflow:hidden;
}
#hScreen .inner .msg{opacity:.6;transition:opacity .5s,color .5s}
#hScreen.watching .inner .msg{color:#c45c5c;opacity:1}

/* 镜子 */
#hMirror{left:12%;top:14%;width:14%;height:36%}
#hMirror .glass{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#141820 0%,#1a2030 50%,#12161e 100%);
  border:6px solid #1a1e28;
}
#hMirror .ref{
  position:absolute;inset:6px;
  background:linear-gradient(160deg,#0e1218,#121820);
  opacity:0;transition:opacity 1.5s;
  display:flex;align-items:flex-end;justify-content:center;
}
#hMirror .ref .head{
  width:36px;height:44px;border-radius:50% 50% 40% 40%;
  background:radial-gradient(ellipse at 50% 35%, #1e2430, #0e1016 80%);
  margin-bottom:8%;
}
#hMirror.showref .ref{opacity:1}
#hMirror.blink .ref .head{animation:refBlink 3s ease infinite}
@keyframes refBlink{0%,90%,100%{opacity:1}94%{opacity:0}}

/* 相框 */
#hPhoto{left:48%;top:16%;width:10%;height:18%}
#hPhoto .pf{
  position:absolute;inset:0;
  border:4px solid #2a2418;
  background:#0e0c08;
  overflow:hidden;
}
#hPhoto .pf img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(.4) brightness(.7);
  opacity:.85;transition:opacity .6s, filter .6s;
}
#hPhoto.wrong .pf img{filter:grayscale(0) brightness(.9) contrast(1.1)}
#hPhoto .stamp{
  position:absolute;right:2px;bottom:2px;
  font-size:8px;color:#6a5040;letter-spacing:.1em;
}

/* 床 */
#hBed{left:6%;bottom:14%;width:22%;height:22%}
#hBed .matt{
  position:absolute;left:0;right:0;bottom:0;height:55%;
  background:linear-gradient(180deg,#141820,#10131a);
  border:1px solid #1a2030;
}
#hBed .pill{
  position:absolute;left:8%;top:10%;width:28%;height:40%;
  background:#181c26;border-radius:8px;
}
#hBed .dip{
  position:absolute;left:35%;top:20%;width:40%;height:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.5), transparent 70%);
  opacity:0;transition:opacity 1.2s;
}
#hBed.slept .dip{opacity:1}

/* 天花板（后期才出现） */
#hCeil{left:20%;top:2%;width:60%;height:12%}
#hCeil .stain{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(60,20,20,.3), transparent 70%);
  opacity:0;transition:opacity 2s;
}
#hCeil.wet .stain{opacity:1}

/* 桌下 */
#hUnder{left:28%;bottom:6%;width:30%;height:16%}
#hUnder .darkbox{
  position:absolute;inset:0;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.6) 40%, #000);
}
#hUnder .eyes{
  position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  display:flex;gap:14px;opacity:0;transition:opacity .3s;
}
#hUnder .eyes i{
  width:5px;height:5px;border-radius:50%;
  background:#c45c5c;box-shadow:0 0 8px #c45c5c;
}
#hUnder.peek .eyes{opacity:1}

/* ===== 旁白 ===== */
#narr{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:28px 32px 32px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.85) 40%);
  min-height:120px;
  pointer-events:none;
}
#narr .nline{
  max-width:640px;margin:0 auto;
  font-size:16px;line-height:2;
  color:#d0d5de;
  min-height:2.2em;
  text-align:center;
  white-space:pre-wrap;
}
#narr .nline.dim{color:#7a8290;font-size:13px}
#narr .nline .caret{
  display:inline-block;width:1px;height:1em;background:#c45c5c;
  vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

/* 进度：右上极淡 */
#prog{
  position:fixed;top:20px;right:24px;z-index:70;
  font-size:10px;letter-spacing:.3em;color:#3a4050;
  pointer-events:none;
}

/* 提示 */
#hint{
  position:fixed;top:20px;left:24px;z-index:70;
  font-size:10px;letter-spacing:.25em;color:#3a4050;
  pointer-events:none;transition:opacity .6s;
}

/* ===== 特效层 ===== */
#flash{position:fixed;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .15s}
#flash.on{opacity:1}
#invertFx{position:fixed;inset:0;background:#fff;z-index:91;opacity:0;pointer-events:none;mix-blend-mode:difference}

#bigWord{
  position:fixed;inset:0;z-index:95;display:flex;
  align-items:center;justify-content:center;
  font-size:clamp(40px,12vw,100px);letter-spacing:.2em;
  color:#e8ecf2;opacity:0;pointer-events:none;
  transition:opacity .1s;
  text-shadow:0 0 40px rgba(0,0,0,.9);
}
#bigWord.on{opacity:1}
#bigWord.inv{color:#0a0c10;background:#e8ecf2}

#jump{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;background:#000;
}
#jump.on{display:flex}
#jump img{max-width:100%;max-height:100%;object-fit:contain}
#jump.full img{width:100%;height:100%;object-fit:cover}
#jump.inv{filter:invert(1)}
#jumpShake{
  position:fixed;inset:-20px;z-index:99;display:none;pointer-events:none;
}
#jumpShake.on{display:block;animation:shake .08s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-8px,4px)}
  50%{transform:translate(6px,-6px)}75%{transform:translate(-4px,8px)}
  100%{transform:translate(0,0)}
}

#sysNote{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:96;background:rgba(20,22,30,.95);
  border:1px solid #2a3040;border-radius:10px;
  padding:12px 20px;min-width:260px;
  opacity:0;transition:opacity .4s;pointer-events:none;
}
#sysNote.on{opacity:1}
#sysNote .sn-t{font-size:12px;color:#c8ced8;letter-spacing:.1em}
#sysNote .sn-s{font-size:11px;color:#7a8290;margin-top:4px}

#voiceTag{
  position:fixed;bottom:20px;right:24px;z-index:70;
  font-size:9px;letter-spacing:.2em;color:#2a2e38;
  pointer-events:none;transition:color .4s, opacity .4s;opacity:0;
}
#voiceTag.on{opacity:1;color:#5a6070}
#voiceTag.live{color:#c45c5c}

/* 来电 */
#call{
  position:fixed;inset:0;z-index:110;display:none;
  background:rgba(4,5,10,.97);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#call.on{display:flex}
#call .cf{font-size:11px;letter-spacing:.4em;color:#5a6070}
#call .cn{font-size:clamp(22px,6vw,30px);letter-spacing:.1em;color:#e8ecf2;animation:cp 1.5s ease infinite}
@keyframes cp{0%,100%{opacity:1}50%{opacity:.6}}
#call .cbtns{display:flex;gap:40px;margin-top:24px}
#call button{
  background:none;border:none;border-bottom:1px solid #3a4050;
  color:#a8b0bc;font-family:inherit;font-size:13px;letter-spacing:.3em;
  padding:12px 8px;cursor:pointer;
}
#call button:hover{color:#c45c5c;border-bottom-color:#c45c5c}

/* 结尾屏 */
#end{
  position:fixed;inset:0;z-index:120;display:none;
  background:#020304;
  flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;
}
#end.on{display:flex}
#end .etext{
  font-size:clamp(16px,4vw,20px);line-height:2.4;color:#c8ced8;
  letter-spacing:.12em;white-space:pre-wrap;min-height:6em;
}
#end .emeta{margin-top:36px;font-size:11px;color:#4a5060;letter-spacing:.2em}

#presence{
  position:fixed;right:-6%;bottom:-10%;width:40vw;height:80vh;z-index:35;
  background:radial-gradient(ellipse at 40% 80%, rgba(0,0,0,.55) 0%, transparent 70%);
  opacity:0;transition:opacity 3s;pointer-events:none;
}
#presence.on{opacity:1}

#typeGhost{
  position:fixed;left:28px;bottom:100px;z-index:65;
  font-size:11px;letter-spacing:.2em;color:#4a5060;
  opacity:0;transition:opacity .5s;pointer-events:none;
}
#typeGhost.on{opacity:1}
#typeGhost .dots::after{content:'…';animation:df 1.2s ease infinite}
@keyframes df{0%,100%{opacity:.2}50%{opacity:1}}

@media (max-width:640px){
  #narr{padding:20px 16px 24px;min-height:100px}
  #narr .nline{font-size:14px;line-height:1.9}
  #hWindow{left:4%;top:10%;width:28%;height:38%}
  #hDoor{right:3%;width:18%}
  #hMirror{display:none}
  #hPhoto{left:42%;width:16%;height:16%}
  #hScreen{left:20%;width:60%;top:26%}
  .hot .lbl{display:none}
}
</style>
</head>
<body>

<div id="room"></div>
<div id="presence"></div>
<div id="dark"></div>
<div id="cursorDot"></div>

<div id="narr"><div class="nline" id="nline"></div></div>
<div id="prog"></div>
<div id="hint">移动光标 · 点击发光的物件</div>
<div id="typeGhost">受试者 B<span class="dots"></span></div>
<div id="voiceTag">语音 · 待命</div>

<div id="flash"></div>
<div id="invertFx"></div>
<div id="bigWord"></div>
<div id="jump"><img id="jumpImg" alt=""></div>
<div id="jumpShake"></div>
<div id="sysNote"><div class="sn-t" id="snT"></div><div class="sn-s" id="snS"></div></div>

<div id="call">
  <div class="cf">来电</div>
  <div class="cn" id="callName">未知号码</div>
  <div class="cbtns">
    <button type="button" id="callAns">接 听</button>
    <button type="button" id="callDec">拒 绝</button>
  </div>
</div>

<div id="end">
  <div class="etext" id="endText"></div>
  <div class="emeta" id="endMeta"></div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var room = $('room');
  var nline = $('nline');
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  /* ---------- 状态 ---------- */
  var S = {
    name: '',
    visits: 0,
    done: {},          /* 物件 → 访问次数 */
    order: [],         /* 点击顺序 */
    started: false,
    ending: false,
    callSeen: false,
    presenceOn: false,
    startedAt: 0,
    facts: []
  };

  try {
    S.visits = parseInt(localStorage.getItem('haunt_v') || '0', 10) + 1;
    localStorage.setItem('haunt_v', String(S.visits));
  } catch (e) {}

  /* 真实浏览器事实 */
  try {
    var city = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop();
    if (city) S.facts.push(city);
  } catch (e) {}
  if (screen.width) S.facts.push(screen.width + '×' + screen.height);
  try { if (navigator.language) S.facts.push(navigator.language); } catch (e) {}

  /* ---------- 工具 ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var typeToken = 0;
  function say(text, opts) {
    opts = opts || {};
    var token = ++typeToken;
    nline.classList.toggle('dim', !!opts.dim);
    nline.innerHTML = '';
    var span = document.createElement('span');
    var caret = document.createElement('span');
    caret.className = 'caret';
    nline.appendChild(span);
    nline.appendChild(caret);

    if (opts.instant) {
      span.textContent = text;
      return sleep(opts.hold || 1200);
    }
    var speed = opts.speed || 70;
    var i = 0;
    return new Promise(function (resolve) {
      function step() {
        if (token !== typeToken) { resolve(); return; }
        if (i >= text.length) {
          setTimeout(resolve, opts.hold || 1000);
          return;
        }
        span.textContent += text[i++];
        var d = speed;
        if (Math.random() < 0.06) d += 150 + Math.random() * 300;
        if (text[i - 1] === '。' || text[i - 1] === '？') d += 280;
        setTimeout(step, d);
      }
      step();
    });
  }

  function flash(ms) {
    var f = $('flash');
    f.classList.add('on');
    setTimeout(function () { f.classList.remove('on'); }, ms || 200);
  }

  function invertPulse(n, gap) {
    var el = $('invertFx');
    var i = 0;
    var id = setInterval(function () {
      el.style.opacity = (i % 2 === 0) ? '1' : '0';
      i++;
      if (i >= (n || 4) * 2) {
        clearInterval(id);
        el.style.opacity = '0';
      }
    }, gap || 90);
  }

  function bigWord(word, ms, invert) {
    var b = $('bigWord');
    b.textContent = word;
    b.classList.toggle('inv', !!invert);
    b.classList.add('on');
    scream(ms || 700, 0.45);
    setTimeout(function () { b.classList.remove('on', 'inv'); }, ms || 700);
  }

  function faceJump(src, opts) {
    opts = opts || {};
    var j = $('jump');
    var img = $('jumpImg');
    var sh = $('jumpShake');
    img.src = src;
    j.classList.toggle('full', !!opts.full);
    j.classList.add('on');
    if (opts.shake !== false) sh.classList.add('on');
    scream(opts.ms || 900, opts.vol || 0.55);
    if (opts.invert) {
      j.classList.add('inv');
      setTimeout(function () { j.classList.remove('inv'); }, 110);
      setTimeout(function () { j.classList.add('inv'); }, 260);
      setTimeout(function () { j.classList.remove('inv'); }, 380);
    }
    setTimeout(function () {
      j.classList.remove('on', 'full', 'inv');
      sh.classList.remove('on');
      if (opts.after) opts.after();
    }, opts.hold || 1000);
  }

  function sysNote(t, s, ms) {
    $('snT').textContent = t;
    $('snS').textContent = s || '';
    $('sysNote').classList.add('on');
    setTimeout(function () { $('sysNote').classList.remove('on'); }, ms || 2600);
  }

  function titleGlitch(bad, good, times) {
    var n = 0;
    var id = setInterval(function () {
      document.title = (n % 2 === 0) ? bad : good;
      n++;
      if (n >= (times || 6) * 2) {
        clearInterval(id);
        document.title = good;
      }
    }, 90);
  }

  function presence(on) {
    S.presenceOn = !!on;
    $('presence').classList.toggle('on', !!on);
  }

  function typeGhost(ms) {
    var t = $('typeGhost');
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, ms || 2400);
  }

  function pulseHot(id, on) {
    var el = $(id);
    if (el) el.classList.toggle('pulse', !!on);
  }

  function markVisited(id) {
    S.done[id] = (S.done[id] || 0) + 1;
    S.order.push(id);
    var el = $(id);

  /* ---------- 音频 ---------- */
  var actx = null, droneOsc = null, droneGain = null, lfoOsc = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function startDrone() {
    if (!actx) return;
    try {
      droneGain = actx.createGain();
      droneGain.gain.value = 0;
      droneGain.connect(actx.destination);
      droneOsc = actx.createOscillator();
      droneOsc.type = 'sine';
      droneOsc.frequency.value = 48;
      lfoOsc = actx.createOscillator();
      lfoOsc.frequency.value = 0.1;
      var lg = actx.createGain();
      lg.gain.value = 2.5;
      lfoOsc.connect(lg);
      lg.connect(droneOsc.frequency);
      droneOsc.connect(droneGain);
      droneOsc.start();
      lfoOsc.start();
      droneGain.gain.linearRampToValueAtTime(0.05, actx.currentTime + 5);
    } catch (e) {}
  }
  function swellDrone(to, sec) {
    if (!actx || !droneGain) return;
    try {
      droneGain.gain.linearRampToValueAtTime(to, actx.currentTime + (sec || 2));
    } catch (e) {}
  }
  function stopDrone() {
    try { if (droneOsc) droneOsc.stop(); if (lfoOsc) lfoOsc.stop(); } catch (e) {}
  }

  function whisperPan(pan) {
    if (!actx) return;
    try {
      var p = actx.createStereoPanner ? actx.createStereoPanner() : null;
      if (!p) return;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = 160 + Math.random() * 100;
      g.gain.value = 0;
      o.connect(g);
      g.connect(p);
      p.connect(actx.destination);
      p.pan.value = pan;
      o.start();
      g.gain.linearRampToValueAtTime(0.045, actx.currentTime + 0.35);
      g.gain.linearRampToValueAtTime(0, actx.currentTime + 2.1);
      setTimeout(function () { o.stop(); }, 2300);
    } catch (e) {}
  }

  function scream(ms, vol) {
    if (!actx) return;
    try {
      var len = Math.floor(actx.sampleRate * (ms / 1000));
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.7 + Math.sin(i * 0.14) * 0.45;
        var t = i / len;
        data[i] *= Math.exp(-t * 5.5) * (t < 0.02 ? t / 0.02 : 1);
      }
      var src = actx.createBufferSource();
      src.buffer = buf;
      var g = actx.createGain();
      g.gain.value = vol || 0.5;
      var f = actx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 380;
      src.connect(f);
      f.connect(g);
      g.connect(actx.destination);
      src.start();
    } catch (e) {}
  }

  function thud() {
    if (!actx) return;
    try {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(110, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(28, actx.currentTime + 0.5);
      g.gain.setValueAtTime(0.45, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.65);
    } catch (e) {}
  }

  function playRing() {
    if (!actx) return;

      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      g.gain.value = 0;
      for (var k = 0; k < 3; k++) {
        var t0 = t + k * 1.5;
        o.frequency.setValueAtTime(440, t0);
        o.frequency.setValueAtTime(480, t0 + 0.32);
        g.gain.linearRampToValueAtTime(0.06, t0 + 0.04);
        g.gain.setValueAtTime(0.06, t0 + 0.6);
        g.gain.linearRampToValueAtTime(0, t0 + 0.85);
      }
      o.start(t); o.stop(t + 4.5);
    } catch (e) {}
  }

  /* ---------- 物件解锁 ---------- */
  var CORE = ['window', 'bed', 'phone', 'mirror', 'photo', 'screen', 'door', 'chair'];
  var LATE = ['ceil', 'under'];

  function refreshPulse() {
    if (S.ending) return;
    var coreDone = CORE.filter(function (id) { return S.done[id]; }).length;
    /* 永远有且只有一个脉冲引导 */
    var target = null;
    if (coreDone < 8) {
      /* 下一个没点过的核心 */
      for (var i = 0; i < CORE.length; i++) {
        if (!S.done[CORE[i]]) { target = CORE[i]; break; }
      }
    } else if (!S.done.ceil) {
      $('hCeil').style.display = '';
      target = 'ceil';
    } else if (!S.done.under) {
      $('hUnder').style.display = '';
      target = 'under';
    } else {
      /* 全点完 → 终局 */
      startEnding();
      return;
    }
    CORE.concat(LATE).forEach(function (id) { pulseHot('h' + id.charAt(0).toUpperCase() + id.slice(1), false); });
    if (target) {
      var id = 'h' + target.charAt(0).toUpperCase() + target.slice(1);
      pulseHot(id, true);
    }
  }

  async function onHot(id) {
    var n = (S.done[id] || 0) + 1;
    markVisited(id);
    refreshPulse();
    /* 先演剧本 */
    if (script[id]) {
      await script[id](n);
    }
    /* 二次访问：幽灵作答闪一下 */
    if (n === 2) typeGhost(2000);
    /* 三次访问后 presence 加强 */
    if (n >= 3) presence(true);
    refreshPulse();
  }

    var car0 = document.createElement('span');
    car0.className = 'caret';
    nline.appendChild(car0);
    var lines = [
      '连接受试者终端……',
      '读取环境光…… 低',
      '检测独处状态…… 是',
      '恢复房间 …… 71%'
    ];
    for (var i = 0; i < lines.length; i++) {
      for (var c = 0; c <= lines[i].length; c++) {
        bootEl.textContent = lines[i].slice(0, c);
        await sleep(22 + Math.random() * 35);
      }
      await sleep(i === 3 ? 700 : 200);
    }
    bootEl.textContent = '恢复房间 …… 100%';
    flash(160);
    await sleep(400);

    nline.innerHTML = '';
    var h = new Date().getHours();
    var late = (h >= 23 || h < 5);

    await say(late ? '房间恢复了。' : '你打开了这个页面。', { speed: 75, hold: 900 });
    await say('这是你现在的房间。', { speed: 65, hold: 800 });
    await say('很暗。', { speed: 60, hold: 1200 });
    await say('打开手电筒，看看周围。', { dim: true, speed: 55, hold: 600 });

    if (S.facts.length) {
      await say('（' + S.facts[0] + ' · 识别完成）', { dim: true, speed: 40, hold: 1200 });
    }

    if (S.visits >= 2) {
      flash(200);
      await say('第 ' + S.visits + ' 次进入这个房间。', { dim: true, speed: 55, hold: 1400 });
    }

    $('hint').textContent = '移动光标 · 点击发光的物件';
    setTimeout(function () { $('hint').style.opacity = '0'; }, 8000);

    initAudio();
    startDrone();
    S.started = true;
    $('prog').textContent = '0 / 9';
    refreshPulse();
  }

  /* ---------- 终局 ---------- */
  async function startEnding() {
    if (S.ending) return;
    S.ending = true;
    document.body.classList.add('wide', 'tilt');
    swellDrone(0.14, 3);
    presence(true);

    await say('你都看过了。', { speed: 70, hold: 1400 });
    await say('房间还是这个房间。', { speed: 60, hold: 1000 });
    await say('变的是你。', { speed: 55, hold: 1800 });

    flash(300);
    await sleep(500);

    /* 全屋一起演 */
    $('hWindow').classList.add('open', 'figure');
    $('hChair').classList.add('occupied');
    $('hDoor').classList.add('wrong', 'openish');
    $('hMirror').classList.add('showref', 'blink');
    $('hPhoto').classList.add('wrong');
    $('hBed').classList.add('slept');
    $('hCeil').style.display = '';
    $('hCeil').classList.add('wet');
    $('hUnder').style.display = '';
    $('hUnder').classList.add('peek');

    await sleep(1200);
    bigWord('它一直都在', 900, true);
    thud();
    invertPulse(3, 100);
    await sleep(800);

    /* 跳脸连段（短、狠） */
    faceJump('resource/haunt/chair.png', { full: true, ms: 800, hold: 700, vol: 0.6 });
    await sleep(400);
    faceJump('resource/haunt/portrait.png', { full: true, ms: 800, hold: 700, vol: 0.65, invert: true });
    await sleep(400);
    faceJump('resource/haunt/photo.png', { full: true, ms: 900, hold: 800, vol: 0.7 });
    thud();

    await sleep(600);
    /* 安静一刀 */
    stopDrone();
    await say('仪式完成了。', { speed: 85, hold: 2000 });
    await say('你可以关掉页面了。', { speed: 80, hold: 2000 });
    await say('它说，', { speed: 75, hold: 1200 });
    vSay('它跟你一起走', 0.3, 0.55);
    await say('它跟你一起走。', { speed: 50, hold: 2400 });

    flash(500);
    await sleep(800);

    /* 来电追出去 */
    await triggerCall();

    /* 结尾屏 */
    var end = $('end');
    var et = $('endText');
    end.classList.add('on');
    et.textContent = '';
    var msg = '房间已关闭。\n但缓存里留了一把钥匙。\n\n下次你打开任何一页，\n它都会先到。';
    for (var i = 0; i < msg.length; i++) {
      et.textContent += msg[i];
      await sleep(70);
    }
    $('endMeta').textContent = '受试者 #' + (5 + S.visits) + ' · 登记完成';
    titleGlitch('别关', '夜间独处习惯调查', 3);

    /* 10 秒后极轻回马枪 */
    setTimeout(function () {
      faceJump('resource/haunt/photo.png', { ms: 400, hold: 350, vol: 0.25, shake: false });
    }, 10000);
  }

  /* ---------- Esc 提示 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.started && !S.ending) {
      say('Esc 出不去。', { dim: true, speed: 50, hold: 1400 });
    }
  });

  /* ---------- 启动 ---------- */
  boot();

})();
</script>
</body>
</html>
