<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>夜间独处习惯调查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:#05060a;
  color:#c5cad3;
  font-family:'Songti SC','SimSun','Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:.06em;
  user-select:none;
}
/* 细遗像框 */
body::after{
  content:'';position:fixed;inset:12px;
  border:1px solid rgba(150,155,170,.22);
  pointer-events:none;z-index:80;
}
/* 极缓呼吸底 */
body::before{
  content:'';position:fixed;inset:-20%;
  background:radial-gradient(ellipse at 50% 60%, rgba(30,34,48,.5) 0%, transparent 55%);
  animation:breathe 9s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:1}}

#stage{
  position:relative;z-index:2;
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:36px 28px;
  max-width:640px;margin:0 auto;
}
/* 阶段标记：像香谱，不是进度条 */
#phaseMark{
  position:fixed;top:28px;left:28px;z-index:82;
  font-size:10px;letter-spacing:.4em;color:#4a5060;
  writing-mode:vertical-rl;
}
/* 主文字区：一次只说一句 */
#line{
  font-size:clamp(18px,4.2vw,24px);
  line-height:2.4;
  text-align:center;
  min-height:3.2em;
  color:#d8dde6;
  text-shadow:0 0 30px rgba(0,0,0,.8);
  white-space:pre-wrap;
}
#line.dim{color:#8a919e;font-size:clamp(14px,3.2vw,17px);line-height:2.2}
#line .caret{
  display:inline-block;width:1px;height:1em;
  background:#c45c5c;vertical-align:text-bottom;
  margin-left:2px;animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

/* 交互区：仪式动作，不是选项 */
#act{margin-top:48px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:16px}
.act-btn{
  background:none;border:none;
  border-bottom:1px solid rgba(150,155,170,.3);
  color:#a8b0bc;font-family:inherit;
  font-size:13px;letter-spacing:.35em;
  padding:12px 6px;cursor:pointer;
  transition:color .3s,border-color .3s,text-shadow .3s;
}
.act-btn:hover,.act-btn:focus{
  color:#e8b0b0;border-bottom-color:#c45c5c;
  text-shadow:0 0 14px rgba(196,92,92,.35);
  outline:none;
}
/* 按住确认 */
.hold-zone{
  width:220px;height:44px;position:relative;
  border:1px solid rgba(150,155,170,.25);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.hold-zone .fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,rgba(138,48,48,.15),rgba(196,92,92,.35));
  transition:width .08s linear;
}
.hold-zone span{
  position:relative;font-size:11px;letter-spacing:.3em;color:#8a919e;
}
.hold-zone.done{border-color:#c45c5c}
.hold-zone.done span{color:#e8b0b0}

/* 名字输入 */
#nameIn{
  background:none;border:none;
  border-bottom:1px solid rgba(150,155,170,.35);
  color:#e8ecf2;font-family:inherit;
  font-size:18px;letter-spacing:.2em;
  text-align:center;width:min(280px,80vw);
  padding:10px 4px;outline:none;
}
#nameIn::placeholder{color:#3a4050;letter-spacing:.15em}
#nameIn:focus{border-bottom-color:#c45c5c}

/* 视象：图片只在「它说话」时浮现 */
.vision{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
  transition:opacity 1.8s ease;
}
.vision.on{opacity:.22}
.vision img{
  max-width:70vw;max-height:70vh;
  filter:grayscale(1) contrast(1.15) brightness(.7);
}
.vision.face img{max-width:36vw;max-height:36vh;filter:grayscale(1) contrast(1.4) brightness(.55)}

/* 镜像模式：它在看你 */
body.mirror{transform:scaleX(-1)}
body.mirror #stage{transform:scaleX(-1)}
body.mirror #phaseMark{transform:scaleX(-1)}

/* 扫描线 */
body.scan::before{
  content:'';position:fixed;inset:0;z-index:75;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);
}

/* 背后剪影 */
#presence{
  position:fixed;right:-6%;bottom:-10%;width:42vw;height:85vh;
  background:radial-gradient(ellipse at 40% 75%, rgba(0,0,0,.65) 0%, transparent 68%);
  z-index:1;opacity:0;transition:opacity 3s;pointer-events:none;
}
#presence.on{opacity:1}

/* 停顿黑幕 */
#veil{
  position:fixed;inset:0;z-index:90;background:#000;
  display:none;align-items:center;justify-content:center;
}
#veil.on{display:flex}
#veil .v-text{
  font-size:13px;letter-spacing:.5em;color:#2a2e38;
}

/* 结尾墙 */
#wall{
  position:fixed;inset:0;z-index:85;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:rgba(5,6,10,.92);
}
#wall.on{display:flex}
#wall .wall-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  width:min(420px,86vw);
}
#wall .cell{
  aspect-ratio:3/4;background:#12141a;
  border:1px solid rgba(150,155,170,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#4a5060;letter-spacing:.1em;
  overflow:hidden;
}
#wall .cell img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.6)}
#wall .cell.me{
  border-color:#c45c5c;
  background:radial-gradient(ellipse at center, rgba(196,92,92,.15), #12141a);
  color:#e8b0b0;
}
#wall .caption{font-size:14px;letter-spacing:.3em;color:#8a919e}

/* 最终接管 */
#takeover{
  position:fixed;inset:0;z-index:95;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:#000;
}
#takeover.on{display:flex}
#takeover .big{
  font-size:clamp(28px,7vw,48px);letter-spacing:.25em;
  color:#e8ecf2;text-align:center;line-height:1.9;
  text-shadow:0 0 40px rgba(196,92,92,.25);
}
#takeover .small{
  margin-top:36px;font-size:11px;letter-spacing:.35em;color:#4a5060;
}

/* 通知条 */
#note{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:88;font-size:11px;letter-spacing:.25em;color:#8a919e;
  opacity:0;transition:opacity .8s;pointer-events:none;
  text-align:center;
}
#note.on{opacity:1}

@media(max-width:640px){
  body::after{inset:6px}
  #phaseMark{top:16px;left:14px}
  #act{margin-top:32px}
  .hold-zone{width:180px}
}

/* ===== 大惊吓层 ===== */
#jump{
  position:fixed;inset:0;z-index:120;
  display:none;align-items:center;justify-content:center;
  background:#000;overflow:hidden;
}
#jump.on{display:flex}
#jump img{
  max-width:100vw;max-height:100vh;object-fit:contain;
  filter:contrast(1.3) brightness(1.05);
}
#jump.full img{
  width:100vw;height:100vh;object-fit:cover;
  filter:contrast(1.4) brightness(1.1) saturate(.6);
}
#jump.inv{filter:invert(1)}
#jumpShake{position:fixed;inset:0;z-index:119;pointer-events:none;display:none}
#jumpShake.on{display:block;animation:shk .08s linear infinite}
@keyframes shk{
  0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}
  50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-5px)}
  100%{transform:translate(4px,2px)}
}
/* 裂屏文字 */
#bigScream{
  position:fixed;inset:0;z-index:125;
  display:none;align-items:center;justify-content:center;
  background:#000;
}
#bigScream.on{display:flex}
#bigScream .txt{
  font-size:clamp(40px,12vw,100px);letter-spacing:.2em;
  color:#e8ecf2;text-align:center;line-height:1.4;
  text-shadow:0 0 40px rgba(196,92,92,.6);
  font-weight:700;
}
#bigScream.inv{filter:invert(1);background:#fff}
/* 通知弹层 */
#sysNote{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:130;padding:14px 22px;
  background:rgba(18,20,26,.95);border:1px solid #3a4050;
  color:#e8ecf2;font-size:13px;letter-spacing:.1em;
  opacity:0;transition:opacity .25s;pointer-events:none;
  border-radius:10px;max-width:90vw;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
}
#sysNote.on{opacity:1}
#sysNote .sub{display:block;margin-top:4px;font-size:11px;color:#8a919e}

/* 来电 + 遗书接力 */
#incomingCall{position:fixed;inset:0;z-index:210;display:none;background:linear-gradient(180deg,#0b0d12,#12151c);flex-direction:column;align-items:center;justify-content:center;gap:30px}
#incomingCall.on{display:flex}
#incomingCall .ic-from{font-size:11px;letter-spacing:.35em;color:#6a7080}
#incomingCall .ic-name{font-size:clamp(24px,6vw,32px);letter-spacing:.1em;color:#e8ecf2;animation:icPulse 1.6s ease-in-out infinite}
@keyframes icPulse{0%,100%{opacity:.55}50%{opacity:1}}
#incomingCall .ic-sub{font-size:12px;color:#8a919e;letter-spacing:.2em}
#incomingCall .ic-actions{display:flex;gap:64px;margin-top:28px}
#incomingCall .ic-btn{width:64px;height:64px;border-radius:50%;border:none;font-size:22px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
#icAnswer{background:#2d8a4e}
#icDecline{background:#b33a3a}
#callLive{position:fixed;inset:0;z-index:211;display:none;background:#050608;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#callLive.on{display:flex}
#callLive .cl-timer{font-size:13px;letter-spacing:.3em;color:#6a7080;font-variant-numeric:tabular-nums}
#callLive .cl-text{font-size:clamp(16px,4vw,19px);letter-spacing:.12em;color:#c8ced8;min-height:2.4em;text-align:center;line-height:2.2;max-width:440px;padding:0 24px}
#callLive .cl-wave{display:flex;gap:5px;align-items:flex-end;height:28px}
#callLive .cl-wave i{width:3px;background:#3a4050;animation:clBar 1s ease infinite}
#callLive .cl-wave i:nth-child(2){animation-delay:.15s}#callLive .cl-wave i:nth-child(3){animation-delay:.3s}#callLive .cl-wave i:nth-child(4){animation-delay:.45s}#callLive .cl-wave i:nth-child(5){animation-delay:.6s}
@keyframes clBar{0%,100%{height:6px}50%{height:24px}}
#callLive .cl-hang{margin-top:20px;width:56px;height:56px;border-radius:50%;background:#b33a3a;border:none;color:#fff;font-size:18px;cursor:pointer}
#letterScreen{position:fixed;inset:0;z-index:205;display:none;background:#0a0b0f;overflow-y:auto;padding:48px 24px 80px}
#letterScreen.on{display:block}
#letterScreen .ls-inner{max-width:520px;margin:0 auto}
#letterScreen .ls-meta{font-size:11px;letter-spacing:.3em;color:#6a7080;margin-bottom:28px}
#letterScreen .ls-body{font-size:16px;line-height:2.4;color:#d5dae2;letter-spacing:.06em;min-height:10em;white-space:pre-wrap;border-left:2px solid rgba(150,155,170,.3);padding-left:22px;margin-bottom:40px}
#letterScreen .ls-body .caret{display:inline-block;width:2px;height:1.1em;background:#c45c5c;vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite}
#letterScreen .ls-label{font-size:12px;color:#8a919e;letter-spacing:.2em;margin-bottom:14px}
#letterScreen #letterInput{width:100%;min-height:100px;resize:vertical;background:rgba(255,255,255,.03);border:1px solid rgba(150,155,170,.25);color:#e8ecf2;font-family:inherit;font-size:15px;line-height:2;padding:16px 18px;letter-spacing:.05em;outline:none}
#letterScreen #letterInput:focus{border-color:#c45c5c}
#letterScreen #letterSubmit{margin-top:22px;display:block;width:100%;padding:14px;background:transparent;border:1px solid rgba(160,165,180,.4);color:#c8ced8;font-size:14px;letter-spacing:.35em;cursor:pointer;transition:all .25s}
#letterScreen #letterSubmit:hover{border-color:#c45c5c;color:#c45c5c}
#letterScreen .ls-after{margin-top:36px;font-size:11px;color:#8a919e;letter-spacing:.15em;line-height:2.2;display:none}
#letterScreen .ls-after.on{display:block}
#letterScreen .ls-after a{color:#a8b0bc}
</style>
</head>
<body>

<div id="phaseMark"></div>
<div id="presence"></div>
<div class="vision" id="vPhoto"><img src="resource/haunt/photo.png" alt=""></div>
<div class="vision face" id="vPortrait"><img src="resource/haunt/portrait.png" alt=""></div>
<div class="vision" id="vChair"><img src="resource/haunt/chair.png" alt=""></div>
<div class="vision" id="vWall"><img src="resource/haunt/wall.jpg" alt=""></div>

<div id="veil"><div class="v-text"></div></div>
<div id="note"></div>
<div id="jump"><img id="jumpImg" src="" alt=""></div>
<div id="jumpShake"></div>
<div id="bigScream"><div class="txt"></div></div>
<div id="sysNote"><span id="sysNoteText"></span><span class="sub" id="sysNoteSub"></span></div>

<div id="stage">
  <div id="line"><span class="caret"></span></div>
  <div id="act"></div>
</div>


<div id="incomingCall">
  <div class="ic-from">来电</div>
  <div class="ic-name" id="icName">未知号码</div>
  <div class="ic-sub">iPhone</div>
  <div class="ic-actions">
    <button class="ic-btn" id="icDecline" type="button">✕</button>
    <button class="ic-btn" id="icAnswer" type="button">☎</button>
  </div>
</div>
<div id="callLive">
  <div class="cl-timer" id="clTimer">00:00</div>
  <div class="cl-wave"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cl-text" id="clText"></div>
  <button class="cl-hang" id="clHang" type="button">▼</button>
</div>
<div id="letterScreen">
  <div class="ls-inner">
    <div class="ls-meta" id="lsMeta">受试者留书</div>
    <div class="ls-label">上一位答完的人，给你留了这些——</div>
    <div class="ls-body" id="lsBody"></div>
    <div class="ls-label" id="lsInputLabel">你也要给下一个人留一句。他会看到。</div>
    <textarea id="letterInput" maxlength="200" placeholder="写点什么。一百字以内。" disabled></textarea>
    <button id="letterSubmit" type="button" disabled>留 下</button>
    <div class="ls-after" id="lsAfter">
      已封存。下一位打开这份页面时，第一眼看到的就是你的话。<br>
      你不知道他是谁。他也不知道你是谁。<br><br>
      <a href="tools.html">← 回功能合集</a>
    </div>
  </div>
</div>
<div id="wall">
  <div class="wall-grid" id="wallGrid"></div>
  <div class="caption" id="wallCap">他们都在看</div>
</div>

<div id="takeover">
  <div class="big" id="takeoverText"></div>
  <div class="small">问卷已结束</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var lineEl = $('line');
  var actEl = $('act');
  var phaseEl = $('phaseMark');
  var noteEl = $('note');

  var R = {
    name: '',
    visited: 0,
    brave: 0,      // 选择「敢」类的次数
    hesitated: 0,
    letIn: false,
    lookedBack: false,
    startedAt: 0
  };

  /* ---------- 工具 ---------- */
  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }
  function setPhase(t) {
    phaseEl.textContent = t;
  }
  function note(t, ms) {
    noteEl.textContent = t;
    noteEl.classList.add('on');
    setTimeout(function () { noteEl.classList.remove('on'); }, ms || 3200);
  }
  function veil(text, ms) {
    var v = $('veil');
    v.querySelector('.v-text').textContent = text || '';
    v.classList.add('on');
    return sleep(ms || 3000).then(function () {
      v.classList.remove('on');
    });
  }
  function vision(id, on, ms) {
    var el = $(id);
    if (!el) return;
    if (on) {
      el.classList.add('on');
      if (ms) setTimeout(function () { el.classList.remove('on'); }, ms);
    } else {
      el.classList.remove('on');
    }
  }
  function presence(on) {
    $('presence').classList.toggle('on', !!on);
  }
  function mirror(on) {
    document.body.classList.toggle('mirror', !!on);
  }
  function scan(on) {
    document.body.classList.toggle('scan', !!on);
  }

  /* 逐字打出；skip=true 瞬间出 */
  var typeToken = 0;
  function say(text, opts) {
    opts = opts || {};
    var token = ++typeToken;
    lineEl.classList.toggle('dim', !!opts.dim);
    lineEl.innerHTML = '';
    var span = document.createElement('span');
    var caret = document.createElement('span');
    caret.className = 'caret';
    lineEl.appendChild(span);
    lineEl.appendChild(caret);

    if (opts.instant) {
      span.textContent = text;
      return sleep(opts.hold || 1400);
    }

    var speed = opts.speed || 95; // ms/字，仪式感要慢
    var i = 0;
    return new Promise(function (resolve) {
      function step() {
        if (token !== typeToken) { resolve(); return; }
        if (i >= text.length) {
          setTimeout(resolve, opts.hold || 1200);
          return;
        }
        span.textContent += text[i++];
        /* 随机小停顿：像在「想词」 */
        var d = speed;
        if (Math.random() < 0.08) d += 220 + Math.random() * 400;
        if (text[i - 1] === '。' || text[i - 1] === '？') d += 350;
        setTimeout(step, d);
      }
      step();
    });
  }

  function clearAct() { actEl.innerHTML = ''; }

  function actButton(label, fn, opts) {
    opts = opts || {};
    var b = document.createElement('button');
    b.className = 'act-btn';
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', function () {
      clearAct();
      fn();
    });
    actEl.appendChild(b);
    if (opts.fade) {
      setTimeout(function () {
        b.style.opacity = '0';
        setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 800);
      }, opts.fade);
    }
    return b;
  }

  function actHold(label, fn, dur) {
    dur = dur || 2800;
    var z = document.createElement('div');
    z.className = 'hold-zone';
    var fill = document.createElement('div');
    fill.className = 'fill';
    var sp = document.createElement('span');
    sp.textContent = label;
    z.appendChild(fill);
    z.appendChild(sp);
    actEl.appendChild(z);

    var start = 0, raf = 0, holding = false;
    function tick(ts) {
      if (!holding) return;
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      fill.style.width = (p * 100) + '%';
      if (p >= 1) {
        z.classList.add('done');
        sp.textContent = '好了';
        setTimeout(function () { clearAct(); fn(); }, 400);
        return;
      }
      raf = requestAnimationFrame(tick);
    }
    function down(e) {
      e.preventDefault();
      holding = true; start = 0;
      raf = requestAnimationFrame(tick);
    }
    function up() {
      if (!holding) return;
      holding = false;
      cancelAnimationFrame(raf);
      fill.style.width = '0%';
      R.hesitated++;
    }
    z.addEventListener('mousedown', down);
    z.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }

  function actName(fn) {
    var inp = document.createElement('input');
    inp.id = 'nameIn';
    inp.type = 'text';
    inp.maxLength = 8;
    inp.placeholder = '一个名字';
    inp.autocomplete = 'off';
    actEl.appendChild(inp);
    setTimeout(function () { inp.focus(); }, 200);
    function go() {
      R.name = (inp.value || '').trim();
      clearAct();
      fn();
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') go();
    });
    /* 失焦不提交，防止误触 */
  }

  function actChoice(opts, fn) {
    opts.forEach(function (o, idx) {
      actButton(o, function () {
        if (o.indexOf('敢') === 0 || o.indexOf('看') === 0 || o.indexOf('让') === 0 || o.indexOf('回') === 0 || o.indexOf('是') === 0) {
          R.brave++;
        }
        fn(idx, o);
      });
    });
  }

  function flashBlack(ms) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99;pointer-events:none;opacity:0;transition:opacity ' + (ms / 2) + 'ms';
    document.body.appendChild(d);
    requestAnimationFrame(function () { d.style.opacity = '1'; });
    setTimeout(function () {
      d.style.transition = 'opacity 200ms';
      d.style.opacity = '0';
      setTimeout(function () { d.remove(); }, 220);
    }, ms / 2);
  }

  /* ---------- 音：低频无人机 ---------- */
  var actx = null, drone = null, lfo = null, gain = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    } catch (e) {}
  }
  function startDrone() {
    if (!actx) return;
    try {
      gain = actx.createGain();
      gain.gain.value = 0.0;
      gain.connect(actx.destination);
      drone = actx.createOscillator();
      drone.type = 'sine';
      drone.frequency.value = 52; /* 低频，接近心跳下方 */
      lfo = actx.createOscillator();
      lfo.frequency.value = 0.12;
      var lfoG = actx.createGain();
      lfoG.gain.value = 3;
      lfo.connect(lfoG);
      lfoG.connect(drone.frequency);
      drone.connect(gain);
      drone.start();
      lfo.start();
      gain.gain.linearRampToValueAtTime(0.06, actx.currentTime + 4);
    } catch (e) {}
  }
  function swellDrone(to, sec) {
    if (!actx || !gain) return;
    try {
      gain.gain.linearRampToValueAtTime(to, actx.currentTime + (sec || 2));
    } catch (e) {}
  }
  function stopDrone() {
    try { if (drone) drone.stop(); if (lfo) lfo.stop(); } catch (e) {}
  }
  function whisperPan(pan) {
    if (!actx) return;
    try {
      var p = actx.createStereoPanner ? actx.createStereoPanner() : null;
      if (!p) return;
      /* 左右耳低鸣：像有人贴着一侧耳朵 */
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'triangle';
      o.frequency.value = 180 + Math.random() * 90;
      g.gain.value = 0;
      o.connect(g);
      g.connect(p);
      p.connect(actx.destination);
      p.pan.value = pan;
      o.start();
      g.gain.linearRampToValueAtTime(0.04, actx.currentTime + 0.4);
      g.gain.linearRampToValueAtTime(0, actx.currentTime + 2.2);
      setTimeout(function () { o.stop(); }, 2400);
    } catch (e) {}
  }

  
/* ===== 大惊吓引擎 ===== */
var SCREAM_AUDIO = null;
function ensureScreamAudio() {
  if (SCREAM_AUDIO) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}

/* 白噪爆音：不靠外部文件 */
function scream(ms, vol) {
  ensureScreamAudio();
  if (!actx) return;
  try {
    var len = Math.floor(actx.sampleRate * (ms / 1000));
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      /* 锯齿+噪声混合，像尖啸 */
      data[i] = (Math.random() * 2 - 1) * 0.7 + Math.sin(i * 0.15) * 0.5;
      /* 包络：暴起后拖尾 */
      var t = i / len;
      data[i] *= Math.exp(-t * 6) * (t < 0.02 ? t / 0.02 : 1);
    }
    var src = actx.createBufferSource();
    src.buffer = buf;
    var g = actx.createGain();
    g.gain.value = vol || 0.55;
    /* 高通让声音刺耳 */
    var f = actx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 400;
    src.connect(f);
    f.connect(g);
    g.connect(actx.destination);
    src.start();
  } catch (e) {}
}

function thud() {
  ensureScreamAudio();
  if (!actx) return;
  try {
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.5);
    g.gain.setValueAtTime(0.5, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.65);
  } catch (e) {}
}

/* 图片跳脸 */
function faceJump(src, opts) {
  opts = opts || {};
  var j = $('jump');
  var img = $('jumpImg');
  var sh = $('jumpShake');
  img.src = src;
  j.classList.toggle('full', !!opts.full);
  j.classList.add('on');
  if (opts.shake !== false) sh.classList.add('on');
  scream(opts.ms || 900, opts.vol || 0.6);
  if (opts.invert) {
    j.classList.add('inv');
    setTimeout(function () { j.classList.remove('inv'); }, 120);
    setTimeout(function () { j.classList.add('inv'); }, 280);
    setTimeout(function () { j.classList.remove('inv'); }, 400);
  }
  setTimeout(function () {
    j.classList.remove('on', 'full', 'inv');
    sh.classList.remove('on');
    if (opts.after) opts.after();
  }, opts.hold || 1100);
}

/* 巨字闪屏 */
function bigWord(word, ms, invert) {
  var b = $('bigScream');
  b.querySelector('.txt').textContent = word;
  b.classList.toggle('inv', !!invert);
  b.classList.add('on');
  scream(ms || 700, 0.5);
  setTimeout(function () {
    b.classList.remove('on', 'inv');
  }, ms || 700);
}

/* 标题闪乱 */
function titleGlitch(bad, good, times) {
  var n = 0;
  var id = setInterval(function () {
    document.title = (n % 2 === 0) ? bad : good;
    n++;
    if (n >= (times || 6) * 2) {
      clearInterval(id);
      document.title = good;
    }
  }, 90);
}

/* 全页反色脉冲 */
function invertPulse(n, gap) {
  var i = 0;
  var id = setInterval(function () {
    document.body.style.filter = (i % 2 === 0) ? 'invert(1)' : '';
    i++;
    if (i >= (n || 4) * 2) {
      clearInterval(id);
      document.body.style.filter = '';
    }
  }, gap || 100);
}

function playRingTone() {
  try {
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'sine';
    o.connect(g); g.connect(actx.destination);
    g.gain.value = 0;
    for (var k = 0; k < 3; k++) {
      var t0 = t + k * 1.6;
      o.frequency.setValueAtTime(440, t0);
      o.frequency.setValueAtTime(480, t0 + 0.35);
      g.gain.linearRampToValueAtTime(0.07, t0 + 0.04);
      g.gain.setValueAtTime(0.07, t0 + 0.65);
      g.gain.linearRampToValueAtTime(0, t0 + 0.9);
    }
    o.start(t); o.stop(t + 5);
  } catch (e) {}
}

function playBreathLoop(sec) {
  try {
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime;
    var o = actx.createOscillator();
    var g = actx.createGain();
    var lfo = actx.createOscillator();
    var lg = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = 62;
    lfo.type = 'sine';
    lfo.frequency.value = 0.27;
    lg.gain.value = 0.03;
    g.gain.value = 0.01;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(actx.destination);
    o.start(t); lfo.start(t);
    o.stop(t + sec); lfo.stop(t + sec);
  } catch (e) {}
}

async function startLiveCall() {
  var live = $('callLive');
  if (!live) return startLetterScreen();
  live.classList.add('on');
  document.title = '通话中';
  var sec = 0;
  var timerEl = $('clTimer');
  var textEl = $('clText');
  var timer = setInterval(function () {
    sec++;
    var m = Math.floor(sec / 60), s = sec % 60;
    timerEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);

  playBreathLoop(28);
  var script = [
    [1.2, '……喂？'],
    [3.5, '能听见吗。'],
    [6.0, '别说话。听我说完。'],
    [9.5, '你身后那把椅子——'],
    [12.5, '不是空的。'],
    [15.5, '我上一次也接了这通电话。'],
    [19.0, '现在轮到我给你打了。'],
    [22.5, '挂断之前，看一眼你背后。'],
    [26.0, '……时间到了。']
  ];
  for (var i = 0; i < script.length; i++) {
    await sleep(script[i][0] * 1000 - (i === 0 ? 0 : script[i - 1][0] * 1000));
    textEl.textContent = script[i][1];
  }
  await sleep(1500);
  clearInterval(timer);
  live.classList.remove('on');
  textEl.textContent = '';
  timerEl.textContent = '00:00';
  document.title = '夜间独处习惯调查';
  return startLetterScreen();
}

async function startLetterScreen() {
  var sc = $('letterScreen');
  if (!sc) return;
  sc.classList.add('on');
  document.title = '受试者留书';
  setPhase('书');

  var saved = readLetter();
  var content = saved || DEFAULT_LETTERS[Math.floor(Math.random() * DEFAULT_LETTERS.length)];
  var body = $('lsBody');
  $('lsMeta').textContent = '受试者留书 · ' + (saved ? '封存于本机' : '无名氏 · 记录缺失');
  body.innerHTML = '<span class="caret"></span>';
  var caret = body.querySelector('.caret');

  for (var i = 0; i < content.length; i++) {
    caret.insertAdjacentText('beforebegin', content.charAt(i));
    await sleep(70 + Math.random() * 90);
  }
  await sleep(2500);
  $('letterInput').disabled = false;
  $('letterSubmit').disabled = false;

  return new Promise(function (resolve) {
    $('letterSubmit').onclick = function () {
      var text = ($('letterInput').value || '').trim();
      if (!text) {
        var inp = $('letterInput');
        inp.style.borderColor = '#c45c5c';
        setTimeout(function () { inp.style.borderColor = ''; }, 800);

      writeLetter(text);
      $('letterInput').disabled = true;
      $('letterInput').style.opacity = '.4';
      $('letterSubmit').disabled = true;
      $('letterSubmit').textContent = '已封存';
      $('lsInputLabel').textContent = '你留下的：';
      $('lsAfter').classList.add('on');
      resolve();
    };
  });
}

      swellDrone(0.2, 1);
    } else {
      await say('谢谢。', { speed: 70, hold: 2000 });
      flashBlack(1000);
      swellDrone(0.22, 1);
      await sleep(1200);
    }

    /* 接管 */
    await sleep(400);
    mirror(true);
    presence(true);
    scan(true);

    /* 结尾墙 */
    showWall();
  }

  async function showWall() {
    var wall = $('wall');
    var grid = $('wallGrid');
    var cap = $('wallCap');
    grid.innerHTML = '';
    var pics = ['photo.png', 'portrait.png', 'chair.png', 'wall.jpg'];
    for (var i = 0; i < 8; i++) {
      var c = document.createElement('div');
      c.className = 'cell';
      if (i === 5) {
        c.className += ' me';
        c.textContent = R.name || '你';
      } else if (i % 3 === 0) {
        c.innerHTML = '<img src="resource/haunt/' + pics[i % pics.length] + '" alt="">';
      } else {
        c.textContent = ['第 ' + (i + 1) + ' 位', '', '', '已登记', '', '', ''][i % 7] || '';
      }
      grid.appendChild(c);
    }
    wall.classList.add('on');

    await sleep(1600);
    cap.textContent = '他们都在看';
    await sleep(1800);
    cap.textContent = '第 ' + (5 + R.visited) + ' 位受试者已入席';
    await sleep(1800);
    cap.textContent = '就是你';
    await sleep(2200);

    /* 最终接管屏 */
    wall.classList.remove('on');
    /* 最终跳脸 */
    faceJump('resource/haunt/portrait.png', { full: true, ms: 1600, hold: 1500, vol: 0.75, invert: true });
    thud();
    await sleep(800);
    bigWord('就是你', 900, true);
    await sleep(600);
    var tk = $('takeover');
    var tt = $('takeoverText');
    tk.classList.add('on');
    var msg = R.letIn
      ? '它坐下了。\n' + (R.name ? R.name + ' 站在你后面。' : '它站在你后面。')
      : '仪式结束。\n它没有离开。';
    tt.style.whiteSpace = 'pre-wrap';
    tt.textContent = '';
    for (var j = 0; j < msg.length; j++) {
      await sleep(90);
      tt.textContent += msg[j];
    }

    await sleep(2400);
    /* 假结束 + 回马枪 */
    tt.textContent = '';
    var msg2 = '别关页面。\n它还没走。';
    for (var k = 0; k < msg2.length; k++) {
      await sleep(100);
      tt.textContent += msg2[k];
    }
    await sleep(2000);
    flashBlack(800);
    await sleep(1000);
    faceJump('resource/haunt/photo.png', { full: true, ms: 1200, hold: 1100, vol: 0.65 });
    await sleep(500);
    /* 接管屏收起，格式再碎一次：来电 */
    tk.classList.remove('on');
    mirror(false); presence(false); scan(false);
    document.body.style.background = '#0a0b0f';
    stopDrone();
    await sleep(600);

    await startIncomingCall();

    /* 遗书写完后一句收尾 */
    await sleep(800);
    tt.classList.add('on');
    var endMsg = '下一个人打开这页时，\n会先看见你写的那句。\n\n它也会看见。';
    tt.textContent = '';
    for (var e = 0; e < endMsg.length; e++) {
      await sleep(80);
      tt.textContent += endMsg[e];
    }
    titleGlitch('别关', '夜间独处习惯调查', 4);
  }

  /* 深夜文案入口 */
  if (document.title) {
    /* 保持伪装标题 */
  }

  /* 启动 */
  actGate();

})();
</script>
</body>
</html>
