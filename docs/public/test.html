<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格解析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: #f4f1ed;
    color: #2a2520;
    padding: 20px;
    transition: background 3s ease, color 3s ease;
}

/* 眼睛容器 */
#eye-wrap {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; justify-content: center; align-items: center;
    z-index: 0; opacity: 0; transition: opacity 4s ease;
}
#eye-wrap img {
    width: 180px; height: 180px;
    object-fit: contain;
    filter: brightness(0.85) contrast(1.1);
    transition: width 6s ease, height 6s ease, filter 4s ease;
}
#eye-wrap.late img {
    width: 280px; height: 280px;
}
#eye-wrap.later img {
    width: 420px; height: 420px;
}
#eye-wrap.phase-dark img {
    filter: brightness(0.4) contrast(1.4) saturate(0.8);
}

/* 自我指涉底栏 */
#meta {
    position: fixed; bottom: 8px; right: 12px;
    font-size: 8px; color: transparent;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px; pointer-events: none; z-index: 50;
    transition: color 4s; user-select: none;
}
#meta.on { color: #b0a898; }

/* 主容器 */
#app {
    max-width: 560px; width: 100%;
    padding: 48px 56px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.07);
    position: relative; z-index: 10;
    background: transparent;
    transition: border-color 3s;
}


/* 深色阶段：app容器保持文字可见 */
#app.phase-dark {
    background: rgba(0,0,0,0.18);
    border-color: rgba(255,255,255,0.06);
}

#app.phase-dark .opt-btn {
    border-color: rgba(255,255,255,0.1);
    color: #d0c0a8;
    opacity: 0.65;
}

#app.phase-dark .opt-btn:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.22);
    opacity: 0.8;
}

#app.phase-dark .q-text {
    color: #d0c0a8;
}

#app.phase-dark .q-num {
    color: #a08060;
}

#app.phase-dark .hdr {
    border-bottom-color: rgba(255,255,255,0.07);
}

#app.phase-dark .prog-wrap {
    background: rgba(255,255,255,0.04);
}

#app.phase-dark .prog-bar {
    background: rgba(255,255,255,0.18);
}

#app.phase-dark .brand,
#app.phase-dark .prog-t {
    color: #a08060;
    opacity: 0.7;
}

/* 特殊题文字 */
#app.phase-dark .sp-q {
    color: #d0c0a8;
}

/* 暗示文字 */
#app.phase-dark .hint {
    color: #b09070;
}

/* 结果页 */
#app.phase-dark .r-type,
#app.phase-dark .r-sub,
#app.phase-dark .r-desc,
#app.phase-dark .r-detail {
    color: #d0c0a8;
}

/* 头部 */
.hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.05); }
.brand { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.22; font-weight: 300; }
.prog-t { font-size: 9px; opacity: 0.22; letter-spacing: 1px; }
.prog-t em { font-style: normal; opacity: 1; }
.prog-wrap { height: 1px; background: rgba(0,0,0,0.04); border-radius: 1px; margin-bottom: 32px; overflow: hidden; }
.prog-bar { height: 100%; width: 0; background: rgba(0,0,0,0.1); border-radius: 1px; transition: width 0.6s ease, background 1s; }

/* 内容 */
.content { min-height: 240px; display: flex; flex-direction: column; justify-content: center; }

/* 欢迎 */
#welcome { text-align: center; }
#welcome h1 { font-size: 20px; font-weight: 200; letter-spacing: 8px; margin-bottom: 12px; opacity: 0.6; }
#welcome p { font-size: 11px; opacity: 0.38; line-height: 2.4; margin-bottom: 12px; }
#welcome .sub { font-size: 9px; opacity: 0.2; letter-spacing: 3px; margin-bottom: 28px; }
#start {
    background: transparent; border: 1px solid rgba(0,0,0,0.1); color: inherit;
    font-size: 10px; letter-spacing: 4px; padding: 11px 36px; cursor: pointer;
    font-family: inherit; text-transform: uppercase; font-weight: 300;
    opacity: 0.4; transition: opacity 0.3s;
}
#start:hover { opacity: 0.75; }

/* 题目 */
#q-area { display: none; }
#q-area.on { display: block; animation: in 0.5s ease; }
@keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.q-num { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.18; margin-bottom: 8px; }
.q-text { font-size: 15px; font-weight: 300; line-height: 2.1; margin-bottom: 24px; min-height: 44px; letter-spacing: 0.3px; transition: filter 0.5s, opacity 0.5s; }
.q-opts { display: flex; flex-direction: column; gap: 5px; }
.opt-btn {
    background: transparent; border: 1px solid rgba(0,0,0,0.05); border-radius: 1px;
    padding: 12px 14px; font-size: 13px; color: inherit; cursor: pointer;
    font-family: inherit; text-align: left; transition: all 0.18s;
    display: flex; align-items: center; gap: 10px;
    font-weight: 300; letter-spacing: 0.2px; opacity: 0.55;
}
.opt-btn:hover { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.12); transform: translateX(2px); opacity: 0.75; }
.opt-btn .l { width: 15px; height: 15px; border: 1px solid rgba(0,0,0,0.07); border-radius: 50%; font-size: 7.5px; display: flex; align-items: center; justify-content: center; opacity: 0.28; flex-shrink: 0; }

/* 特殊题 */
#sp-area { display: none; text-align: center; margin-top: 8px; }
#sp-area.on { display: block; }
.sp-q { font-size: 14px; font-weight: 300; color: #2a2520; line-height: 2.5; margin-bottom: 22px; letter-spacing: 0.4px; }
.sp-btn { display: none; }

/* 暗示文字 */
#hint-area { min-height: 16px; margin-top: 14px; }
.hint { font-size: 10px; color: #8a7060; opacity: 0; letter-spacing: 0.3px; font-weight: 300; font-style: italic; transition: opacity 1.2s; line-height: 1.8; }

/* 结果 */
#r-area { display: none; }
#r-area.on { display: block; animation: in 0.6s ease; }
.r-type { font-size: 9px; color: inherit; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.45; }
.r-sub { font-size: 17px; font-weight: 200; color: inherit; margin-bottom: 10px; letter-spacing: 3px; }
.r-desc { font-size: 11px; opacity: 0.3; line-height: 2; margin-bottom: 10px; }
.r-detail { border-top: 1px solid rgba(0,0,0,0.04); padding-top: 12px; font-size: 11px; opacity: 0.22; line-height: 2; }

/* 响应式 */
@media (max-width: 600px) {
    #app { padding: 32px 22px; }
    #welcome h1 { font-size: 16px; }
    .q-text { font-size: 13px; }
    .opt-btn { font-size: 12px; }
    #eye-wrap img { width: 120px !important; height: 120px !important; }
}
</style>
</head>
<body>

<div id="eye-wrap">
    <img src="eye.png" alt="" id="eye-img">
</div>
<div id="meta"></div>

<div id="app">
    <div class="hdr">
        <div class="brand">MindType</div>
        <div class="prog-t">第 <em id="q-n">0</em> / <span id="q-t">40</span> 题</div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>
    <div class="content">

        <div id="welcome">
            <h1>人格解析</h1>
            <p>通过 40 道题目，揭示你的认知密码。<br>请根据直觉作答，不必思考太久。</p>
            <p class="sub">约 13 分钟 · 内心诚实</p>
            <button id="start">开始测试 →</button>
        </div>

        <div id="q-area">
            <div class="q-num" id="q-lbl">问题 1</div>
            <div class="q-text" id="q-txt">加载中...</div>
            <div class="q-opts" id="q-opts"></div>
            <div id="sp-area">
                <div class="sp-q" id="sp-q"></div>
                <button class="sp-btn" id="sp-btn">我读完了</button>
            </div>
            <div id="hint-area"></div>
        </div>

        <div id="r-area">
            <div class="r-type" id="r-type">——</div>
            <div class="r-sub" id="r-sub">——</div>
            <div class="r-desc" id="r-desc">——</div>
            <div class="r-detail" id="r-detail"></div>
        </div>

    </div>
</div>

// 特殊题：文字恐怖谷
// 手法：它知道/自我递归/第三人突现/几乎正确的错误/时间错位/反刍重复
const SPQS = [
    // Q10
    '发生了一些异常。正在恢复。',
    // Q20
    '发生了一些异常。正在恢复。',
    // Q30

    // Q60

    // Q80

    // Q100
    '发生了一些异常。正在恢复。'
];

// ================================================================
// "他来了"效果
// ================================================================
let itCameState = 'idle';
let itCameTimeout = null, itCameTimeout2 = null;

function triggerItCame() {
    if (itCameState !== 'idle') return;
    itCameState = 'asking';

    // 记住眼睛原始尺寸
    const comp = getComputedStyle(eyeWrap);
    const origW = parseFloat(comp.width);
    const origH = parseFloat(comp.height);

    const overlay = document.createElement('div');
    overlay.id = 'cam-ask';
    overlay.style.cssText = `
        position:fixed;inset:0;background:#000;z-index:9000;
        display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:32px;
        opacity:0;transition:opacity 1.5s ease;
    `;

    const msg = document.createElement('div');
    msg.style.cssText = `
        font-family:system-ui,sans-serif;font-size:13px;
        color:#b0a090;letter-spacing:6px;text-transform:uppercase;
        text-align:center;
    `;
    msg.textContent = '检测到设备连接';

    const sub = document.createElement('div');
    sub.style.cssText = `
        font-family:system-ui,sans-serif;font-size:11px;
        color:#4a4038;letter-spacing:2px;text-align:center;
    `;
    sub.textContent = '[ USB 摄像头 ] 已连接 — 请求访问权限';

    const btn = document.createElement('div');
    btn.textContent = '允许';
    btn.style.cssText = `
        font-family:system-ui,sans-serif;font-size:11px;
        color:#6a6058;letter-spacing:4px;cursor:pointer;
        border:1px solid #3a3530;padding:8px 28px;
        transition:color 0.3s,border-color 0.3s;
    `;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.style.color = '#8a4040';
        btn.style.borderColor = '#5a2020';
        btn.textContent = '……';
    });
    btn.addEventListener('mouseenter', () => { btn.style.color = '#c0b090'; });
    btn.addEventListener('mouseleave', () => { btn.style.color = '#6a6058'; });

    overlay.appendChild(msg);
    overlay.appendChild(sub);
    overlay.appendChild(btn);
    document.body.appendChild(overlay);
    requestAnimationFrame(() => { overlay.style.opacity = '1'; });

    // 2秒后：假装在"处理"权限
    itCameTimeout = setTimeout(() => {
        itCameState = 'watching';
        btn.remove();
        sub.style.opacity = '0';
        sub.style.transition = 'opacity 0.5s';
        requestAnimationFrame(() => {
            sub.textContent = '正在获取画面…';
            sub.style.color = '#a09070';
            sub.style.opacity = '1';
        });

        // 4秒后："它看到了"
        itCameTimeout2 = setTimeout(() => {
            msg.textContent = '它看到了你';
            msg.style.fontSize = '24px';
            msg.style.letterSpacing = '12px';
            msg.style.color = '#c0a080';
            msg.style.opacity = '0';
            sub.style.opacity = '0';
            requestAnimationFrame(() => { msg.style.opacity = '1'; });

            // 眼睛睁大（无过渡）
            eyeWrap.style.transition = 'none';
            eyeWrap.style.width = '95vw';
            eyeWrap.style.height = '95vh';
            eyeWrap.style.opacity = '0.95';
            eyeWrap.style.zIndex = '9001';
            eyeWrap.style.position = 'fixed';
            eyeWrap.style.left = '2.5vw';
            eyeWrap.style.top = '2.5vh';

            // 低频心跳音效（40Hz sawtooth）
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 40;
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 7);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 7);
                // 2Hz 调制心跳
                const lfo = ctx.createOscillator();
                const lfoG = ctx.createGain();
                lfo.frequency.value = 2;
                lfoG.gain.value = 0.3;
                lfo.connect(lfoG); lfoG.connect(gain.gain);
                lfo.start(); lfo.stop(ctx.currentTime + 7);
            } catch(e) {}

            // 9秒后"它走了"
            setTimeout(() => {
                msg.textContent = '它走了。';
                msg.style.fontSize = '13px';
                msg.style.letterSpacing = '4px';
                msg.style.color = '#5a5040';
                msg.style.opacity = '0';
                requestAnimationFrame(() => { msg.style.opacity = '1'; });

                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.remove(), 2100);
                }, 2500);

                // 眼睛归位
                eyeWrap.style.transition = 'width 2s ease, height 2s ease, opacity 2s ease, left 2s ease, top 2s ease';
                eyeWrap.style.width = origW + 'px';
                eyeWrap.style.height = origH + 'px';
                eyeWrap.style.left = '';
                eyeWrap.style.top = '';
                eyeWrap.style.position = '';
                eyeWrap.style.zIndex = '';
                eyeWrap.style.opacity = '';

                itCameState = 'idle';
            }, 9000);
        }, 4000);
    }, 2000);
}

// 眼睛 jumpscare
function eyeJumpscare() {
    const el = eyeImg;
    const wrap = eyeWrap;
    const computed = getComputedStyle(el);
    // 保存原始状态
    const origW = computed.width;
    const origH = computed.height;
    const origPos = { top: wrap.style.top, left: wrap.style.left, opacity: wrap.style.opacity };
    // 先闪红，再闪白
    flash('#7a0000', 40);
    setTimeout(() => flash('#fff', 60), 45);
    // 眼睛移到正中，瞬间放大
    wrap.style.transition = 'none';
    wrap.style.top = '50%';
    wrap.style.left = '50%';
    wrap.style.transform = 'translate(-50%,-50%)';
    el.style.transition = 'width 0.06s, height 0.06s';
    el.style.width = '98vw';
    el.style.height = '98vh';
    el.style.objectFit = 'cover';
    wrap.style.opacity = '1';
    // 低频冲击 + BGM音量突刺
    const prevVol = bgm ? bgm.volume : 0.5;
    if (bgm) bgm.volume = 1.0;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.frequency.value = 40;
        osc.type = 'sawtooth';
        g.gain.setValueAtTime(0.6, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
        setTimeout(() => ctx.close(), 500);
    } catch(e) {}
    // 300ms后恢复
    setTimeout(() => {
        wrap.style.transition = 'all 0.7s ease';
        wrap.style.top = '';
        wrap.style.left = '';
        wrap.style.transform = '';
        el.style.transition = 'width 0.6s ease, height 0.6s ease';

// 特殊题文字逐级腐坏：level越高越不对劲
function corruptSpecialText(el, level) {
    if (!el || !level) return;
    const corruptions = [
        () => {
            // level1: 换掉一个字
            el.innerHTML = '发生了一些异常。正在<span style="color:#a00;">恢</span>复。';
        },
        () => {
            // level2: 恢复变乱码
            el.innerHTML = '发生了一些异常。正在<span style="color:#900;font-family:monospace;">恢&zwnj;复</span>。';
            setTimeout(() => { el.innerHTML = '发生了一些异常。正在<span style="color:#a00;">诙&zwnj;复</span>。'; }, 600);
        },
        () => {
            // level3: 文字开始变形+闪烁
            el.innerHTML = '发生了一些异常。正在恢复。';
            let ticks = 0;
            const iv = setInterval(() => {
                ticks++;
                const maps = [
                    {'发':'髪','生':'笙','了':'了','一':'亊','些':'眂','异':'罙','常':'瑺',
                     '正':'佱','在':'両','恢':'诙','复':'馥'},
                    {'发':'髮','生':'冃','了':'亍','一':'丄','些':'眂','异':'戠','常':'萇',
                     '正':'凒','在':'両','恢':'灰','复':'複'},
                ];
                const map = maps[ticks % 2];
                let t = '发生了一些异常。正在恢复。';
                for (const [k, v] of Object.entries(map)) {
                    if (Math.random() < 0.5) t = t.replace(k, v);
                }
                el.innerHTML = t;
                el.style.opacity = ticks % 2 === 0 ? '0.85' : '1';
                if (ticks > 6) { clearInterval(iv); el.style.opacity = '1'; }
            }, 350);
        },
        () => {
            // level4: 完全不可读+抖动
            el.innerHTML = '发生了一些异常。正在恢复。';
            let ticks = 0;
            const iv = setInterval(() => {
                ticks++;
                const t = '发生了一些异常。正在恢复。';
                el.innerHTML = t.split('').map(c => {
                    if (/[\u4e00-\u9fa5]/.test(c) && Math.random() < 0.7)
                        return `<span style="color:#${ticks%2?'a00':'#c00'}">${c}</span>`;
                    return c;
                }).join('');
                el.style.transform = `translateX(${(Math.random()-0.5)*4}px)`;
                if (ticks > 8) { clearInterval(iv); el.style.transform = ''; }
            }, 250);
        }
    ];
    const fn = corruptions[Math.min(level - 1, corruptions.length - 1)];
    setTimeout(fn, 800);
}

function textCorrupt(el) {
    if (!el) return;
    const orig = el.innerHTML;
    const corrupt = () => {
        const bad = orig.replace(/[a-zA-Z0-9]/g, c => {
            if (Math.random() < 0.07) {
                const map = {
                    'e':'3','i':'1','a':'4','o':'0','s':'5',
                    't':'7','l':'1','r':'2','n':'h','h':'n',
                    'E':'3','I':'1','A':'4','O':'0','S':'5',
                    'T':'7','L':'1','R':'2','N':'H','H':'N'
                };
                return map[c] !== undefined ? map[c] : c;
            }
            return c;
        });
        el.innerHTML = bad;
        setTimeout(() => {

}

function startBGM() {

        vol = Math.min(0.45, vol + 0.015);

        if (vol >= 0.45) clearInterval(fadeIn);
    }, 200);
}

function setBGMVolume(v, dur = 2000) {
    const now = bgm.volume;
    const step = (v - now) / (dur / 50);
    const fade = setInterval(() => {
        bgm.volume = Math.max(0, Math.min(1, bgm.volume + step));
        if ((step > 0 && bgm.volume >= v) || (step < 0 && bgm.volume <= v)) {
            bgm.volume = v;
            clearInterval(fade);
        }
    }, 50);
}

function playNoise() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufSize = ctx.sampleRate * 3;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 600;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.8);
        g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2.2);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.5);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 3.5);
        setTimeout(() => ctx.close(), 4000);
    } catch(e) {}
}

    if (p >= 2) eyeWrap.style.opacity = '1';
    if (p >= 5) eyeWrap.classList.add('late');
    if (p >= 7) { eyeWrap.classList.add('later'); eyeWrap.classList.add('phase-dark'); }
    if (p >= 8) { eyeWrap.style.opacity = '0.6'; }

    // 阶段6+：眼睛开始"活着"——轻微漂移
    if (p >= 6) startEyeLife();

    // 阶段7+：元信息栏文字开始变化
    if (p >= 7) {
        meta.style.letterSpacing = '1px';
    }

    // 元信息栏
    if (p >= 3) meta.classList.add('on');

    // 暗示
    if (started) maybeShowHint();
}

// 眼睛"生命"：轻微的呼吸/漂移
let eyeLifeInterval = null;
function startEyeLife() {
    if (eyeLifeInterval) return;
    eyeLifeInterval = setInterval(() => {
        const drift = (Math.random() - 0.5) * 8;
        const driftY = (Math.random() - 0.5) * 6;
        eyeWrap.style.transform = `translate(calc(-50% + ${drift}px), calc(-50% + ${driftY}px))`;
        setTimeout(() => {
            if (!eyeWrap.style.transform) return;
            eyeWrap.style.transform = 'translate(-50%,-50%)';
        }, 400);
    }, 1800 + Math.random() * 2000);
}

// ================================================================
// 渲染题目
// ================================================================
function renderQ(idx) {
    applyPhase(phVal());
    const q = SEQ[idx];
    if (!q) return;

    clearHint();
    qN.textContent = idx + 1;
    qTEl.textContent = TOTAL;
    prog.style.width = `${(idx / TOTAL) * 100}%`;
    qLbl.textContent = `问题 ${idx + 1}`;
    qTxt.style.filter = '';

    spArea.classList.remove('on');
    qOpts.style.display = 'flex';

    if (q.sp) {
        qOpts.style.display = 'none';
        spArea.classList.add('on');
        spQEl.innerHTML = q.t;
        // 特殊题文字越后越不对劲
        if (idx >= 2) corruptSpecialText(spQEl, Math.floor(idx / 3));
        qTxt.textContent = '';
        qArea.classList.add('on');
        welcome.style.display = 'none';
        rArea.classList.remove('on');
        // 特殊题：随机触发一种效果
        triggerSpecialEffect();
        setTimeout(() => {
            cur++;
            if (cur < TOTAL) renderQ(cur);
            else showResult();
        }, 4000);
        return;
    }

    qOpts.style.display = 'flex';
    spArea.classList.remove('on');
    qTxt.textContent = q.t;
    // 5题后开始文字恐怖谷
    if (idx >= 5) startQuestionCorruption(qTxt, idx);

    let a = q.a, b = q.b;

    qOpts.innerHTML = '';
    [{l:'A',label:a,v:q.va},{l:'B',label:b,v:q.vb}].forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="l">${o.l}</span><span>${o.label}</span>`;
        if (idx >= 5) observeOptionCorruption(btn, o.label, o.l);
        btn.onclick = () => handleAns(o.v, o.label, o.l);
        qOpts.appendChild(btn);
    });

    qArea.classList.add('on');
    welcome.style.display = 'none';
    rArea.classList.remove('on');
}

// ================================================================
// 答案处理
// ================================================================
function handleAns(v, label, ltr) {
    const delay = Date.now() - lastClick;
    lastClick = Date.now();
    ans[cur] = { v, label, ltr, delay };

    // 悬停暗示：你本来想选另一个
    const h = hoverCount[cur];
    if (h && ph >= 5 && !wrongChoiceShown) {
        const first = h.a >= h.b ? 'A' : 'B';
        const chosen = ltr;
        if (first !== chosen && Math.random() < 0.4) {
            const wrongLabel = first === 'A' ? SEQ[cur].a : SEQ[cur].b;
            showHint('你本来想选 "' + wrongLabel + '"。', 5000);
            wrongChoiceShown = true;
        }
    }

    // 犹豫暗示
    if (delay > 4000 && ph >= 3) {
        showHint('你在这里停了很久。', 4000);
    }

    // 快速点击：恐怖质问 + 红闪
    if (delay < 500 && ph >= 4) {
        const q = [
            '真的想了吗？',
            '真的想了吗？？',
            '真的想了吗？？？',
            '你真的在想吗？',
            '还是只是在点？',
            '这三个字，你真的读了吗？',
            '想了。再想一遍。',
            '你选的。不是系统选的。',
        ];
        flash('#6a0000', 120);
        showHint(q[Math.floor(Math.random() * q.length)], 2800);
        wrongChoiceShown = false; // 重置，允许再次触发
    }

    cur++;
    if (cur < TOTAL) renderQ(cur);
    else showResult();
}

// ================================================================
// 结果页
// ================================================================
function showResult() {
    applyPhase(9);
    clearHint();
    qArea.classList.remove('on');
    welcome.style.display = 'none';
    rArea.classList.add('on');

    // 计算类型
    let d = {EI:{e:0,i:0},SN:{s:0,n:0},TF:{t:0,f:0},JP:{j:0,p:0}};
    SEQ.forEach((q, i) => {
        if (q.sp) return;
        const v = ans[i] ? ans[i].v : q.va;
        if (q.d==='EI') v==='E'?d.EI.e++:d.EI.i++;
        else if (q.d==='SN') v==='S'?d.SN.s++:d.SN.n++;
        else if (q.d==='TF') v==='T'?d.TF.t++:d.TF.f++;
        else if (q.d==='JP') v==='J'?d.JP.j++:d.JP.p++;
    });
    const gc = (m,a,b) => m[a.toLowerCase()] >= m[b.toLowerCase()] ? a : b;
    const type = gc(d.EI,'E','I') + gc(d.SN,'S','N') + gc(d.TF,'T','F') + gc(d.JP,'J','P');
    const r = RESULTS[type] || RESULTS['INTJ'];

    $('r-type').textContent = '人格解析报告';
    $('r-sub').textContent = r.s;
    $('r-desc').textContent = r.d;
    $('r-detail').innerHTML = r.x;
    prog.style.width = '100%';

    // 眼睛变大
    eyeWrap.classList.add('later');
    eyeWrap.style.opacity = '0.7';

    // 设备信息
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const dev = document.createElement('div');
    dev.style.cssText = 'margin-top:20px;font-size:8px;opacity:0.18;letter-spacing:0.5px;font-family:"Courier New",monospace;';
    dev.textContent = `${window.screen.width}×${window.screen.height} · ${navigator.userAgent.split(' ').slice(0,3).join(' ')} · 用时${elapsed}秒 · 离开${tabCount}次`;
    rArea.appendChild(dev);

    // 最后一行
    setTimeout(() => {
        const last = document.createElement('div');
        last.style.cssText = 'margin-top:20px;font-size:10px;opacity:0.2;letter-spacing:4px;text-transform:uppercase;';
        last.textContent = '你完成了';
        rArea.appendChild(last);
        setTimeout(() => {
            last.style.transition = 'opacity 3s';
            last.style.opacity = '0.45';
        }, 500);
    }, 4000);

    // 音量降低
    setTimeout(() => setBGMVolume(0.08, 5000), 3000);
    // 结果页最终jumpscare：3.5秒后跳转B站
    setTimeout(resultJumpscare, 2500);
}

// ================================================================
// 自我指涉
// ================================================================
setInterval(() => {
    if (!started || ph < 3) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = String(elapsed % 60).padStart(2, '0');
    const avgSpd = speedBuf.length ? Math.round(speedBuf.reduce((a,b)=>a+b,0)/speedBuf.length) : 0;

    // 阶段7+：meta文字开始恐怖谷
    if (ph >= 7) {
        const glitched = `${window.screen.width}×${window.screen.height} · ${min}:${sec} · 静止${mouseStill}s · 离开${tabCount}次`.split('').map(c => {
            if (Math.random() < 0.05) {
                const m = {'0':'O','1':'l','3':'E','5':'S','7':'T','o':'0','l':'1'};
                return m[c] !== undefined ? m[c] : c;
            }
            return c;
        }).join('');
        meta.textContent = glitched;
    } else {
        meta.textContent = `${window.screen.width}×${window.screen.height} · ${min}:${sec} · 静止${mouseStill}s · 速度${avgSpd} · 离开${tabCount}次`;
    }
}, 2500);

function distortChar(c) {
    const r = Math.random();
    if (r < 0.10) {
        // 简繁互换
        const tc = {'为':'為','会':'會','开':'開','关':'關','来':'來','时':'時','见':'見','进':'進','远':'遠','连':'連','无':'無','对':'對','实':'實','应':'應','过':'過','变':'變','当':'當','门':'門','间':'間','区':'區','书':'書','东':'東','车':'車','广':'廣','产':'產','业':'業','学':'學','与':'與','给':'給','经':'經','总':'總','马':'馬','鸟':'鳥','鱼':'魚','虫':'蟲','龙':'龍','风雨雷电':'風雨雷電'};
        const keys = Object.keys(tc);
        const k = keys.find(k => k === c);
        if (k) return tc[k];
        const kv = Object.entries(tc).find(([k,v]) => v === c);
        if (kv) return kv[0];
    } else if (r < 0.20) {
        // 近形字替换
        const sim = {'人':'入','己':'已','士':'土','大':'太','日':'目','了':'子','八':'人','力':'刀','干':'于','今':'令','么':'公','才':'寸','下':'上','万':'方','与':'兴','天':'夫','不':'还','中':'申','手':'毛','升':'开','反':'友','天':'夫','内':'肉','父':'爻','匀':'勺','尤':'龙','仆':'仁','仇':'仅','仍':'扔','斤':'斥','爪':'瓜','伐':'代','伤':'伕','优':'优','伙':'伴','会':'云','创':'刂','杂':'九','各':'名','名':'各','后':'石','因':'囚','在':'右','夸':'夺','扣':'叩','地':'他','场':'坪','再':'冉','协':'十','压':'厂','厌':'庆','戌':'成','同':'回','因':'囚','在':'右','吃':'口','吗':'马','回':'同','团':'困','因':'囚','多':'夕','她':'他','妈':'好','收':'改','如':'好','字':'学','孙':'子','红':'虹','论':'抢','设':'没','访':'仿','尽':'层','导':'异','寿':'春','麦':'妻','寿':'春'};
        if (sim[c]) return sim[c];
    } else if (r < 0.28) {
        // 同音/近音替换
        const hom = {'你':'您','他':'它','是':'似','我':'哦','这':'这','那':'哪','有':'又','在':'再','的':'得','和':'合','就':'究','不':'木','很':'狠','都':'兜','能':'呢','会':'汇','也':'野','把':'吧','去':'趣','来':'赖','时':'十','看':'刊','出':'刍','个':'各','说':'硕','想':'响','做':'作','到':'道','很':'狠','太':'态','能':'呢','着':'者','过':'国','还':'孩','等':'蹬','再':'在','好':'号','里':'理','后':'候','被':'悲','被':'备','给':'跟','被':'北','很':'很'};
        if (hom[c]) return hom[c];
    }
    return c;
}

function startQuestionCorruption(el, qIdx) {
    if (!el) return;
    let stopped = false;
    let step = 0;

    const tick = () => {
        if (stopped) return;
        const text = el.textContent;
        const chars = text.split('');
        const op = Math.random();

        if (op < 0.20) {
            // 添字
            const pos = Math.floor(Math.random() * chars.length);
            const extras = ['的','你','它','在','了','？','。','...','…','—','「','」','...'];
            chars.splice(pos, 0, extras[Math.floor(Math.random() * extras.length)]);
        } else if (op < 0.35) {
            // 删字
            if (chars.length > 3) {
                const pos = Math.floor(Math.random() * chars.length);
                chars.splice(pos, 1);
            }
        } else if (op < 0.60) {
            // 扭曲词义：随机替换字符
            const start = Math.floor(Math.random() * Math.max(1, chars.length - 4));
            const cnt = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < cnt && start + i < chars.length; i++) {
                if (/[a-zA-Z0-9\u4e00-\u9fa5]/.test(chars[start + i])) {
                    chars[start + i] = distortChar(chars[start + i]);
                }
            }
        }

        el.textContent = chars.join('');
        step++;
        const delay = 400 + step * 80 + Math.random() * 300;
        setTimeout(tick, delay);
    };

    setTimeout(tick, 1200 + Math.random() * 600);

    // 停止条件：用户点击任意选项
    const stop = () => { stopped = true; };
    const stopWrap = () => { stop(); document.querySelectorAll('.opt-btn').forEach(b => b.removeEventListener('click', stopWrap)); };
    document.querySelectorAll('.opt-btn').forEach(b => b.addEventListener('click', stopWrap, { once: true }));
}

function observeOptionCorruption(btn, origLabel, letter) {
    let corrupted = false;
    const labelSpan = btn.querySelector('span:last-child');

    const tryCorrupt = () => {
        if (corrupted) return;
        corrupted = true;
        const text = origLabel;
        const chars = text.split('');
        const op = Math.random();

        if (op < 0.25) {
            // 添字
            const pos = Math.floor(Math.random() * Math.max(1, chars.length));
            chars.splice(pos, 0, '的');
        } else if (op < 0.45) {
            // 简繁
            const tc = {'为':'為','会':'會','开':'開','关':'關','来':'來','时':'時','对':'對','无':'無','实':'實','过':'過','当':'當','书':'書','东':'東','马':'馬','鸟':'鳥','鱼':'魚','学':'學','与':'與','经':'經','总':'總','产':'產','业':'業'};
            chars.forEach((c, i) => { if (tc[c]) chars[i] = tc[c]; });
        } else if (op < 0.65) {
            // 替换字符
            chars.forEach((c, i) => { if (Math.random() < 0.3) chars[i] = distortChar(c); });
        } else {
            // 打乱顺序
            const si = Math.floor(Math.random() * Math.max(1, chars.length - 2));
            if (si + 2 < chars.length) {
                [chars[si], chars[si+2]] = [chars[si+2], chars[si]];
            }
        }
        labelSpan.textContent = chars.join('');
    };

    // 鼠标悬停时有机会腐坏（用户犹豫时）
    btn.addEventListener('mouseenter', () => {
        if (Math.random() < 0.45) tryCorrupt();
    }, { once: true });
}

// ================================================================
// 启动
// ================================================================
$('start').onclick = () => {
    if (started) return;
    started = true;
    startTime = Date.now();
    lastClick = Date.now();
    startBGM();
    welcome.style.display = 'none';
    document.body.style.opacity = '0';
    setTimeout(() => {
        document.body.style.transition = 'opacity 1.5s';
        document.body.style.opacity = '1';
        renderQ(0);
    }, 100);
};

qTEl.textContent = TOTAL;
qN.textContent = '0';
prog.style.width = '0%';

document.body.style.opacity = '0';
setTimeout(() => {
    document.body.style.transition = 'opacity 1.5s';
    document.body.style.opacity = '1';
}, 150);
</script>
